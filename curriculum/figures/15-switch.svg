  <rect class="fig-box" x="292" y="196" width="136" height="26" rx="3"/>
  <text class="fig-mono" x="360" y="214" text-anchor="middle" font-size="12">tasks[B].rsp</text>
  <line class="fig-line" x1="192" y1="233" x2="290" y2="173" marker-end="url(#15-switch-arrow)"/>
  <text class="fig-mono" x="244" y="252" text-anchor="middle" font-size="12">mov [rdi], rsp</text>
  <line class="fig-line" x1="430" y1="209" x2="528" y2="233" marker-end="url(#15-switch-arrow)"/>
  <text class="fig-mono" x="480" y="252" text-anchor="middle" font-size="12">mov rsp, rsi</text>
  <text class="fig-muted" x="360" y="290" text-anchor="middle" font-size="12">then pop six registers and ret</text>
</svg>
