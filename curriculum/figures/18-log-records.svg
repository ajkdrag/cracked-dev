<svg viewBox="0 0 720 250" role="img" aria-label="The log file is a row of records, each an 8-byte header with the payload length and a CRC, then the payload. The key-value store&#x27;s payload holds the key length, value length, key and value. The last record was cut by a crash, so opening the log stops at the end of the last whole record and truncates the torn tail">
