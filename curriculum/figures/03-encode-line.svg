<svg viewBox="0 0 720 350" role="img" aria-label="The assembler cleans one line, splits it into its dest, comp and jump fields, looks each field up in its table, combines the three codes into one 16-bit word">
  <defs>
    <marker id="03-encode-line-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="53" font-size="13" font-weight="600">one line</text>
  <text x="20" y="117" font-size="13" font-weight="600">clean</text>
  <text x="20" y="181" font-size="13" font-weight="600">split</text>
  <text x="20" y="245" font-size="13" font-weight="600">look up</text>
  <text x="20" y="309" font-size="13" font-weight="600">combine</text>
  <rect class="fig-box" x="130" y="30" width="300" height="36" rx="6"/>
  <text class="fig-mono" x="144" y="53" font-size="13">   D=M+1;JGT   // compare\r</text>
  <line class="fig-line" x1="280" y1="66" x2="280" y2="92" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-box" x="130" y="94" width="300" height="36" rx="6"/>
  <text class="fig-mono" x="280" y="117" text-anchor="middle" font-size="13">D=M+1;JGT</text>
  <text class="fig-muted" x="450" y="117" font-size="12">comment, spaces, \r gone</text>
  <line class="fig-line" x1="170" y1="130" x2="170" y2="156" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-box" x="130" y="158" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="170" y="181" text-anchor="middle" font-size="13">D</text>
  <line class="fig-line" x1="170" y1="194" x2="170" y2="220" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-accent" x="130" y="222" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="170" y="245" text-anchor="middle" font-size="13">010</text>
  <line class="fig-line" x1="280" y1="130" x2="280" y2="156" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-box" x="240" y="158" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="280" y="181" text-anchor="middle" font-size="13">M+1</text>
  <line class="fig-line" x1="280" y1="194" x2="280" y2="220" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-accent" x="240" y="222" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="280" y="245" text-anchor="middle" font-size="13">1 110111</text>
  <line class="fig-line" x1="390" y1="130" x2="390" y2="156" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-box" x="350" y="158" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="390" y="181" text-anchor="middle" font-size="13">JGT</text>
  <line class="fig-line" x1="390" y1="194" x2="390" y2="220" marker-end="url(#03-encode-line-arrow)"/>
  <rect class="fig-accent" x="350" y="222" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="390" y="245" text-anchor="middle" font-size="13">001</text>
  <text class="fig-muted" x="450" y="181" font-size="12">at the = and the ;</text>
  <text class="fig-muted" x="450" y="237" font-size="12">a and comp, dest, jump</text>
  <text class="fig-muted" x="450" y="253" font-size="12">from the tables of 4.2.3</text>
  <line class="fig-line" x1="170" y1="258" x2="280" y2="284"/>
  <line class="fig-line" x1="280" y1="258" x2="280" y2="284" marker-end="url(#03-encode-line-arrow)"/>
  <line class="fig-line" x1="390" y1="258" x2="280" y2="284"/>
  <rect class="fig-accent" x="130" y="286" width="300" height="36" rx="6"/>
  <text class="fig-mono" x="280" y="309" text-anchor="middle" font-size="14">1111110111010001</text>
  <text class="fig-mono" x="450" y="301" font-size="12">7 &lt;&lt; 13 | a &lt;&lt; 12 | comp &lt;&lt; 6</text>
  <text class="fig-mono" x="450" y="317" font-size="12">  | dest &lt;&lt; 3 | jump</text>
</svg>
