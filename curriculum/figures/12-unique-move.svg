<svg viewBox="0 0 720 230" role="img" aria-label="Before auto b = std::move(a), a owns the heap node. After it, b owns the node and a holds nullptr. a-&gt;eval() still compiles and crashes at run time, where Rust refuses the same code at compile time.">
  <defs>
    <marker id="12-unique-move-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle" font-size="13" font-weight="600">before</text>
  <text x="540" y="30" text-anchor="middle" font-size="13" font-weight="600">after auto b = std::move(a);</text>

  <rect class="fig-box" x="40" y="54" width="100" height="40" rx="6"/>
  <text class="fig-mono" x="90" y="79" text-anchor="middle" font-size="12">a</text>
  <rect class="fig-accent" x="220" y="54" width="120" height="40" rx="6"/>
  <text x="280" y="79" text-anchor="middle" font-size="13">Bin node</text>
  <line class="fig-line" x1="140" y1="74" x2="218" y2="74" marker-end="url(#12-unique-move-arrow)"/>
  <text class="fig-muted" x="179" y="66" text-anchor="middle" font-size="12">owns</text>
  <text class="fig-muted" x="90" y="124" text-anchor="middle" font-size="12">no b yet</text>

  <line class="fig-line" x1="360" y1="44" x2="360" y2="200" stroke-dasharray="3 3"/>

  <rect class="fig-box" x="400" y="54" width="100" height="40" rx="6"/>
  <text class="fig-mono" x="450" y="79" text-anchor="middle" font-size="12">a</text>
  <text class="fig-mono" x="520" y="79" font-size="12">nullptr</text>
  <rect class="fig-box" x="400" y="110" width="100" height="40" rx="6"/>
  <text class="fig-mono" x="450" y="135" text-anchor="middle" font-size="12">b</text>
  <rect class="fig-accent" x="580" y="110" width="120" height="40" rx="6"/>
  <text x="640" y="135" text-anchor="middle" font-size="13">Bin node</text>
  <line class="fig-line" x1="500" y1="130" x2="578" y2="130" marker-end="url(#12-unique-move-arrow)"/>
  <text class="fig-muted" x="539" y="122" text-anchor="middle" font-size="12">owns</text>

  <text class="fig-accent-text" x="400" y="182" font-size="12"><tspan class="fig-mono">a-&gt;eval()</tspan> compiles, then crashes</text>
  <text class="fig-muted" x="400" y="204" font-size="12">Rust: "borrow of moved value", at compile time</text>
</svg>
