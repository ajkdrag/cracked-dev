<svg viewBox="0 0 720 300" role="img" aria-label="The out-of-order core: the branch predictor steers the front end, which fetches and decodes instructions in order. The renamer gives each result its own physical register, the scheduler sends each instruction to a free execution port once its inputs are ready, and results retire in program order">
