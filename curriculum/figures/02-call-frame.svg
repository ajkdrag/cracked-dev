<svg viewBox="0 0 720 330" role="img" aria-label="During swap_ints at -O0 the stack holds main's frame, then the return address pushed by call, then swap_ints's frame with the saved rbp, where rsp and rbp point, and the slots for a, b and tmp below it">
  <defs>
    <marker id="02-call-frame-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="370" y="36" text-anchor="middle" font-size="12">high addresses</text>
  <rect class="fig-box" x="220" y="50" width="300" height="34" rx="6"/>
  <text class="fig-mono" x="236" y="72" font-size="13">int x = 1</text>
  <text class="fig-muted" x="506" y="72" text-anchor="end" font-size="12">main's local</text>
  <rect class="fig-box" x="220" y="84" width="300" height="34" rx="6"/>
  <text class="fig-mono" x="236" y="106" font-size="13">int y = 2</text>
  <text class="fig-muted" x="506" y="106" text-anchor="end" font-size="12">main's local</text>
  <rect class="fig-accent" x="220" y="118" width="300" height="34" rx="6"/>
  <text x="236" y="140" font-size="13">return address</text>
  <text class="fig-muted" x="506" y="140" text-anchor="end" font-size="12">pushed by call</text>
  <rect class="fig-accent" x="220" y="152" width="300" height="34" rx="6"/>
  <text class="fig-mono" x="236" y="174" font-size="13">saved %rbp</text>
  <text class="fig-muted" x="506" y="174" text-anchor="end" font-size="12">pushed by swap_ints</text>
  <rect class="fig-box" x="220" y="186" width="300" height="34" rx="6"/>
  <text class="fig-mono" x="236" y="208" font-size="13">a = &amp;x</text>
  <text class="fig-mono fig-muted" x="506" y="208" text-anchor="end" font-size="12">-8(%rbp)</text>
  <rect class="fig-box" x="220" y="220" width="300" height="34" rx="6"/>
  <text class="fig-mono" x="236" y="242" font-size="13">b = &amp;y</text>
  <text class="fig-mono fig-muted" x="506" y="242" text-anchor="end" font-size="12">-16(%rbp)</text>
  <rect class="fig-box" x="220" y="254" width="300" height="34" rx="6"/>
  <text class="fig-mono" x="236" y="276" font-size="13">int tmp</text>
  <text class="fig-mono fig-muted" x="506" y="276" text-anchor="end" font-size="12">-20(%rbp)</text>
  <line class="fig-line" x1="204" y1="52" x2="204" y2="116"/>
  <line class="fig-line" x1="204" y1="52" x2="212" y2="52"/>
  <line class="fig-line" x1="204" y1="116" x2="212" y2="116"/>
  <text x="194" y="88" text-anchor="end" font-size="13">main's frame</text>
  <line class="fig-line" x1="204" y1="154" x2="204" y2="286"/>
  <line class="fig-line" x1="204" y1="154" x2="212" y2="154"/>
  <line class="fig-line" x1="204" y1="286" x2="212" y2="286"/>
  <text x="194" y="224" text-anchor="end" font-size="13">swap_ints's frame</text>
  <line class="fig-accent-line" x1="660" y1="169" x2="524" y2="169" marker-end="url(#02-call-frame-arrow)"/>
  <text class="fig-mono fig-accent-text" x="592" y="160" text-anchor="middle" font-size="13">%rsp, %rbp</text>
  <text class="fig-muted" x="370" y="312" text-anchor="middle" font-size="12">low addresses</text>
</svg>
