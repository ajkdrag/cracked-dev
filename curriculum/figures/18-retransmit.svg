<svg viewBox="0 0 720 330" role="img" aria-label="Two ways a sender finds a lost segment. On the left, segment 2 is lost, no ACK comes back, and the retransmission timer fires and resends it. On the right, segment 2 is lost but 3, 4 and 5 arrive, each answered by a duplicate ACK for 2, and the third duplicate makes the sender resend 2 at once">
  <defs>
    <marker id="18-retransmit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="180.0" y="28" text-anchor="middle" font-size="13" font-weight="600">loss found by timeout</text>
  <text class="fig-muted" x="70" y="50" text-anchor="middle" font-size="12">sender</text>
  <text class="fig-muted" x="290" y="50" text-anchor="middle" font-size="12">receiver</text>
  <line class="fig-line" x1="70" y1="58" x2="70" y2="318"/>
  <line class="fig-line" x1="290" y1="58" x2="290" y2="318"/>
  <line class="fig-line" x1="70" y1="72" x2="290" y2="96" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="136.0" y="75.2" text-anchor="middle" font-size="12">seg 1</text>
  <line class="fig-line" x1="290" y1="104" x2="70" y2="128" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="180.0" y="112.0" text-anchor="middle" font-size="12">ACK 2</text>
  <line class="fig-line" x1="70" y1="140" x2="180.0" y2="152"/>
  <text class="fig-accent-text" x="184.0" y="157" font-size="16">×</text>
  <text class="fig-mono" x="125.0" y="142" text-anchor="middle" font-size="12">seg 2</text>
  <line class="fig-accent-line" x1="60" y1="140" x2="60" y2="246"/>
  <line class="fig-accent-line" x1="56" y1="140" x2="64" y2="140"/>
  <line class="fig-accent-line" x1="56" y1="246" x2="64" y2="246"/>
  <text class="fig-accent-text" x="54" y="192" text-anchor="end" font-size="12">RTO</text>
  <line class="fig-accent-line" x1="70" y1="250" x2="290" y2="274" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-accent-text" x="158.0" y="255.60000000000002" text-anchor="middle" font-size="12">seg 2 again</text>
  <line class="fig-line" x1="290" y1="280" x2="70" y2="304" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="180.0" y="288.0" text-anchor="middle" font-size="12">ACK 3</text>
  <text x="540.0" y="28" text-anchor="middle" font-size="13" font-weight="600">loss found by duplicate ACKs</text>
  <text class="fig-muted" x="430" y="50" text-anchor="middle" font-size="12">sender</text>
  <text class="fig-muted" x="650" y="50" text-anchor="middle" font-size="12">receiver</text>
  <line class="fig-line" x1="430" y1="58" x2="430" y2="318"/>
  <line class="fig-line" x1="650" y1="58" x2="650" y2="318"/>
  <line class="fig-line" x1="430" y1="72" x2="540.0" y2="84"/>
  <text class="fig-accent-text" x="544.0" y="89" font-size="16">×</text>
  <text class="fig-mono" x="485.0" y="74" text-anchor="middle" font-size="12">seg 2</text>
  <line class="fig-line" x1="430" y1="96" x2="650" y2="120" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="496.0" y="99.2" text-anchor="middle" font-size="12">seg 3</text>
  <line class="fig-line" x1="650" y1="120" x2="430" y2="144" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="540.0" y="128.0" text-anchor="middle" font-size="12">dup ACK 2</text>
  <line class="fig-line" x1="430" y1="152" x2="650" y2="176" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="496.0" y="155.2" text-anchor="middle" font-size="12">seg 4</text>
  <line class="fig-line" x1="650" y1="176" x2="430" y2="200" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="540.0" y="184.0" text-anchor="middle" font-size="12">dup ACK 2</text>
  <line class="fig-line" x1="430" y1="208" x2="650" y2="232" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="496.0" y="211.2" text-anchor="middle" font-size="12">seg 5</text>
  <line class="fig-accent-line" x1="650" y1="232" x2="430" y2="256" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-accent-text" x="540.0" y="240.0" text-anchor="middle" font-size="12">3rd dup ACK 2</text>
  <line class="fig-accent-line" x1="430" y1="262" x2="650" y2="286" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-accent-text" x="529.0" y="268.8" text-anchor="middle" font-size="12">seg 2 again</text>
  <line class="fig-line" x1="650" y1="288" x2="430" y2="312" marker-end="url(#18-retransmit-arrow)"/>
  <text class="fig-mono" x="540.0" y="296.0" text-anchor="middle" font-size="12">ACK 6</text>
</svg>
