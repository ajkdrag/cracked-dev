<svg viewBox="0 0 720 320" role="img" aria-label="One mma_sync: the 32 threads of a warp together multiply a 16 by 16 half tile of A by a 16 by 16 half tile of B and add a 16 by 16 float tile. The accumulator fragment gives each thread 8 of the 256 floats, and which 8 is not specified.">
