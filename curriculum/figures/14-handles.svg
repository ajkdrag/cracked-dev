<svg viewBox="0 0 720 240" role="img" aria-label="Slot 3 holds an enemy with generation 7, and a handle {3, 7} finds it. After the enemy dies the slot's generation is 8, a new bullet takes the slot, and the old handle {3, 7} now returns null.">
