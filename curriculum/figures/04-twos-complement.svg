<svg viewBox="0 0 720 310" role="img" aria-label="One byte holding 11001000 reads as 200 in a uint8_t and as -56 in an int8_t. Widened to 32 bits, the int8_t copies its sign bit into the new bytes and the uint8_t fills them with zeros.">
  <defs>
    <marker id="04-twos-complement-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="14" font-weight="600">One byte, two types</text>
  <rect class="fig-accent" x="170" y="44" width="48" height="40"/>
  <text class="fig-mono" x="194.0" y="70" text-anchor="middle" font-size="15">1</text>
  <rect class="fig-box" x="218" y="44" width="48" height="40"/>
  <text class="fig-mono" x="242.0" y="70" text-anchor="middle" font-size="15">1</text>
  <rect class="fig-box" x="266" y="44" width="48" height="40"/>
  <text class="fig-mono" x="290.0" y="70" text-anchor="middle" font-size="15">0</text>
  <rect class="fig-box" x="314" y="44" width="48" height="40"/>
  <text class="fig-mono" x="338.0" y="70" text-anchor="middle" font-size="15">0</text>
  <rect class="fig-box" x="362" y="44" width="48" height="40"/>
  <text class="fig-mono" x="386.0" y="70" text-anchor="middle" font-size="15">1</text>
  <rect class="fig-box" x="410" y="44" width="48" height="40"/>
  <text class="fig-mono" x="434.0" y="70" text-anchor="middle" font-size="15">0</text>
  <rect class="fig-box" x="458" y="44" width="48" height="40"/>
  <text class="fig-mono" x="482.0" y="70" text-anchor="middle" font-size="15">0</text>
  <rect class="fig-box" x="506" y="44" width="48" height="40"/>
  <text class="fig-mono" x="530.0" y="70" text-anchor="middle" font-size="15">0</text>
  <text class="fig-muted" x="166" y="112" text-anchor="end" font-size="12">uint8_t weights</text>
  <text class="fig-muted" x="166" y="136" text-anchor="end" font-size="12">int8_t weights</text>
  <text class="fig-mono" x="194.0" y="112" text-anchor="middle" font-size="12">128</text>
  <text class="fig-mono fig-accent-text" x="194.0" y="136" text-anchor="middle" font-size="12">-128</text>
  <text class="fig-mono" x="242.0" y="112" text-anchor="middle" font-size="12">64</text>
  <text class="fig-mono" x="242.0" y="136" text-anchor="middle" font-size="12">64</text>
  <text class="fig-mono" x="290.0" y="112" text-anchor="middle" font-size="12">32</text>
  <text class="fig-mono" x="290.0" y="136" text-anchor="middle" font-size="12">32</text>
  <text class="fig-mono" x="338.0" y="112" text-anchor="middle" font-size="12">16</text>
  <text class="fig-mono" x="338.0" y="136" text-anchor="middle" font-size="12">16</text>
  <text class="fig-mono" x="386.0" y="112" text-anchor="middle" font-size="12">8</text>
  <text class="fig-mono" x="386.0" y="136" text-anchor="middle" font-size="12">8</text>
  <text class="fig-mono" x="434.0" y="112" text-anchor="middle" font-size="12">4</text>
  <text class="fig-mono" x="434.0" y="136" text-anchor="middle" font-size="12">4</text>
  <text class="fig-mono" x="482.0" y="112" text-anchor="middle" font-size="12">2</text>
  <text class="fig-mono" x="482.0" y="136" text-anchor="middle" font-size="12">2</text>
  <text class="fig-mono" x="530.0" y="112" text-anchor="middle" font-size="12">1</text>
  <text class="fig-mono" x="530.0" y="136" text-anchor="middle" font-size="12">1</text>
  <text class="fig-mono" x="572" y="112" font-size="12">128+64+8 = 200</text>
  <text class="fig-mono fig-accent-text" x="572" y="136" font-size="12">-128+64+8 = -56</text>
  <text x="20" y="186" font-size="14" font-weight="600">Widened to 32 bits</text>
  <text class="fig-mono" x="166" y="223" text-anchor="end" font-size="13">int8_t -56</text>
  <rect class="fig-accent" x="170" y="200" width="80" height="34"/>
  <text class="fig-mono" x="210.0" y="223" text-anchor="middle" font-size="14">FF</text>
  <rect class="fig-accent" x="250" y="200" width="80" height="34"/>
  <text class="fig-mono" x="290.0" y="223" text-anchor="middle" font-size="14">FF</text>
  <rect class="fig-accent" x="330" y="200" width="80" height="34"/>
  <text class="fig-mono" x="370.0" y="223" text-anchor="middle" font-size="14">FF</text>
  <rect class="fig-box" x="410" y="200" width="80" height="34"/>
  <text class="fig-mono" x="450.0" y="223" text-anchor="middle" font-size="14">C8</text>
  <text class="fig-muted" x="510" y="223" font-size="12">sign extended: -56</text>
  <text class="fig-mono" x="166" y="277" text-anchor="end" font-size="13">uint8_t 200</text>
  <rect class="fig-box" x="170" y="254" width="80" height="34"/>
  <text class="fig-mono" x="210.0" y="277" text-anchor="middle" font-size="14">00</text>
  <rect class="fig-box" x="250" y="254" width="80" height="34"/>
  <text class="fig-mono" x="290.0" y="277" text-anchor="middle" font-size="14">00</text>
  <rect class="fig-box" x="330" y="254" width="80" height="34"/>
  <text class="fig-mono" x="370.0" y="277" text-anchor="middle" font-size="14">00</text>
  <rect class="fig-box" x="410" y="254" width="80" height="34"/>
  <text class="fig-mono" x="450.0" y="277" text-anchor="middle" font-size="14">C8</text>
  <text class="fig-muted" x="510" y="277" font-size="12">zero extended: 200</text>
</svg>
