<svg viewBox="0 0 720 330" role="img" aria-label="The RP2350's address space from the bottom up: the boot ROM at 0x00000000, the flash chip through XIP at 0x10000000, 520 KB of SRAM at 0x20000000, the peripheral registers at 0x40000000 and 0x50000000, SIO, the block that drives the pins, at 0xd0000000 and the core's own registers at 0xe0000000.">
  <text class="fig-muted" x="150" y="32" text-anchor="end" font-size="12">address</text>
  <text class="fig-muted" x="281" y="32" text-anchor="middle" font-size="12">what answers there</text>
  <text class="fig-muted" x="420" y="32" font-size="12">what this chapter puts or uses there</text>

  <text class="fig-mono" x="150" y="64" text-anchor="end" font-size="13">0xe0000000</text>
  <rect class="fig-box" x="166" y="44" width="230" height="34" rx="6"/>
  <text x="281" y="66" text-anchor="middle" font-size="13">the core's own registers</text>
  <text class="fig-muted" x="420" y="66" font-size="12">NVIC, VTOR, fault status</text>

  <text class="fig-mono" x="150" y="104" text-anchor="end" font-size="13">0xd0000000</text>
  <rect class="fig-box" x="166" y="84" width="230" height="34" rx="6"/>
  <text x="281" y="106" text-anchor="middle" font-size="13">SIO: pins, next to each core</text>
  <text class="fig-muted" x="420" y="106" font-size="12">GPIO output and output enable</text>

  <text class="fig-mono" x="150" y="144" text-anchor="end" font-size="13">0x50000000</text>
  <rect class="fig-box" x="166" y="124" width="230" height="34" rx="6"/>
  <text x="281" y="146" text-anchor="middle" font-size="13">faster peripherals</text>
  <text class="fig-muted" x="420" y="146" font-size="12">DMA, USB, PIO: not used</text>

  <text class="fig-mono" x="150" y="184" text-anchor="end" font-size="13">0x40000000</text>
  <rect class="fig-box" x="166" y="164" width="230" height="34" rx="6"/>
  <text x="281" y="186" text-anchor="middle" font-size="13">peripherals</text>
  <text class="fig-muted" x="420" y="186" font-size="12">RESETS, pins, clocks, TIMER0, UART0</text>

  <text class="fig-mono" x="150" y="224" text-anchor="end" font-size="13">0x20000000</text>
  <rect class="fig-accent" x="166" y="204" width="230" height="34" rx="6"/>
  <text x="281" y="226" text-anchor="middle" font-size="13">SRAM, 520 KB</text>
  <text class="fig-muted" x="420" y="226" font-size="12">variables and the stack</text>

  <text class="fig-mono" x="150" y="264" text-anchor="end" font-size="13">0x10000000</text>
  <rect class="fig-accent" x="166" y="244" width="230" height="34" rx="6"/>
  <text x="281" y="266" text-anchor="middle" font-size="13">flash through XIP, 4 MB</text>
  <text class="fig-muted" x="420" y="266" font-size="12">your image: code and constants</text>

  <text class="fig-mono" x="150" y="304" text-anchor="end" font-size="13">0x00000000</text>
  <rect class="fig-box" x="166" y="284" width="230" height="34" rx="6"/>
  <text x="281" y="306" text-anchor="middle" font-size="13">boot ROM, 32 KB</text>
  <text class="fig-muted" x="420" y="306" font-size="12">runs first at every reset</text>
</svg>
