<svg viewBox="0 0 720 340" role="img" aria-label="The kernel stack overflows into the unmapped guard page. The page fault and then the double fault both try to push their frame onto the same stack and fail, which resets the CPU. With an IST entry in the TSS, the CPU switches to a separate stack for the double fault, and the push succeeds.">
  <defs>
    <marker id="15-double-fault-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="600">kernel stack</text>
  <rect class="fig-box" x="60" y="36" width="140" height="150" rx="6"/>
  <text class="fig-muted" x="130" y="100" text-anchor="middle" font-size="12">frames of</text>
  <text class="fig-mono" x="130" y="117" text-anchor="middle" font-size="12">stack_overflow()</text>
  <rect class="fig-accent" x="60" y="186" width="140" height="56" rx="0" stroke-dasharray="4 3"/>
  <text x="130" y="210" text-anchor="middle" font-size="13" font-weight="600">guard page</text>
  <text class="fig-muted" x="130" y="228" text-anchor="middle" font-size="12">not mapped</text>
  <text class="fig-muted" x="130" y="262" text-anchor="middle" font-size="12">grows down</text>
  <line class="fig-line" x1="130" y1="160" x2="130" y2="182" marker-end="url(#15-double-fault-arrow)"/>
  <line class="fig-line" x1="22" y1="200" x2="58" y2="200" marker-end="url(#15-double-fault-arrow)"/>
  <text class="fig-mono" x="20" y="192" text-anchor="start" font-size="12">rsp</text>
  <text x="370" y="26" text-anchor="middle" font-size="13" font-weight="600">without IST</text>
  <rect class="fig-box" x="270" y="40" width="200" height="44" rx="6"/>
  <text x="370.0" y="57.5" text-anchor="middle" font-size="13" font-weight="600">page fault</text>
  <text class="fig-muted" x="370.0" y="75.5" text-anchor="middle" font-size="12">push to guard page fails</text>
  <rect class="fig-box" x="270" y="110" width="200" height="44" rx="6"/>
  <text x="370.0" y="127.5" text-anchor="middle" font-size="13" font-weight="600">double fault</text>
  <text class="fig-muted" x="370.0" y="145.5" text-anchor="middle" font-size="12">push fails again</text>
  <rect class="fig-box" x="270" y="180" width="200" height="44" rx="6"/>
  <text x="370.0" y="197.5" text-anchor="middle" font-size="13" font-weight="600">triple fault</text>
  <text class="fig-muted" x="370.0" y="215.5" text-anchor="middle" font-size="12">the CPU resets</text>
  <line class="fig-line" x1="370" y1="84" x2="370" y2="108" marker-end="url(#15-double-fault-arrow)"/>
  <line class="fig-line" x1="370" y1="154" x2="370" y2="178" marker-end="url(#15-double-fault-arrow)"/>
  <line class="fig-line" x1="202" y1="212" x2="268" y2="70" marker-end="url(#15-double-fault-arrow)" stroke-dasharray="4 3"/>
  <text x="600" y="26" text-anchor="middle" font-size="13" font-weight="600">with IST</text>
  <rect class="fig-box" x="510" y="40" width="190" height="70" rx="6"/>
  <text x="605" y="62" text-anchor="middle" font-size="13" font-weight="600">TSS</text>
  <rect class="fig-accent" x="522" y="72" width="166" height="28" rx="3"/>
  <text class="fig-mono" x="605" y="91" text-anchor="middle" font-size="12">IST[0] = stack top</text>
  <rect class="fig-box" x="510" y="150" width="190" height="150" rx="6"/>
  <text class="fig-muted" x="605" y="318" text-anchor="middle" font-size="12">double fault stack</text>
  <rect class="fig-accent" x="530" y="160" width="150" height="20" rx="0"/>
  <text class="fig-mono" x="605" y="175" text-anchor="middle" font-size="12">SS</text>
  <rect class="fig-accent" x="530" y="182" width="150" height="20" rx="0"/>
  <text class="fig-mono" x="605" y="197" text-anchor="middle" font-size="12">RSP</text>
  <rect class="fig-accent" x="530" y="204" width="150" height="20" rx="0"/>
  <text class="fig-mono" x="605" y="219" text-anchor="middle" font-size="12">RFLAGS</text>
  <rect class="fig-accent" x="530" y="226" width="150" height="20" rx="0"/>
  <text class="fig-mono" x="605" y="241" text-anchor="middle" font-size="12">CS</text>
  <rect class="fig-accent" x="530" y="248" width="150" height="20" rx="0"/>
  <text class="fig-mono" x="605" y="263" text-anchor="middle" font-size="12">RIP</text>
  <rect class="fig-accent" x="530" y="270" width="150" height="20" rx="0"/>
  <text class="fig-mono" x="605" y="285" text-anchor="middle" font-size="12">error code</text>
  <line class="fig-line" x1="605" y1="100" x2="605" y2="158" marker-end="url(#15-double-fault-arrow)"/>
  <text class="fig-muted" x="612" y="132" text-anchor="start" font-size="12">rsp from here</text>
  <line class="fig-line" x1="472" y1="132" x2="508" y2="200" marker-end="url(#15-double-fault-arrow)"/>
  <text class="fig-muted" x="474" y="124" text-anchor="start" font-size="12">instead</text>
</svg>
