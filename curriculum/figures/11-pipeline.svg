<svg viewBox="0 0 720 240" role="img" aria-label="The scanner turns the source line print 1 + 2 into tokens, the compiler turns the tokens into a chunk of bytecode, and the VM runs the bytecode and prints 3.">
  <defs>
    <marker id="11-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="81" y="48" text-anchor="middle" font-size="12">source text</text>
  <text class="fig-muted" x="267" y="48" text-anchor="middle" font-size="12">tokens</text>
  <text class="fig-muted" x="453" y="48" text-anchor="middle" font-size="12">bytecode</text>
  <text class="fig-muted" x="639" y="48" text-anchor="middle" font-size="12">output</text>
  <rect class="fig-box" x="21" y="60" width="120" height="150" rx="6"/>
  <text class="fig-mono" x="81" y="140" text-anchor="middle" font-size="13">print 1 + 2;</text>
  <rect class="fig-box" x="207" y="60" width="120" height="150" rx="6"/>
  <text class="fig-mono" x="267" y="88" text-anchor="middle" font-size="12">PRINT</text>
  <text class="fig-mono" x="267" y="109" text-anchor="middle" font-size="12">NUMBER 1</text>
  <text class="fig-mono" x="267" y="130" text-anchor="middle" font-size="12">PLUS</text>
  <text class="fig-mono" x="267" y="151" text-anchor="middle" font-size="12">NUMBER 2</text>
  <text class="fig-mono" x="267" y="172" text-anchor="middle" font-size="12">SEMICOLON</text>
  <text class="fig-mono" x="267" y="193" text-anchor="middle" font-size="12">EOF</text>
  <rect class="fig-accent" x="393" y="60" width="120" height="150" rx="6"/>
  <text class="fig-mono" x="453" y="88" text-anchor="middle" font-size="12">CONSTANT 0</text>
  <text class="fig-mono" x="453" y="109" text-anchor="middle" font-size="12">CONSTANT 1</text>
  <text class="fig-mono" x="453" y="130" text-anchor="middle" font-size="12">ADD</text>
  <text class="fig-mono" x="453" y="151" text-anchor="middle" font-size="12">PRINT</text>
  <text class="fig-mono" x="453" y="172" text-anchor="middle" font-size="12">RETURN</text>
  <text class="fig-muted" x="453" y="196" text-anchor="middle" font-size="11">constants: 1, 2</text>
  <rect class="fig-box" x="579" y="60" width="120" height="150" rx="6"/>
  <text class="fig-mono" x="639" y="140" text-anchor="middle" font-size="14">3</text>
  <line class="fig-line" x1="143" y1="135" x2="204" y2="135" marker-end="url(#11-pipeline-arrow)"/>
  <text x="174.0" y="125" text-anchor="middle" font-size="12" font-weight="600">scanner</text>
  <line class="fig-line" x1="329" y1="135" x2="390" y2="135" marker-end="url(#11-pipeline-arrow)"/>
  <text x="360.0" y="125" text-anchor="middle" font-size="12" font-weight="600">compiler</text>
  <line class="fig-line" x1="515" y1="135" x2="576" y2="135" marker-end="url(#11-pipeline-arrow)"/>
  <text x="546.0" y="125" text-anchor="middle" font-size="12" font-weight="600">VM</text>
</svg>
