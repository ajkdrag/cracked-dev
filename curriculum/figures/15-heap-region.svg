<svg viewBox="0 0 720 300" role="img" aria-label="init_heap maps the 25 pages from 0x4444_4444_0000 to frames that the frame allocator picks anywhere in physical memory. Box and Vec call the global allocator, which hands out pieces of those 100 KiB.">
  <defs>
    <marker id="15-heap-region-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="30" width="160" height="50" rx="6"/>
  <text x="100.0" y="50.5" text-anchor="middle" font-size="13" font-weight="600">Box::new, vec!</text>
  <text class="fig-muted" x="100.0" y="68.5" text-anchor="middle" font-size="12">in kernel code</text>
  <rect class="fig-box" x="250" y="30" width="220" height="50" rx="6"/>
  <text class="fig-mono" x="360.0" y="50.5" text-anchor="middle" font-size="13">#[global_allocator]</text>
  <text class="fig-muted" x="360.0" y="68.5" text-anchor="middle" font-size="12">alloc(layout) -&gt; pointer</text>
  <line class="fig-line" x1="180" y1="55" x2="248" y2="55" marker-end="url(#15-heap-region-arrow)"/>
  <text class="fig-muted" x="214" y="47" text-anchor="middle" font-size="12">calls</text>
  <text x="20" y="122" text-anchor="start" font-size="13" font-weight="600">heap pages</text>
  <rect class="fig-accent" x="120" y="104" width="70" height="34" rx="0"/>
  <rect class="fig-accent" x="190" y="104" width="70" height="34" rx="0"/>
  <rect class="fig-accent" x="260" y="104" width="70" height="34" rx="0"/>
  <rect class="fig-accent" x="330" y="104" width="70" height="34" rx="0"/>
  <rect class="fig-accent" x="400" y="104" width="160" height="34" rx="0"/>
  <text class="fig-mono" x="480" y="126" text-anchor="middle" font-size="12">... 20 more</text>
  <rect class="fig-accent" x="560" y="104" width="70" height="34" rx="0"/>
  <text class="fig-mono" x="120" y="96" text-anchor="start" font-size="12">0x4444_4444_0000</text>
  <text class="fig-mono" x="630" y="96" text-anchor="end" font-size="12">+ 100 KiB</text>
  <line class="fig-line" x1="360" y1="80" x2="360" y2="102" marker-end="url(#15-heap-region-arrow)"/>
  <text class="fig-muted" x="368" y="96" text-anchor="start" font-size="12">points into</text>
  <text x="20" y="232" text-anchor="start" font-size="13" font-weight="600">physical</text>
  <text x="20" y="250" text-anchor="start" font-size="13" font-weight="600">memory</text>
  <rect class="fig-box" x="120" y="214" width="580" height="40" rx="0"/>
  <rect class="fig-accent" x="300" y="214" width="30" height="40" rx="0"/>
  <rect class="fig-accent" x="150" y="214" width="30" height="40" rx="0"/>
  <rect class="fig-accent" x="520" y="214" width="30" height="40" rx="0"/>
  <rect class="fig-accent" x="400" y="214" width="30" height="40" rx="0"/>
  <rect class="fig-accent" x="610" y="214" width="30" height="40" rx="0"/>
  <line class="fig-line" x1="155" y1="140" x2="315" y2="212" marker-end="url(#15-heap-region-arrow)"/>
  <line class="fig-line" x1="225" y1="140" x2="165" y2="212" marker-end="url(#15-heap-region-arrow)"/>
  <line class="fig-line" x1="295" y1="140" x2="535" y2="212" marker-end="url(#15-heap-region-arrow)"/>
  <line class="fig-line" x1="365" y1="140" x2="415" y2="212" marker-end="url(#15-heap-region-arrow)"/>
  <line class="fig-line" x1="595" y1="140" x2="625" y2="212" marker-end="url(#15-heap-region-arrow)"/>
  <text class="fig-muted" x="410" y="280" text-anchor="middle" font-size="12">frames from the frame allocator</text>
</svg>
