<svg viewBox="0 0 720 220" role="img" aria-label="A sampling profiler records the call stack at each timer tick. Of ten samples, eight are inside parse or a function it called, its Children share, and five stop in parse itself, its Self share">
  <text class="fig-muted" x="110" y="30" font-size="12">each tick of a timer records the call stack</text>
  <line class="fig-line" x1="130" y1="42" x2="130" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="170" y1="42" x2="170" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="210" y1="42" x2="210" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="250" y1="42" x2="250" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="290" y1="42" x2="290" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="330" y1="42" x2="330" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="370" y1="42" x2="370" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="410" y1="42" x2="410" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="450" y1="42" x2="450" y2="160" stroke-dasharray="2 4"/>
  <line class="fig-line" x1="490" y1="42" x2="490" y2="160" stroke-dasharray="2 4"/>
  <text x="96" y="64" text-anchor="end" font-size="13">main</text>
  <rect class="fig-box" x="110" y="46" width="420" height="26" rx="6"/>
  <text x="96" y="98" text-anchor="end" font-size="13">parse</text>
  <rect class="fig-accent" x="150" y="80" width="320" height="26" rx="6"/>
  <text x="96" y="132" text-anchor="end" font-size="13">number</text>
  <rect class="fig-box" x="195" y="114" width="40" height="26" rx="6"/>
  <rect class="fig-box" x="315" y="114" width="40" height="26" rx="6"/>
  <rect class="fig-box" x="395" y="114" width="40" height="26" rx="6"/>
  <circle class="fig-box" cx="130" cy="166" r="5"/>
  <circle class="fig-accent-fill" cx="170" cy="166" r="5"/>
  <circle class="fig-box" cx="210" cy="166" r="5"/>
  <circle class="fig-accent-fill" cx="250" cy="166" r="5"/>
  <circle class="fig-accent-fill" cx="290" cy="166" r="5"/>
  <circle class="fig-box" cx="330" cy="166" r="5"/>
  <circle class="fig-accent-fill" cx="370" cy="166" r="5"/>
  <circle class="fig-box" cx="410" cy="166" r="5"/>
  <circle class="fig-accent-fill" cx="450" cy="166" r="5"/>
  <circle class="fig-box" cx="490" cy="166" r="5"/>
  <text class="fig-muted" x="110" y="196" font-size="12">10 samples. Filled: the sample stopped in parse itself</text>
  <text x="570" y="70" font-size="14" font-weight="600">parse</text>
  <text x="570" y="98" font-size="13">Children: 8 of 10</text>
  <text class="fig-muted" x="570" y="116" font-size="12">in parse or below it</text>
  <text class="fig-accent-text" x="570" y="144" font-size="13">Self: 5 of 10</text>
  <text class="fig-muted" x="570" y="162" font-size="12">in parse's own code</text>
</svg>
