<svg viewBox="0 0 720 340" role="img" aria-label="The control flow graph of pick. The entry block ends in a conditional branch to if.then or if.end. Both branch to the return block, whose phi takes %a when control came from if.then and %b when it came from if.end.">
  <defs>
    <marker id="12-if-else-cfg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="170" y="20" width="380" height="76" rx="6"/>
  <text class="fig-mono" x="184" y="42" font-size="12" font-weight="600">entry:</text>
  <text class="fig-mono" x="200" y="62" font-size="12">%cmp = fcmp une double %c, 0.000000e+00</text>
  <text class="fig-mono" x="200" y="82" font-size="12">br i1 %cmp, label %if.then, label %if.end</text>

  <rect class="fig-box" x="40" y="146" width="220" height="56" rx="6"/>
  <text class="fig-mono" x="54" y="168" font-size="12" font-weight="600">if.then:</text>
  <text class="fig-mono" x="70" y="188" font-size="12">br label %return</text>

  <rect class="fig-box" x="460" y="146" width="220" height="56" rx="6"/>
  <text class="fig-mono" x="474" y="168" font-size="12" font-weight="600">if.end:</text>
  <text class="fig-mono" x="490" y="188" font-size="12">br label %return</text>

  <rect class="fig-accent" x="110" y="252" width="500" height="68" rx="6"/>
  <text class="fig-mono" x="124" y="274" font-size="12" font-weight="600">return:</text>
  <text class="fig-mono" x="140" y="294" font-size="12">%retval.0 = phi double <tspan class="fig-accent-fill">[ %a, %if.then ]</tspan>, [ %b, %if.end ]</text>
  <text class="fig-mono" x="140" y="312" font-size="12">ret double %retval.0</text>

  <line class="fig-line" x1="250" y1="96" x2="170" y2="144" marker-end="url(#12-if-else-cfg-arrow)"/>
  <text class="fig-muted" x="196" y="118" text-anchor="end" font-size="12">true</text>
  <line class="fig-line" x1="470" y1="96" x2="550" y2="144" marker-end="url(#12-if-else-cfg-arrow)"/>
  <text class="fig-muted" x="524" y="118" text-anchor="start" font-size="12">false</text>

  <line class="fig-accent-line" x1="170" y1="202" x2="250" y2="250" marker-end="url(#12-if-else-cfg-arrow)"/>
  <text class="fig-accent-text" x="196" y="232" text-anchor="end" font-size="12">brings %a</text>
  <line class="fig-line" x1="550" y1="202" x2="470" y2="250" marker-end="url(#12-if-else-cfg-arrow)"/>
  <text class="fig-muted" x="524" y="232" text-anchor="start" font-size="12">brings %b</text>
</svg>
