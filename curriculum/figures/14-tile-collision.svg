<svg viewBox="0 0 720 300" role="img" aria-label="A move of (+20, +12) resolved one axis at a time. Along x the scan from the right edge finds a wall 6 pixels away, so the box moves 6. Along y the scan from the bottom edge finds the floor 4 pixels away, so the box moves 4 and lands.">
  <defs>
    <marker id="14-tile-collision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="180" y="30" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="180" y="62" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="180" y="94" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="180" y="126" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="180" y="158" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="180" y="190" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="20" y="222" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="52" y="222" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="84" y="222" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="116" y="222" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="148" y="222" width="32" height="32" rx="0"/>
  <rect class="fig-box" x="180" y="222" width="32" height="32" rx="0"/>
  <line class="fig-line" x1="20" y1="30" x2="212" y2="30" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="62" x2="212" y2="62" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="94" x2="212" y2="94" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="126" x2="212" y2="126" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="158" x2="212" y2="158" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="190" x2="212" y2="190" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="222" x2="212" y2="222" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="254" x2="212" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="20" y1="30" x2="20" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="52" y1="30" x2="52" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="84" y1="30" x2="84" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="116" y1="30" x2="116" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="148" y1="30" x2="148" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="180" y1="30" x2="180" y2="254" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="212" y1="30" x2="212" y2="254" stroke-dasharray="4 4"/>
  <rect class="fig-box" x="120" y="154" width="48" height="60" rx="6"/>
  <line class="fig-accent-line" x1="168" y1="214" x2="206" y2="236" stroke-dasharray="4 4" marker-end="url(#14-tile-collision-arrow)"/>
  <rect class="fig-accent" x="132" y="162" width="48" height="60" rx="6"/>
  <text x="156.0" y="198" text-anchor="middle" font-size="12" font-weight="600">end</text>
  <text class="fig-muted" x="116" y="274" text-anchor="middle" font-size="12">outline: start, filled: end</text>
  <text class="fig-muted" x="116" y="292" text-anchor="middle" font-size="12">16-pixel tiles, drawn at 2x</text>
  <text x="260" y="50" font-size="13" font-weight="600">wanted move: x +20, y +12 (dashed)</text>
  <text x="260" y="84" font-size="13" font-weight="600">1. along x</text>
  <text class="fig-muted" x="260" y="104" font-size="12">scan the columns ahead of the right edge,</text>
  <text class="fig-muted" x="260" y="122" font-size="12">in the rows the box covers: wall at 6 px</text>
  <text class="fig-mono" x="260" y="140" font-size="12">move x by min(20, 6) = 6</text>
  <text x="260" y="174" font-size="13" font-weight="600">2. along y, from the new x</text>
  <text class="fig-muted" x="260" y="194" font-size="12">scan the rows below the bottom edge,</text>
  <text class="fig-muted" x="260" y="212" font-size="12">in the columns the box covers: floor at 4 px</text>
  <text class="fig-mono" x="260" y="230" font-size="12">move y by min(12, 4) = 4, and the box lands</text>
  <text class="fig-muted" x="260" y="262" font-size="12">the scan covers every tile on the way, so no move skips a wall</text>
</svg>
