<svg viewBox="0 0 720 320" role="img" aria-label="The RISC-V frame chain: s0 points just above the current frame, the return address is at s0 - 8 and the caller&#x27;s frame pointer at s0 - 16, which points just above the caller&#x27;s frame">
  <defs>
    <marker id="08-frame-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="390.0" y="24" text-anchor="middle" font-size="12">higher addresses</text>
  <rect class="fig-box" x="280" y="34" width="220" height="30" rx="6"/>
  <text class="fig-muted" x="390.0" y="54" text-anchor="middle" font-size="12">frames further up</text>
  <rect class="fig-box" x="280" y="64" width="220" height="34" rx="0"/>
  <text x="390.0" y="86" text-anchor="middle" font-size="13">return address</text>
  <rect class="fig-box" x="280" y="98" width="220" height="34" rx="0"/>
  <text x="390.0" y="120" text-anchor="middle" font-size="13">saved frame pointer</text>
  <rect class="fig-box" x="280" y="132" width="220" height="34" rx="0"/>
  <text x="390.0" y="154" text-anchor="middle" font-size="13">locals</text>
  <rect class="fig-accent" x="280" y="166" width="220" height="34" rx="0"/>
  <text x="390.0" y="188" text-anchor="middle" font-size="13">return address</text>
  <rect class="fig-accent" x="280" y="200" width="220" height="34" rx="0"/>
  <text x="390.0" y="222" text-anchor="middle" font-size="13">saved frame pointer</text>
  <rect class="fig-box" x="280" y="234" width="220" height="34" rx="0"/>
  <text x="390.0" y="256" text-anchor="middle" font-size="13">locals</text>
  <text class="fig-muted" x="390.0" y="290" text-anchor="middle" font-size="12">lower addresses</text>
  <text class="fig-mono" x="264" y="187" text-anchor="end" font-size="12">s0 - 8</text>
  <text class="fig-mono" x="264" y="221" text-anchor="end" font-size="12">s0 - 16</text>
  <rect class="fig-box" x="30" y="146" width="100" height="40" rx="6"/>
  <text class="fig-mono" x="80.0" y="171.0" text-anchor="middle" font-size="13">s0</text>
  <path class="fig-line" d="M130 166 L278 166" marker-end="url(#08-frame-chain-arrow)"/>
  <path class="fig-line" d="M500 217 L560 217 L560 64 L502 64" marker-end="url(#08-frame-chain-arrow)"/>
  <text class="fig-muted" x="568" y="145" font-size="12">points at</text>
  <text class="fig-muted" x="568" y="161" font-size="12">the caller's</text>
  <text class="fig-muted" x="568" y="177" font-size="12">frame</text>
  <line class="fig-line" x1="272" y1="66" x2="272" y2="164"/>
  <line class="fig-line" x1="272" y1="168" x2="272" y2="266"/>
  <text class="fig-muted" x="264" y="120" text-anchor="end" font-size="12">caller's frame</text>
  <text class="fig-muted" x="264" y="254" text-anchor="end" font-size="12">current frame</text>
</svg>
