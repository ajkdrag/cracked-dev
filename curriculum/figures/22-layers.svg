<svg viewBox="0 0 720 390" role="img" aria-label="The layers of MiniTorch, top to bottom: your model, autograd, the tensor, the three primitives and the backends that run them.">
  <defs>
    <marker id="22-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="200" y="20" width="500" height="48" rx="6"/>
  <text x="216" y="41" font-size="14" font-weight="600">your model</text>
  <text class="fig-muted" x="216" y="59" font-size="12">Module, Parameter, Linear, Conv2d</text>
  <text class="fig-muted" x="686" y="41" text-anchor="end" font-size="12">modules 0, 4</text>
  <line class="fig-line" x1="450.0" y1="68" x2="450.0" y2="82" marker-end="url(#22-layers-arrow)"/>
  <rect class="fig-box" x="200" y="84" width="500" height="48" rx="6"/>
  <text x="216" y="105" font-size="14" font-weight="600">autograd</text>
  <text class="fig-muted" x="216" y="123" font-size="12">Function.apply records History, backward walks it</text>
  <text class="fig-muted" x="686" y="105" text-anchor="end" font-size="12">modules 1, 2</text>
  <line class="fig-line" x1="450.0" y1="132" x2="450.0" y2="146" marker-end="url(#22-layers-arrow)"/>
  <rect class="fig-box" x="200" y="148" width="500" height="48" rx="6"/>
  <text x="216" y="169" font-size="14" font-weight="600">Tensor</text>
  <text class="fig-muted" x="216" y="187" font-size="12">TensorData: storage, shape, strides</text>
  <text class="fig-muted" x="686" y="169" text-anchor="end" font-size="12">module 2</text>
  <line class="fig-line" x1="450.0" y1="196" x2="450.0" y2="210" marker-end="url(#22-layers-arrow)"/>
  <rect class="fig-box" x="200" y="212" width="500" height="48" rx="6"/>
  <text x="216" y="233" font-size="14" font-weight="600">map, zip, reduce, matmul</text>
  <text class="fig-muted" x="216" y="251" font-size="12">TensorBackend calls one TensorOps class</text>
  <text class="fig-muted" x="686" y="233" text-anchor="end" font-size="12">modules 2, 3</text>
  <line class="fig-line" x1="450.0" y1="260" x2="450.0" y2="274" marker-end="url(#22-layers-arrow)"/>
  <rect class="fig-box" x="204" y="276" width="116" height="72" rx="6"/>
  <text x="262.0" y="300" text-anchor="middle" font-size="13" font-weight="600">SimpleOps</text>
  <text class="fig-muted" x="262.0" y="319" text-anchor="middle" font-size="12">Python loops</text>
  <text class="fig-muted" x="262.0" y="336" text-anchor="middle" font-size="12">module 2</text>
  <rect class="fig-box" x="332" y="276" width="116" height="72" rx="6"/>
  <text x="390.0" y="300" text-anchor="middle" font-size="13" font-weight="600">FastOps</text>
  <text class="fig-muted" x="390.0" y="319" text-anchor="middle" font-size="12">Numba, CPU</text>
  <text class="fig-muted" x="390.0" y="336" text-anchor="middle" font-size="12">module 3</text>
  <rect class="fig-box" x="460" y="276" width="116" height="72" rx="6"/>
  <text x="518.0" y="300" text-anchor="middle" font-size="13" font-weight="600">CudaOps</text>
  <text class="fig-muted" x="518.0" y="319" text-anchor="middle" font-size="12">Numba, GPU</text>
  <text class="fig-muted" x="518.0" y="336" text-anchor="middle" font-size="12">module 3</text>
  <rect class="fig-accent" x="588" y="276" width="116" height="72" rx="6"/>
  <text x="646.0" y="300" text-anchor="middle" font-size="13" font-weight="600">NativeOps</text>
  <text class="fig-muted" x="646.0" y="319" text-anchor="middle" font-size="12">your C, CUDA</text>
  <text class="fig-muted" x="646.0" y="336" text-anchor="middle" font-size="12">last step</text>
  <text class="fig-muted" x="450.0" y="368" text-anchor="middle" font-size="12">backends: one of them runs every operation</text>
  <rect class="fig-box" x="20" y="84" width="150" height="112" rx="6"/>
  <text x="95" y="110" text-anchor="middle" font-size="13" font-weight="600">Scalar</text>
  <text class="fig-muted" x="95" y="130" text-anchor="middle" font-size="12">one float per node</text>
  <text class="fig-muted" x="95" y="147" text-anchor="middle" font-size="12">same autograd idea</text>
  <text class="fig-muted" x="95" y="180" text-anchor="middle" font-size="12">module 1</text>
  <line class="fig-line" x1="170" y1="108" x2="198" y2="108" marker-end="url(#22-layers-arrow)"/>
</svg>
