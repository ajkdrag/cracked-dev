<svg viewBox="0 0 720 390" role="img" aria-label="Swiss table lookup: H1, the top 57 bits of the hash, picks a group, and H2, the low 7 bits, is compared with all 16 control bytes of the group at once. The comparison gives a 16-bit mask with one bit per matching byte, and only those slots have their full key compared. If the group has no match and no empty byte, the lookup tries the next group in the probe sequence">
  <defs>
    <marker id="07-swiss-table-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="45" font-size="13">hash</text>
  <rect class="fig-box" x="124" y="26" width="440" height="30" rx="4"/>
  <text class="fig-mono" x="344" y="46" text-anchor="middle" font-size="12">H1 = hash &gt;&gt; 7</text>
  <rect class="fig-accent" x="564" y="26" width="136" height="30" rx="4"/>
  <text class="fig-mono" x="632" y="46" text-anchor="middle" font-size="12">H2 = 0x3a</text>
  <text class="fig-muted" x="344" y="74" text-anchor="middle" font-size="12">picks the first group</text>
  <line class="fig-line" x1="632" y1="56" x2="632" y2="94" marker-end="url(#07-swiss-table-arrow)"/>
  <text class="fig-muted" x="624" y="80" text-anchor="end" font-size="12">compared with all 16</text>
