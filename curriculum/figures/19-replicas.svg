<svg viewBox="0 0 720 300" role="img" aria-label="With one server, a client gets no answer while the server is down. With three replicas, one can be down and the other two still answer.">
  <defs>
    <marker id="19-replicas-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="180" y="34" text-anchor="middle" font-size="14" font-weight="600">One server</text>
  <rect class="fig-box" x="40" y="118" width="100" height="44" rx="6"/>
  <text x="90" y="145" text-anchor="middle" font-size="13">client</text>
  <rect class="fig-accent" x="220" y="118" width="110" height="44" rx="6" stroke-dasharray="5 4"/>
  <text x="275" y="137" text-anchor="middle" font-size="13">server</text>
  <text class="fig-accent-text" x="275" y="154" text-anchor="middle" font-size="12">down</text>
  <line class="fig-line" x1="140" y1="130" x2="218" y2="130" marker-end="url(#19-replicas-arrow)"/>
  <text class="fig-mono" x="179" y="122" text-anchor="middle" font-size="12">put a 1</text>
  <line class="fig-line" x1="218" y1="152" x2="142" y2="152" marker-end="url(#19-replicas-arrow)" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="179" y="172" text-anchor="middle" font-size="12">no answer</text>
  <text class="fig-muted" x="180" y="244" text-anchor="middle" font-size="12">The client waits until someone</text>
  <text class="fig-muted" x="180" y="262" text-anchor="middle" font-size="12">restarts the server.</text>
  <line class="fig-line" x1="360" y1="30" x2="360" y2="280" stroke-dasharray="5 4"/>
  <text x="540" y="34" text-anchor="middle" font-size="14" font-weight="600">Three replicas</text>
  <rect class="fig-box" x="390" y="118" width="100" height="44" rx="6"/>
  <text x="440" y="145" text-anchor="middle" font-size="13">client</text>
  <rect class="fig-accent" x="560" y="50" width="140" height="44" rx="6" stroke-dasharray="5 4"/>
  <text x="630" y="69" text-anchor="middle" font-size="13">replica 1</text>
  <text class="fig-accent-text" x="630" y="86" text-anchor="middle" font-size="12">down</text>
  <rect class="fig-box" x="560" y="118" width="140" height="44" rx="6"/>
  <text x="630" y="137" text-anchor="middle" font-size="13">replica 2</text>
  <text class="fig-muted" x="630" y="154" text-anchor="middle" font-size="12">answers the client</text>
  <rect class="fig-box" x="560" y="186" width="140" height="44" rx="6"/>
  <text x="630" y="205" text-anchor="middle" font-size="13">replica 3</text>
  <text class="fig-muted" x="630" y="222" text-anchor="middle" font-size="12">keeps a copy</text>
  <line class="fig-line" x1="490" y1="130" x2="558" y2="130" marker-end="url(#19-replicas-arrow)"/>
  <text class="fig-mono" x="524" y="122" text-anchor="middle" font-size="12">put a 1</text>
  <line class="fig-line" x1="558" y1="152" x2="492" y2="152" marker-end="url(#19-replicas-arrow)"/>
  <text class="fig-mono" x="524" y="172" text-anchor="middle" font-size="12">ok</text>
  <line class="fig-line" x1="630" y1="162" x2="630" y2="184" marker-end="url(#19-replicas-arrow)"/>
  <text class="fig-muted" x="638" y="177" font-size="12">copies</text>
  <text class="fig-muted" x="540" y="262" text-anchor="middle" font-size="12">Replicas 2 and 3 are a majority,</text>
  <text class="fig-muted" x="540" y="280" text-anchor="middle" font-size="12">so the write still succeeds.</text>
</svg>
