<svg viewBox="0 0 720 300" role="img" aria-label="A container: mysh runs as pid 1 in new PID, UTS, mount and network namespaces, and it and its children sit in the cgroup lab, whose memory.max and pids.max limit them as one">
  <defs>
    <marker id="08-container-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="470" height="264" rx="6"/>
  <text x="36" y="42" font-size="13" font-weight="600">cgroup lab</text>
  <text class="fig-mono" x="36" y="60" font-size="12">memory.max 50M, pids.max 6</text>
  <rect class="fig-box" x="40" y="210" width="120" height="48" rx="6"/>
  <text x="100.0" y="231.0" text-anchor="middle" font-size="13" font-weight="600">unshare</text>
  <text class="fig-muted" x="100.0" y="248.0" text-anchor="middle" font-size="12">old namespaces</text>
  <rect class="fig-accent" x="190" y="76" width="280" height="192" rx="6"/>
  <text class="fig-muted" x="206" y="96" font-size="12">new namespaces:</text>
  <text class="fig-muted" x="206" y="112" font-size="12">PID, UTS, mount, network</text>
  <rect class="fig-box" x="210" y="128" width="240" height="48" rx="6"/>
  <text x="330.0" y="149.0" text-anchor="middle" font-size="13" font-weight="600">mysh</text>
  <text class="fig-muted" x="330.0" y="166.0" text-anchor="middle" font-size="12">pid 1, host name box</text>
  <rect class="fig-box" x="210" y="200" width="112" height="48" rx="6"/>
  <text x="266.0" y="221.0" text-anchor="middle" font-size="13" font-weight="600">hog</text>
  <text class="fig-muted" x="266.0" y="238.0" text-anchor="middle" font-size="12">pid 2</text>
  <rect class="fig-box" x="338" y="200" width="112" height="48" rx="6"/>
  <text x="394.0" y="221.0" text-anchor="middle" font-size="13" font-weight="600">ls</text>
  <text class="fig-muted" x="394.0" y="238.0" text-anchor="middle" font-size="12">pid 3</text>
  <line class="fig-line" x1="160" y1="226" x2="208" y2="162" marker-end="url(#08-container-arrow)"/>
  <text class="fig-muted" x="166" y="186" text-anchor="end" font-size="12">fork</text>
  <line class="fig-line" x1="290" y1="176" x2="268" y2="198" marker-end="url(#08-container-arrow)"/>
  <line class="fig-line" x1="370" y1="176" x2="392" y2="198" marker-end="url(#08-container-arrow)"/>
  <rect class="fig-box" x="520" y="20" width="180" height="264" rx="6"/>
  <text x="610" y="42" text-anchor="middle" font-size="13" font-weight="600">the rest of WSL2</text>
  <text class="fig-muted" x="610" y="90" text-anchor="middle" font-size="12">other processes</text>
  <text class="fig-muted" x="610" y="130" text-anchor="middle" font-size="12">the real host name</text>
  <text class="fig-muted" x="610" y="170" text-anchor="middle" font-size="12">eth0 and the network</text>
  <text class="fig-muted" x="610" y="210" text-anchor="middle" font-size="12">unlimited memory</text>
</svg>
