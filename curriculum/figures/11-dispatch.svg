  <text class="fig-muted" x="176" y="272" text-anchor="middle" font-size="12">every opcode returns here</text>
  <rect class="fig-box" x="390" y="60" width="96" height="50" rx="6"/>
  <text class="fig-mono" x="438" y="82" text-anchor="middle" font-size="11">OP_ADD</text>
  <text class="fig-muted" x="438" y="99" text-anchor="middle" font-size="11">code</text>
  <line class="fig-line" x1="438" y1="110" x2="438" y2="147" marker-end="url(#11-dispatch-arrow)"/>
  <rect class="fig-accent" x="390" y="150" width="96" height="44" rx="6"/>
  <text class="fig-mono" x="438" y="169" text-anchor="middle" font-size="12">jmp</text>
