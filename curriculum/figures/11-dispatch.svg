  <text class="fig-mono" x="543" y="82" text-anchor="middle" font-size="11">OP_SUBTRACT</text>
  <text class="fig-muted" x="543" y="99" text-anchor="middle" font-size="11">code</text>
  <line class="fig-line" x1="543" y1="110" x2="543" y2="147" marker-end="url(#11-dispatch-arrow)"/>
  <rect class="fig-accent" x="495" y="150" width="96" height="44" rx="6"/>
