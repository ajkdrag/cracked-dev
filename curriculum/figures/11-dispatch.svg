<svg viewBox="0 0 720 292" role="img" aria-label="Left, a switch: every opcode&#x27;s code jumps back to one shared indirect jump, so the branch predictor sees one jump with many targets. Right, computed goto: each opcode&#x27;s code ends in its own indirect jump, so there is one jump per opcode to predict.">
  <defs>
    <marker id="11-dispatch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="32" text-anchor="start" font-size="13" font-weight="600">switch</text>
  <text x="380" y="32" text-anchor="start" font-size="13" font-weight="600">computed goto</text>
  <rect class="fig-accent" x="70" y="50" width="230" height="44" rx="6"/>
  <text class="fig-mono" x="185" y="77" text-anchor="middle" font-size="13">jmp *table[op]</text>
  <rect class="fig-box" x="50" y="160" width="84" height="50" rx="6"/>
  <text class="fig-mono" x="92" y="182" text-anchor="middle" font-size="11">OP_ADD</text>
  <text class="fig-muted" x="92" y="199" text-anchor="middle" font-size="11">code</text>
  <line class="fig-line" x1="92" y1="96" x2="92" y2="157" marker-end="url(#11-dispatch-arrow)"/>
  <line class="fig-line" x1="92" y1="210" x2="92" y2="250"/>
  <rect class="fig-box" x="140" y="160" width="84" height="50" rx="6"/>
  <text class="fig-mono" x="182" y="182" text-anchor="middle" font-size="11">OP_SUBTRACT</text>
  <text class="fig-muted" x="182" y="199" text-anchor="middle" font-size="11">code</text>
  <line class="fig-line" x1="182" y1="96" x2="182" y2="157" marker-end="url(#11-dispatch-arrow)"/>
  <line class="fig-line" x1="182" y1="210" x2="182" y2="250"/>
  <rect class="fig-box" x="230" y="160" width="84" height="50" rx="6"/>
  <text class="fig-mono" x="272" y="182" text-anchor="middle" font-size="11">OP_RETURN</text>
