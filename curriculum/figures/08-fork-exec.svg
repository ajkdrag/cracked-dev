<svg viewBox="0 0 720 230" role="img" aria-label="fork makes a child that is a copy of the parent, exec replaces the child&#x27;s program with ls but keeps its file descriptors, and wait in the parent returns when the child exits">
  <defs>
    <marker id="08-fork-exec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="26" font-size="12">parent</text>
  <text class="fig-muted" x="20" y="136" font-size="12">child</text>
  <rect class="fig-box" x="20" y="36" width="160" height="56" rx="6"/>
  <text x="100.0" y="61.0" text-anchor="middle" font-size="13" font-weight="600">shell</text>
  <text class="fig-muted" x="100.0" y="78.0" text-anchor="middle" font-size="12">pid 10</text>
  <rect class="fig-box" x="540" y="36" width="160" height="56" rx="6"/>
  <text x="620.0" y="61.0" text-anchor="middle" font-size="13" font-weight="600">shell</text>
  <text class="fig-muted" x="620.0" y="78.0" text-anchor="middle" font-size="12">wait returns status 0</text>
  <line class="fig-line" x1="180" y1="64" x2="538" y2="64" marker-end="url(#08-fork-exec-arrow)"/>
  <text class="fig-muted" x="359" y="56" text-anchor="middle" font-size="12">fork returned 11, wait(&amp;status) sleeps</text>
  <path class="fig-line" d="M100 92 L100 174 L238 174" marker-end="url(#08-fork-exec-arrow)"/>
  <text class="fig-mono" x="108" y="166" font-size="12">fork()</text>
  <rect class="fig-box" x="240" y="146" width="160" height="56" rx="6"/>
  <text x="320.0" y="171.0" text-anchor="middle" font-size="13" font-weight="600">shell, a copy</text>
  <text class="fig-muted" x="320.0" y="188.0" text-anchor="middle" font-size="12">pid 11, fork returned 0</text>
  <rect class="fig-box" x="460" y="146" width="120" height="56" rx="6"/>
  <text x="520.0" y="171.0" text-anchor="middle" font-size="13" font-weight="600">ls</text>
  <text class="fig-muted" x="520.0" y="188.0" text-anchor="middle" font-size="12">pid 11</text>
  <line class="fig-line" x1="400" y1="174" x2="458" y2="174" marker-end="url(#08-fork-exec-arrow)"/>
  <text class="fig-mono" x="430" y="166" text-anchor="middle" font-size="12">exec</text>
  <line class="fig-line" x1="580" y1="160" x2="612" y2="94" marker-end="url(#08-fork-exec-arrow)"/>
  <text class="fig-mono" x="606" y="136" font-size="12">exit(0)</text>
  <text class="fig-muted" x="520" y="222" text-anchor="middle" font-size="12">fds 0, 1, 2 copied by fork, kept by exec</text>
</svg>
