<svg viewBox="0 0 720 300" role="img" aria-label="The life of a contribution: claim an issue, reproduce it on unstable, write a test that fails, find the cause, fix it, pass the checks, open the pull request, and answer review until it merges. Requested changes go back to the fix as new commits on the same branch.">
  <defs>
    <marker id="20-contribution-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="30" width="116" height="60" rx="6"/>
  <text x="78.0" y="56" text-anchor="middle" font-size="13" font-weight="600">issue</text>
  <text class="fig-muted" x="78.0" y="75" text-anchor="middle" font-size="12">comment on it</text>
  <rect class="fig-box" x="161" y="30" width="116" height="60" rx="6"/>
  <text x="219.0" y="56" text-anchor="middle" font-size="13" font-weight="600">reproduce</text>
  <text class="fig-muted" x="219.0" y="75" text-anchor="middle" font-size="12">on unstable</text>
  <rect class="fig-accent" x="302" y="30" width="116" height="60" rx="6"/>
  <text x="360.0" y="56" text-anchor="middle" font-size="13" font-weight="600">failing test</text>
  <text class="fig-muted" x="360.0" y="75" text-anchor="middle" font-size="12">shows the bug</text>
  <rect class="fig-box" x="443" y="30" width="116" height="60" rx="6"/>
  <text x="501.0" y="56" text-anchor="middle" font-size="13" font-weight="600">find the cause</text>
  <text class="fig-muted" x="501.0" y="75" text-anchor="middle" font-size="12">gdb, backtrace</text>
  <rect class="fig-box" x="20" y="150" width="116" height="60" rx="6"/>
  <text x="78.0" y="176" text-anchor="middle" font-size="13" font-weight="600">fix</text>
  <text class="fig-muted" x="78.0" y="195" text-anchor="middle" font-size="12">smallest change</text>
  <rect class="fig-box" x="161" y="150" width="116" height="60" rx="6"/>
  <text x="219.0" y="176" text-anchor="middle" font-size="13" font-weight="600">checks</text>
  <text class="fig-muted" x="219.0" y="195" text-anchor="middle" font-size="12">format, sign-off</text>
  <rect class="fig-box" x="302" y="150" width="116" height="60" rx="6"/>
  <text x="360.0" y="176" text-anchor="middle" font-size="13" font-weight="600">pull request</text>
  <text class="fig-muted" x="360.0" y="195" text-anchor="middle" font-size="12">Fixes #n</text>
  <rect class="fig-box" x="443" y="150" width="116" height="60" rx="6"/>
  <text x="501.0" y="176" text-anchor="middle" font-size="13" font-weight="600">review</text>
  <text class="fig-muted" x="501.0" y="195" text-anchor="middle" font-size="12">CI, bot, people</text>
  <rect class="fig-accent" x="584" y="150" width="116" height="60" rx="6"/>
  <text x="642.0" y="176" text-anchor="middle" font-size="13" font-weight="600">merged</text>
  <text class="fig-muted" x="642.0" y="195" text-anchor="middle" font-size="12">into unstable</text>
  <line class="fig-line" x1="136" y1="60" x2="159" y2="60" marker-end="url(#20-contribution-arrow)"/>
  <line class="fig-line" x1="277" y1="60" x2="300" y2="60" marker-end="url(#20-contribution-arrow)"/>
  <line class="fig-line" x1="418" y1="60" x2="441" y2="60" marker-end="url(#20-contribution-arrow)"/>
  <line class="fig-line" x1="136" y1="180" x2="159" y2="180" marker-end="url(#20-contribution-arrow)"/>
  <line class="fig-line" x1="277" y1="180" x2="300" y2="180" marker-end="url(#20-contribution-arrow)"/>
  <line class="fig-line" x1="418" y1="180" x2="441" y2="180" marker-end="url(#20-contribution-arrow)"/>
  <line class="fig-line" x1="559" y1="180" x2="582" y2="180" marker-end="url(#20-contribution-arrow)"/>
  <path class="fig-line" d="M501.0 90 L501.0 120 L78.0 120 L78.0 148" fill="none" marker-end="url(#20-contribution-arrow)"/>
  <path class="fig-accent-line" d="M501.0 210 L501.0 250 L78.0 250 L78.0 212" fill="none" marker-end="url(#20-contribution-arrow)"/>
  <text class="fig-accent-text" x="289.5" y="272" text-anchor="middle" font-size="12">changes requested: new commits on the same branch</text>
</svg>
