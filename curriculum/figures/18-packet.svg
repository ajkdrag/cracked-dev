<svg viewBox="0 0 720 306" role="img" aria-label="The IPv4 header and the TCP header drawn as rows of 4 bytes, with the byte offset of each row on the left and of each column on top. The fields your parser reads by offset are highlighted: IP bytes 0, 2, 6, 9, 12 and 16, and TCP bytes 0, 2, 4, 8, 12, 13, 14 and 16.">
  <text x="60" y="30" font-size="13" font-weight="600">IPv4 header</text>
  <text class="fig-muted" x="95.0" y="52" text-anchor="middle" font-size="12">+0</text>
  <text class="fig-muted" x="165.0" y="52" text-anchor="middle" font-size="12">+1</text>
  <text class="fig-muted" x="235.0" y="52" text-anchor="middle" font-size="12">+2</text>
  <text class="fig-muted" x="305.0" y="52" text-anchor="middle" font-size="12">+3</text>
  <text class="fig-mono fig-muted" x="52" y="81.5" text-anchor="end" font-size="12">0</text>
  <rect class="fig-accent" x="60" y="60" width="70" height="34" rx="6"/>
  <text x="95.0" y="75" text-anchor="middle" font-size="12">version</text>
  <text x="95.0" y="89" text-anchor="middle" font-size="12">IHL</text>
  <rect class="fig-box" x="130" y="60" width="70" height="34" rx="6"/>
  <text x="165.0" y="81.5" text-anchor="middle" font-size="12">TOS</text>
  <rect class="fig-accent" x="200" y="60" width="140" height="34" rx="6"/>
  <text x="270.0" y="81.5" text-anchor="middle" font-size="12">total length</text>
  <text class="fig-mono fig-muted" x="52" y="115.5" text-anchor="end" font-size="12">4</text>
  <rect class="fig-box" x="60" y="94" width="140" height="34" rx="6"/>
  <text x="130.0" y="115.5" text-anchor="middle" font-size="12">identification</text>
  <rect class="fig-accent" x="200" y="94" width="140" height="34" rx="6"/>
  <text x="270.0" y="115.5" text-anchor="middle" font-size="12">flags, fragment</text>
  <text class="fig-mono fig-muted" x="52" y="149.5" text-anchor="end" font-size="12">8</text>
  <rect class="fig-box" x="60" y="128" width="70" height="34" rx="6"/>
  <text x="95.0" y="149.5" text-anchor="middle" font-size="12">TTL</text>
  <rect class="fig-accent" x="130" y="128" width="70" height="34" rx="6"/>
  <text x="165.0" y="149.5" text-anchor="middle" font-size="12">protocol</text>
  <rect class="fig-box" x="200" y="128" width="140" height="34" rx="6"/>
  <text x="270.0" y="149.5" text-anchor="middle" font-size="12">header checksum</text>
  <text class="fig-mono fig-muted" x="52" y="183.5" text-anchor="end" font-size="12">12</text>
  <rect class="fig-accent" x="60" y="162" width="280" height="34" rx="6"/>
  <text x="200.0" y="183.5" text-anchor="middle" font-size="12">source address</text>
  <text class="fig-mono fig-muted" x="52" y="217.5" text-anchor="end" font-size="12">16</text>
  <rect class="fig-accent" x="60" y="196" width="280" height="34" rx="6"/>
  <text x="200.0" y="217.5" text-anchor="middle" font-size="12">destination address</text>
  <rect class="fig-box" x="60" y="230" width="280" height="34" rx="6" stroke-dasharray="4 4" fill-opacity="0"/>
  <text class="fig-muted" x="200" y="251.5" text-anchor="middle" font-size="12">options, if IHL &gt; 5</text>
  <text class="fig-mono fig-muted" x="52" y="251.5" text-anchor="end" font-size="12">20</text>
  <text x="410" y="30" font-size="13" font-weight="600">TCP header</text>
  <text class="fig-muted" x="445.0" y="52" text-anchor="middle" font-size="12">+0</text>
  <text class="fig-muted" x="515.0" y="52" text-anchor="middle" font-size="12">+1</text>
  <text class="fig-muted" x="585.0" y="52" text-anchor="middle" font-size="12">+2</text>
  <text class="fig-muted" x="655.0" y="52" text-anchor="middle" font-size="12">+3</text>
  <text class="fig-mono fig-muted" x="402" y="81.5" text-anchor="end" font-size="12">0</text>
  <rect class="fig-accent" x="410" y="60" width="140" height="34" rx="6"/>
  <text x="480.0" y="81.5" text-anchor="middle" font-size="12">source port</text>
  <rect class="fig-accent" x="550" y="60" width="140" height="34" rx="6"/>
  <text x="620.0" y="81.5" text-anchor="middle" font-size="12">destination port</text>
  <text class="fig-mono fig-muted" x="402" y="115.5" text-anchor="end" font-size="12">4</text>
  <rect class="fig-accent" x="410" y="94" width="280" height="34" rx="6"/>
  <text x="550.0" y="115.5" text-anchor="middle" font-size="12">sequence number</text>
  <text class="fig-mono fig-muted" x="402" y="149.5" text-anchor="end" font-size="12">8</text>
  <rect class="fig-accent" x="410" y="128" width="280" height="34" rx="6"/>
  <text x="550.0" y="149.5" text-anchor="middle" font-size="12">acknowledgment number</text>
  <text class="fig-mono fig-muted" x="402" y="183.5" text-anchor="end" font-size="12">12</text>
  <rect class="fig-accent" x="410" y="162" width="70" height="34" rx="6"/>
  <text x="445.0" y="177" text-anchor="middle" font-size="12">data</text>
  <text x="445.0" y="191" text-anchor="middle" font-size="12">offset</text>
  <rect class="fig-accent" x="480" y="162" width="70" height="34" rx="6"/>
  <text x="515.0" y="183.5" text-anchor="middle" font-size="12">flags</text>
  <rect class="fig-accent" x="550" y="162" width="140" height="34" rx="6"/>
  <text x="620.0" y="183.5" text-anchor="middle" font-size="12">window</text>
  <text class="fig-mono fig-muted" x="402" y="217.5" text-anchor="end" font-size="12">16</text>
  <rect class="fig-accent" x="410" y="196" width="140" height="34" rx="6"/>
  <text x="480.0" y="217.5" text-anchor="middle" font-size="12">checksum</text>
  <rect class="fig-box" x="550" y="196" width="140" height="34" rx="6"/>
  <text x="620.0" y="217.5" text-anchor="middle" font-size="12">urgent pointer</text>
  <rect class="fig-box" x="410" y="230" width="280" height="34" rx="6" stroke-dasharray="4 4" fill-opacity="0"/>
  <text class="fig-muted" x="550" y="251.5" text-anchor="middle" font-size="12">options, if data offset &gt; 5</text>
  <text class="fig-mono fig-muted" x="402" y="251.5" text-anchor="end" font-size="12">20</text>
  <text class="fig-muted" x="200" y="288" text-anchor="middle" font-size="12">IHL counts 4-byte rows: 5 means 20 bytes</text>
  <text class="fig-muted" x="550" y="288" text-anchor="middle" font-size="12">TCP data follows the options</text>
</svg>
