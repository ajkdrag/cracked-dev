<svg viewBox="0 0 720 260" role="img" aria-label="The ARM64 frame next to the x86-64 one: both hold a saved frame-pointer and a return address, but x86-64 stacks the return address above the saved rbp while ARM64 stores the pair x29 and x30 together at the bottom of the frame.">
  <defs>
    <marker id="05-arm64-frame-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="160" y="26" text-anchor="middle" font-size="12">high addresses</text>
  <text x="160" y="46" text-anchor="middle" font-size="13" font-weight="600">x86-64</text>
  <rect class="fig-accent" x="90" y="56" width="180" height="32" rx="6"/>
  <text x="180" y="77" text-anchor="middle" font-size="13">return address</text>
  <rect class="fig-accent" x="90" y="92" width="180" height="32" rx="6"/>
  <text x="180" y="113" text-anchor="middle" font-size="13">saved rbp</text>
  <rect class="fig-box" x="90" y="128" width="180" height="44" rx="6"/>
  <text x="180" y="150" text-anchor="middle" font-size="13">saved rbx, r12, locals</text>
  <text class="fig-muted" x="160" y="192" text-anchor="middle" font-size="12">low addresses</text>
  <text class="fig-accent-text" x="84" y="113" text-anchor="end" font-size="13">rbp</text>
  <line class="fig-accent-line" x1="52" y1="108" x2="88" y2="108" marker-end="url(#05-arm64-frame-arrow)"/>

  <text x="520" y="46" text-anchor="middle" font-size="13" font-weight="600">ARM64</text>
  <rect class="fig-box" x="430" y="56" width="180" height="32" rx="6"/>
  <text x="520" y="77" text-anchor="middle" font-size="13">saved x20</text>
  <rect class="fig-box" x="430" y="92" width="180" height="32" rx="6"/>
  <text x="520" y="113" text-anchor="middle" font-size="13">saved x19</text>
  <rect class="fig-accent" x="430" y="128" width="180" height="32" rx="6"/>
  <text x="520" y="149" text-anchor="middle" font-size="13">saved x30 (return)</text>
  <rect class="fig-accent" x="430" y="164" width="180" height="32" rx="6"/>
  <text x="520" y="185" text-anchor="middle" font-size="13">saved x29 (caller's fp)</text>
  <text class="fig-accent-text" x="424" y="185" text-anchor="end" font-size="13">sp, x29</text>
  <line class="fig-accent-line" x1="360" y1="180" x2="428" y2="180" marker-end="url(#05-arm64-frame-arrow)"/>

  <text class="fig-muted" x="360" y="232" text-anchor="middle" font-size="12">the two accented boxes are the saved frame-pointer and return address on each ISA</text>
</svg>
