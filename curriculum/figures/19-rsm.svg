<svg viewBox="0 0 720 280" role="img" aria-label="The same log of commands goes to three replicas. Each applies the commands in order to its own store and ends in the same state.">
  <defs>
    <marker id="19-rsm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="110" y="34" text-anchor="middle" font-size="13">the log</text>
  <rect class="fig-box" x="40" y="50" width="140" height="36" rx="6"/>
  <text class="fig-muted" x="58" y="73" font-size="12">1</text>
  <text class="fig-mono" x="120" y="73" text-anchor="middle" font-size="13">put a 1</text>
  <rect class="fig-box" x="40" y="96" width="140" height="36" rx="6"/>
  <text class="fig-muted" x="58" y="119" font-size="12">2</text>
  <text class="fig-mono" x="120" y="119" text-anchor="middle" font-size="13">put b 2</text>
  <rect class="fig-box" x="40" y="142" width="140" height="36" rx="6"/>
  <text class="fig-muted" x="58" y="165" font-size="12">3</text>
  <text class="fig-mono" x="120" y="165" text-anchor="middle" font-size="13">del a</text>
  <rect class="fig-box" x="40" y="188" width="140" height="36" rx="6"/>
  <text class="fig-muted" x="58" y="211" font-size="12">4</text>
  <text class="fig-mono" x="120" y="211" text-anchor="middle" font-size="13">put b 3</text>
  <path class="fig-line" d="M188 50 L198 50 L198 222 L188 222"/>
  <text class="fig-muted" x="110" y="262" text-anchor="middle" font-size="12">same commands, same order</text>
  <line class="fig-line" x1="198" y1="136" x2="318" y2="72" marker-end="url(#19-rsm-arrow)"/>
  <rect class="fig-box" x="320" y="54" width="150" height="36" rx="6"/>
  <text x="395" y="77" text-anchor="middle" font-size="12">replica 1 applies</text>
  <line class="fig-line" x1="470" y1="72" x2="538" y2="72" marker-end="url(#19-rsm-arrow)"/>
  <rect class="fig-box" x="540" y="54" width="140" height="36" rx="6"/>
  <text class="fig-mono" x="610" y="77" text-anchor="middle" font-size="13">b = 3</text>
  <line class="fig-line" x1="198" y1="136" x2="318" y2="140" marker-end="url(#19-rsm-arrow)"/>
  <rect class="fig-box" x="320" y="122" width="150" height="36" rx="6"/>
  <text x="395" y="145" text-anchor="middle" font-size="12">replica 2 applies</text>
  <line class="fig-line" x1="470" y1="140" x2="538" y2="140" marker-end="url(#19-rsm-arrow)"/>
  <rect class="fig-box" x="540" y="122" width="140" height="36" rx="6"/>
  <text class="fig-mono" x="610" y="145" text-anchor="middle" font-size="13">b = 3</text>
  <line class="fig-line" x1="198" y1="136" x2="318" y2="208" marker-end="url(#19-rsm-arrow)"/>
  <rect class="fig-box" x="320" y="190" width="150" height="36" rx="6"/>
  <text x="395" y="213" text-anchor="middle" font-size="12">replica 3 applies</text>
  <line class="fig-line" x1="470" y1="208" x2="538" y2="208" marker-end="url(#19-rsm-arrow)"/>
  <rect class="fig-box" x="540" y="190" width="140" height="36" rx="6"/>
  <text class="fig-mono" x="610" y="213" text-anchor="middle" font-size="13">b = 3</text>
  <text class="fig-muted" x="250" y="58" text-anchor="middle" font-size="12">whole log</text>
  <text class="fig-muted" x="250" y="74" text-anchor="middle" font-size="12">copied to</text>
  <text class="fig-muted" x="504" y="44" text-anchor="middle" font-size="12">writes</text>
  <text class="fig-muted" x="610" y="262" text-anchor="middle" font-size="12">same state everywhere</text>
</svg>
