<svg viewBox="0 0 720 260" role="img" aria-label="The test file pastes in the source file with its main renamed, clang builds one program from it, and the program's exit status tells the shell whether every check passed">
  <defs>
    <marker id="02-test-pattern-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="320" height="220" rx="6"/>
  <text class="fig-mono" x="40" y="46" font-size="14" font-weight="600">tests/add_test.c</text>
  <text class="fig-mono" x="40" y="74" font-size="12">#define main add_demo_main</text>
  <rect class="fig-accent" x="40" y="88" width="280" height="76" rx="6"/>
  <text x="56" y="112" font-size="13" font-weight="600">src/add.c, pasted in by #include</text>
  <text class="fig-mono" x="56" y="134" font-size="12">add()</text>
  <text class="fig-mono" x="56" y="152" font-size="12">add_demo_main()</text>
  <text class="fig-muted" x="200" y="152" font-size="12">was main()</text>
  <text class="fig-mono" x="40" y="188" font-size="12">#undef main</text>
  <text class="fig-mono" x="40" y="214" font-size="12">check()</text>
  <text class="fig-mono" x="110" y="214" font-size="12">main()</text>
  <text class="fig-muted" x="200" y="214" font-size="12">the test's own</text>
  <line class="fig-line" x1="340" y1="130" x2="418" y2="130" marker-end="url(#02-test-pattern-arrow)"/>
  <text class="fig-muted" x="379" y="120" text-anchor="middle" font-size="12">clang</text>
  <rect class="fig-box" x="420" y="100" width="120" height="60" rx="6"/>
  <text class="fig-mono" x="480" y="126" text-anchor="middle" font-size="13" font-weight="600">add_test</text>
  <text class="fig-muted" x="480" y="146" text-anchor="middle" font-size="12">one program</text>
  <line class="fig-line" x1="540" y1="130" x2="598" y2="130" marker-end="url(#02-test-pattern-arrow)"/>
  <text class="fig-muted" x="569" y="120" text-anchor="middle" font-size="12">exits</text>
  <rect class="fig-box" x="600" y="100" width="100" height="60" rx="6"/>
  <text x="650" y="126" text-anchor="middle" font-size="13" font-weight="600">shell</text>
  <text class="fig-muted" x="650" y="146" text-anchor="middle" font-size="12">0 if all passed</text>
</svg>
