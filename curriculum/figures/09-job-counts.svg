<svg viewBox="0 0 720 300" role="img" aria-label="A root with three children. Each count is 1 for the job itself plus 1 per unfinished child. When a&#x27;s count reaches 0 it tells the root, then stores -1. Only when every count reads -1 may job_wait free the group.">
  <defs>
    <marker id="09-job-counts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="127" y="34" text-anchor="middle" font-size="13" font-weight="600">1. queued</text>
  <rect class="fig-box" x="72" y="52" width="110" height="44" rx="6"/>
  <text x="127.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600">root</text>
  <text class="fig-muted fig-mono" x="127.0" y="88.0" text-anchor="middle" font-size="12">4</text>
  <rect class="fig-box" x="24" y="170" width="64" height="44" rx="6"/>
  <text x="56.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">a</text>
  <text class="fig-muted fig-mono" x="56.0" y="206.0" text-anchor="middle" font-size="12">1</text>
  <line class="fig-line" x1="56" y1="170" x2="127" y2="96"/>
  <rect class="fig-box" x="96" y="170" width="64" height="44" rx="6"/>
  <text x="128.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">b</text>
  <text class="fig-muted fig-mono" x="128.0" y="206.0" text-anchor="middle" font-size="12">1</text>
  <line class="fig-line" x1="128" y1="170" x2="127" y2="96"/>
  <rect class="fig-box" x="168" y="170" width="64" height="44" rx="6"/>
  <text x="200.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">c</text>
  <text class="fig-muted fig-mono" x="200.0" y="206.0" text-anchor="middle" font-size="12">1</text>
  <line class="fig-line" x1="200" y1="170" x2="127" y2="96"/>
  <text x="360" y="34" text-anchor="middle" font-size="13" font-weight="600">2. a finishes</text>
  <rect class="fig-box" x="305" y="52" width="110" height="44" rx="6"/>
  <text x="360.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600">root</text>
  <text class="fig-muted fig-mono" x="360.0" y="88.0" text-anchor="middle" font-size="12">3</text>
  <rect class="fig-accent" x="257" y="170" width="64" height="44" rx="6"/>
  <text x="289.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">a</text>
  <text class="fig-muted fig-mono" x="289.0" y="206.0" text-anchor="middle" font-size="12">0 → -1</text>
  <line class="fig-accent-line" x1="289" y1="168" x2="345" y2="98" marker-end="url(#09-job-counts-arrow)"/>
  <rect class="fig-box" x="329" y="170" width="64" height="44" rx="6"/>
  <text x="361.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">b</text>
  <text class="fig-muted fig-mono" x="361.0" y="206.0" text-anchor="middle" font-size="12">1</text>
  <line class="fig-line" x1="361" y1="170" x2="360" y2="96"/>
  <rect class="fig-box" x="401" y="170" width="64" height="44" rx="6"/>
  <text x="433.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">c</text>
  <text class="fig-muted fig-mono" x="433.0" y="206.0" text-anchor="middle" font-size="12">1</text>
  <line class="fig-line" x1="433" y1="170" x2="360" y2="96"/>
  <text x="593" y="34" text-anchor="middle" font-size="13" font-weight="600">3. all finished</text>
  <rect class="fig-accent" x="538" y="52" width="110" height="44" rx="6"/>
  <text x="593.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600">root</text>
  <text class="fig-muted fig-mono" x="593.0" y="88.0" text-anchor="middle" font-size="12">-1</text>
  <rect class="fig-box" x="490" y="170" width="64" height="44" rx="6"/>
  <text x="522.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">a</text>
  <text class="fig-muted fig-mono" x="522.0" y="206.0" text-anchor="middle" font-size="12">-1</text>
  <line class="fig-line" x1="522" y1="170" x2="593" y2="96"/>
  <rect class="fig-box" x="562" y="170" width="64" height="44" rx="6"/>
  <text x="594.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">b</text>
  <text class="fig-muted fig-mono" x="594.0" y="206.0" text-anchor="middle" font-size="12">-1</text>
  <line class="fig-line" x1="594" y1="170" x2="593" y2="96"/>
  <rect class="fig-box" x="634" y="170" width="64" height="44" rx="6"/>
  <text x="666.0" y="189.0" text-anchor="middle" font-size="13" font-weight="600">c</text>
  <text class="fig-muted fig-mono" x="666.0" y="206.0" text-anchor="middle" font-size="12">-1</text>
  <line class="fig-line" x1="666" y1="170" x2="593" y2="96"/>
  <text class="fig-accent-text" x="255" y="130" text-anchor="end" font-size="12">tells</text>
  <text class="fig-accent-text" x="255" y="145" text-anchor="end" font-size="12">parent</text>
  <text class="fig-muted" x="127" y="244" text-anchor="middle" font-size="12">root = itself + 3 children</text>
  <text class="fig-muted" x="360" y="244" text-anchor="middle" font-size="12">root drops by 1</text>
  <text class="fig-muted" x="593" y="244" text-anchor="middle" font-size="12">job_wait may free all four</text>
  <text class="fig-muted" x="360" y="276" text-anchor="middle" font-size="12">count of each job: 1 for itself + 1 per child not yet finished</text>
</svg>
