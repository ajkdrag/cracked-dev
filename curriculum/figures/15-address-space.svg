<svg viewBox="0 0 720 366" role="img" aria-label="The kernel&#x27;s virtual address space after the heap step. Each region sits under its own level 4 entry. The bootloader made the regions at indexes 0 to 31, and your kernel made the heap at index 136 and the task stacks at index 170.">
  <defs>
    <marker id="15-address-space-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="60" y="26" text-anchor="middle" font-size="12">L4 index</text>
  <text class="fig-muted" x="300" y="26" text-anchor="middle" font-size="12">region</text>
  <text class="fig-muted" x="520" y="26" text-anchor="start" font-size="12">starts at</text>
  <text class="fig-mono" x="60" y="65" text-anchor="middle" font-size="13">170</text>
  <rect class="fig-accent" x="130" y="40" width="340" height="38" rx="6"/>
  <text x="300.0" y="54.5" text-anchor="middle" font-size="13" font-weight="600">task stacks</text>
  <text class="fig-muted" x="300.0" y="72.5" text-anchor="middle" font-size="12">map_stack, 64 KiB per slot</text>
  <text class="fig-mono" x="520" y="65" text-anchor="start" font-size="13">0x5555_0000_0000</text>
  <text class="fig-mono" x="60" y="111" text-anchor="middle" font-size="13">136</text>
  <rect class="fig-accent" x="130" y="86" width="340" height="38" rx="6"/>
  <text x="300.0" y="100.5" text-anchor="middle" font-size="13" font-weight="600">kernel heap</text>
  <text class="fig-muted" x="300.0" y="118.5" text-anchor="middle" font-size="12">init_heap, 100 KiB</text>
  <text class="fig-mono" x="520" y="111" text-anchor="start" font-size="13">0x4444_4444_0000</text>
  <text class="fig-mono" x="60" y="157" text-anchor="middle" font-size="13">31</text>
  <rect class="fig-box" x="130" y="132" width="340" height="38" rx="6"/>
  <text x="300.0" y="146.5" text-anchor="middle" font-size="13" font-weight="600">empty tables</text>
  <text class="fig-muted" x="300.0" y="164.5" text-anchor="middle" font-size="12">left by the bootloader</text>
  <text class="fig-mono" x="520" y="157" text-anchor="start" font-size="13">0xfee_efee_e000</text>
  <text class="fig-mono" x="60" y="203" text-anchor="middle" font-size="13">3 to 5</text>
  <rect class="fig-box" x="130" y="178" width="340" height="38" rx="6"/>
  <text x="300.0" y="192.5" text-anchor="middle" font-size="13" font-weight="600">all physical memory</text>
  <text class="fig-muted" x="300.0" y="210.5" text-anchor="middle" font-size="12">physical address p at offset + p</text>
  <text class="fig-mono" x="520" y="203" text-anchor="start" font-size="13">0x180_0000_0000</text>
  <text class="fig-mono" x="60" y="249" text-anchor="middle" font-size="13">2</text>
  <rect class="fig-box" x="130" y="224" width="340" height="38" rx="6"/>
  <text x="300.0" y="238.5" text-anchor="middle" font-size="13" font-weight="600">boot info and kernel stack</text>
  <text class="fig-muted" x="300.0" y="256.5" text-anchor="middle" font-size="12">BootInfo, the boot stack</text>
  <text class="fig-mono" x="520" y="249" text-anchor="start" font-size="13">0x100_0000_0000</text>
  <text class="fig-mono" x="60" y="295" text-anchor="middle" font-size="13">0</text>
  <rect class="fig-box" x="130" y="270" width="340" height="38" rx="6"/>
  <text x="300.0" y="284.5" text-anchor="middle" font-size="13" font-weight="600">kernel code and data</text>
  <text class="fig-muted" x="300.0" y="302.5" text-anchor="middle" font-size="12">_start near 0x20_0000, VGA 0xb8000</text>
  <text class="fig-mono" x="520" y="295" text-anchor="start" font-size="13">0x0</text>
  <line class="fig-line" x1="700" y1="326" x2="700" y2="44" marker-end="url(#15-address-space-arrow)"/>
  <text class="fig-muted" x="690" y="336" text-anchor="end" font-size="12">higher addresses up, not to scale</text>
</svg>
