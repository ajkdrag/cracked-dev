<svg viewBox="0 0 720 330" role="img" aria-label="A spin lock on one word. Thread A&#x27;s exchange returns 0, so A holds the lock. Thread B&#x27;s exchanges return 1 until A stores 0, and B&#x27;s next exchange returns 0.">
  <defs>
    <marker id="09-spinlock-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="135" y="40" text-anchor="middle" font-size="13" font-weight="600">thread A</text>
  <text class="fig-mono" x="360" y="40" text-anchor="middle" font-size="13">locked</text>
  <text x="585" y="40" text-anchor="middle" font-size="13" font-weight="600">thread B</text>
  <rect class="fig-accent" x="30" y="58" width="210" height="36" rx="6"/>
  <text x="135" y="81" text-anchor="middle" font-size="13">xchg 1, gets 0: holds lock</text>
  <line class="fig-line" x1="240" y1="76" x2="308" y2="76" marker-end="url(#09-spinlock-arrow)"/>
  <rect class="fig-box" x="310" y="58" width="100" height="36" rx="6"/>
  <text class="fig-mono" x="360" y="81" text-anchor="middle" font-size="13">1</text>
  <rect class="fig-box" x="480" y="106" width="210" height="36" rx="6"/>
  <text x="585" y="129" text-anchor="middle" font-size="13">xchg 1, gets 1: spins</text>
  <line class="fig-line" x1="480" y1="124" x2="412" y2="124" marker-end="url(#09-spinlock-arrow)"/>
  <rect class="fig-box" x="310" y="106" width="100" height="36" rx="6"/>
  <text class="fig-mono" x="360" y="129" text-anchor="middle" font-size="13">1</text>
  <rect class="fig-box" x="480" y="154" width="210" height="36" rx="6"/>
  <text x="585" y="177" text-anchor="middle" font-size="13">xchg 1, gets 1: spins</text>
  <line class="fig-line" x1="480" y1="172" x2="412" y2="172" marker-end="url(#09-spinlock-arrow)"/>
  <rect class="fig-box" x="310" y="154" width="100" height="36" rx="6"/>
  <text class="fig-mono" x="360" y="177" text-anchor="middle" font-size="13">1</text>
  <rect class="fig-box" x="30" y="202" width="210" height="36" rx="6"/>
  <text x="135" y="225" text-anchor="middle" font-size="13">unlock: store 0</text>
  <line class="fig-line" x1="240" y1="220" x2="308" y2="220" marker-end="url(#09-spinlock-arrow)"/>
  <rect class="fig-box" x="310" y="202" width="100" height="36" rx="6"/>
  <text class="fig-mono" x="360" y="225" text-anchor="middle" font-size="13">0</text>
  <rect class="fig-accent" x="480" y="250" width="210" height="36" rx="6"/>
  <text x="585" y="273" text-anchor="middle" font-size="13">xchg 1, gets 0: holds lock</text>
  <line class="fig-line" x1="480" y1="268" x2="412" y2="268" marker-end="url(#09-spinlock-arrow)"/>
  <rect class="fig-box" x="310" y="250" width="100" height="36" rx="6"/>
  <text class="fig-mono" x="360" y="273" text-anchor="middle" font-size="13">1</text>
  <text class="fig-muted" x="360" y="308" text-anchor="middle" font-size="12">value after each step</text>
</svg>
