<svg viewBox="0 0 720 250" role="img" aria-label="2400 at 0x20A pushes the return address 0x20C onto the stack, adds 1 to SP and jumps to 0x400. 00EE subtracts 1 from SP and jumps back to the address it finds there, 0x20C.">
  <defs>
    <marker id="06-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="115" y="36" text-anchor="middle" font-size="14" font-weight="600">before 2400</text>
  <text class="fig-muted" x="115" y="54" text-anchor="middle" font-size="12">at 0x20A</text>
  <rect class="fig-box" x="30" y="68" width="170" height="36" rx="6"/>
  <text class="fig-mono" x="115" y="91" text-anchor="middle" font-size="14">PC = 0x20A</text>
  <text class="fig-muted" x="150" y="130" text-anchor="middle" font-size="12">stack</text>
  <rect class="fig-box" x="100" y="140" width="100" height="32" rx="6"/>
  <text class="fig-muted fig-mono" x="110" y="161" font-size="12">[1]</text>
  <rect class="fig-box" x="100" y="176" width="100" height="32" rx="6"/>
  <text class="fig-muted fig-mono" x="110" y="197" font-size="12">[0]</text>
  <text class="fig-mono" x="30" y="197" font-size="13">SP=0</text>
  <line class="fig-line" x1="68" y1="192" x2="96" y2="192" marker-end="url(#06-stack-arrow)"/>
  <text x="360" y="36" text-anchor="middle" font-size="14" font-weight="600">after 2400</text>
  <text class="fig-muted" x="360" y="54" text-anchor="middle" font-size="12">in the subroutine</text>
  <rect class="fig-accent" x="275" y="68" width="170" height="36" rx="6"/>
  <text class="fig-mono" x="360" y="91" text-anchor="middle" font-size="14">PC = 0x400</text>
  <text class="fig-muted" x="395" y="130" text-anchor="middle" font-size="12">stack</text>
  <rect class="fig-box" x="345" y="140" width="100" height="32" rx="6"/>
  <text class="fig-muted fig-mono" x="355" y="161" font-size="12">[1]</text>
  <rect class="fig-accent" x="345" y="176" width="100" height="32" rx="6"/>
  <text class="fig-muted fig-mono" x="355" y="197" font-size="12">[0]</text>
  <text class="fig-mono" x="407" y="197" text-anchor="middle" font-size="13">0x20C</text>
  <text class="fig-mono" x="275" y="161" font-size="13">SP=1</text>
  <line class="fig-line" x1="313" y1="156" x2="341" y2="156" marker-end="url(#06-stack-arrow)"/>
  <text x="605" y="36" text-anchor="middle" font-size="14" font-weight="600">after 00EE</text>
  <text class="fig-muted" x="605" y="54" text-anchor="middle" font-size="12">back in the caller</text>
  <rect class="fig-accent" x="520" y="68" width="170" height="36" rx="6"/>
  <text class="fig-mono" x="605" y="91" text-anchor="middle" font-size="14">PC = 0x20C</text>
  <text class="fig-muted" x="640" y="130" text-anchor="middle" font-size="12">stack</text>
  <rect class="fig-box" x="590" y="140" width="100" height="32" rx="6"/>
  <text class="fig-muted fig-mono" x="600" y="161" font-size="12">[1]</text>
  <rect class="fig-box" x="590" y="176" width="100" height="32" rx="6"/>
  <text class="fig-muted fig-mono" x="600" y="197" font-size="12">[0]</text>
  <text class="fig-mono fig-muted" x="652" y="197" text-anchor="middle" font-size="13">0x20C</text>
  <text class="fig-mono" x="520" y="197" font-size="13">SP=0</text>
  <line class="fig-line" x1="558" y1="192" x2="586" y2="192" marker-end="url(#06-stack-arrow)"/>
  <text class="fig-muted" x="605" y="232" text-anchor="middle" font-size="12">old value, no longer counted</text>
  <line class="fig-accent-line" x1="204" y1="86" x2="271" y2="86" marker-end="url(#06-stack-arrow)"/>
  <text class="fig-mono fig-accent-text" x="239" y="77" text-anchor="middle" font-size="12">2400</text>
  <text class="fig-muted" x="239" y="122" text-anchor="middle" font-size="12">push, jump</text>
  <line class="fig-accent-line" x1="449" y1="86" x2="516" y2="86" marker-end="url(#06-stack-arrow)"/>
  <text class="fig-mono fig-accent-text" x="484" y="77" text-anchor="middle" font-size="12">00EE</text>
  <text class="fig-muted" x="484" y="122" text-anchor="middle" font-size="12">pop, jump</text>
</svg>
