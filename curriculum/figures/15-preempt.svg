<svg viewBox="0 0 720 330" role="img" aria-label="A timer interrupt in task A makes the CPU push five words and timer_entry push the fifteen other registers. schedule takes A&#x27;s rsp, sends the EOI and returns B&#x27;s saved rsp. timer_entry pops B&#x27;s registers and iretq resumes B wherever the timer stopped it.">
  <defs>
    <marker id="15-preempt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="105" y="28" text-anchor="middle" font-size="13" font-weight="600">stack of task A</text>
  <rect class="fig-box" x="20" y="40" width="170" height="40" rx="0"/>
  <text class="fig-muted" x="105" y="65" text-anchor="middle" font-size="12">earlier frames</text>
  <rect class="fig-box" x="20" y="80" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="105" y="95" text-anchor="middle" font-size="12">SS</text>
  <rect class="fig-box" x="20" y="102" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="105" y="117" text-anchor="middle" font-size="12">RSP</text>
  <rect class="fig-box" x="20" y="124" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="105" y="139" text-anchor="middle" font-size="12">RFLAGS</text>
  <rect class="fig-box" x="20" y="146" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="105" y="161" text-anchor="middle" font-size="12">CS</text>
  <rect class="fig-box" x="20" y="168" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="105" y="183" text-anchor="middle" font-size="12">RIP</text>
  <rect class="fig-accent" x="20" y="190" width="170" height="80" rx="0"/>
  <text class="fig-mono" x="105" y="224" text-anchor="middle" font-size="12">rax, rbx, ... r15</text>
  <text class="fig-muted" x="105" y="244" text-anchor="middle" font-size="12">15 registers</text>
  <text x="615" y="28" text-anchor="middle" font-size="13" font-weight="600">stack of task B</text>
  <rect class="fig-box" x="530" y="40" width="170" height="40" rx="0"/>
  <text class="fig-muted" x="615" y="65" text-anchor="middle" font-size="12">earlier frames</text>
  <rect class="fig-box" x="530" y="80" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="615" y="95" text-anchor="middle" font-size="12">SS</text>
  <rect class="fig-box" x="530" y="102" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="615" y="117" text-anchor="middle" font-size="12">RSP</text>
  <rect class="fig-box" x="530" y="124" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="615" y="139" text-anchor="middle" font-size="12">RFLAGS</text>
  <rect class="fig-box" x="530" y="146" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="615" y="161" text-anchor="middle" font-size="12">CS</text>
  <rect class="fig-box" x="530" y="168" width="170" height="22" rx="0"/>
  <text class="fig-mono" x="615" y="183" text-anchor="middle" font-size="12">RIP</text>
  <rect class="fig-accent" x="530" y="190" width="170" height="80" rx="0"/>
  <text class="fig-mono" x="615" y="224" text-anchor="middle" font-size="12">rax, rbx, ... r15</text>
  <text class="fig-muted" x="615" y="244" text-anchor="middle" font-size="12">15 registers</text>
  <text class="fig-muted" x="105" y="290" text-anchor="middle" font-size="12">CPU pushed 5 words,</text>
  <text class="fig-muted" x="105" y="307" text-anchor="middle" font-size="12">timer_entry 15</text>
  <text class="fig-muted" x="615" y="290" text-anchor="middle" font-size="12">timer_entry pops 15,</text>
  <text class="fig-muted" x="615" y="307" text-anchor="middle" font-size="12">iretq pops 5</text>
  <rect class="fig-box" x="250" y="120" width="220" height="150" rx="6"/>
  <text class="fig-mono" x="360" y="144" text-anchor="middle" font-size="13">schedule(rsp) -&gt; rsp</text>
  <text class="fig-mono" x="266" y="174" text-anchor="start" font-size="12">tasks[A].rsp = rsp</text>
  <text class="fig-mono" x="266" y="198" text-anchor="start" font-size="12">send the EOI</text>
  <text class="fig-mono" x="266" y="222" text-anchor="start" font-size="12">pick the next task</text>
  <text class="fig-mono" x="266" y="246" text-anchor="start" font-size="12">return tasks[B].rsp</text>
  <line class="fig-line" x1="192" y1="268" x2="248" y2="230" marker-end="url(#15-preempt-arrow)"/>
  <text class="fig-mono" x="200" y="298" text-anchor="start" font-size="12">rdi = A's rsp</text>
  <line class="fig-line" x1="472" y1="230" x2="528" y2="268" marker-end="url(#15-preempt-arrow)"/>
  <text class="fig-mono" x="520" y="298" text-anchor="end" font-size="12">rax = B's rsp</text>
</svg>
