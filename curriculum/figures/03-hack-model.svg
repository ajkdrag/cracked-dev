  <line class="fig-accent-line" x1="210" y1="192" x2="152" y2="192" marker-end="url(#03-hack-model-arrow)"/>
  <text class="fig-accent-text" x="181" y="184" text-anchor="middle" font-size="12">8</text>
  <text x="500" y="34" text-anchor="middle" font-size="14" font-weight="600">RAM</text>
  <rect class="fig-box" x="440" y="50" width="120" height="30"/>
  <text class="fig-mono fig-muted" x="452" y="70" font-size="12">19</text>
  <text class="fig-mono" x="520" y="70" text-anchor="middle" font-size="13">0</text>
  <rect class="fig-box" x="440" y="86" width="120" height="30"/>
  <text class="fig-mono fig-muted" x="452" y="106" font-size="12">20</text>
  <text class="fig-mono" x="520" y="106" text-anchor="middle" font-size="13">3</text>
