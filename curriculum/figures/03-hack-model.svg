      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="40" width="300" height="200" rx="6"/>
  <text x="40" y="62" font-size="14" font-weight="600">CPU</text>
