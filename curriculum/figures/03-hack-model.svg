  <text class="fig-mono" x="520" y="142" text-anchor="middle" font-size="13">7</text>
  <rect class="fig-box" x="440" y="158" width="120" height="30"/>
  <text class="fig-mono fig-muted" x="452" y="178" font-size="12">22</text>
  <text class="fig-mono" x="520" y="178" text-anchor="middle" font-size="13">0</text>
  <rect class="fig-box" x="440" y="194" width="120" height="30"/>
  <text class="fig-mono fig-muted" x="452" y="214" font-size="12">23</text>
  <text class="fig-mono" x="520" y="214" text-anchor="middle" font-size="13">12</text>
