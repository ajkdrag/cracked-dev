<svg viewBox="0 0 720 260" role="img" aria-label="A jump table lookup: a bounds check sends out-of-range values to the default case, and an in-range index selects one address from a table in .rodata that the jump then follows.">
  <defs>
    <marker id="05-jump-table-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="24" y="104" width="96" height="36" rx="6"/>
  <text class="fig-mono" x="72" y="127" text-anchor="middle" font-size="13">index x</text>

  <line class="fig-line" x1="120" y1="122" x2="156" y2="122" marker-end="url(#05-jump-table-arrow)"/>

  <rect class="fig-box" x="158" y="98" width="150" height="48" rx="6"/>
  <text x="233" y="118" text-anchor="middle" font-size="13">bounds check</text>
  <text class="fig-mono" x="233" y="136" text-anchor="middle" font-size="12">x in 0..6 ?</text>

  <path class="fig-line" d="M233 98 L233 60 L354 60" fill="none" marker-end="url(#05-jump-table-arrow)"/>
  <text class="fig-muted" x="250" y="52" font-size="12">out of range</text>
  <rect class="fig-box" x="356" y="44" width="184" height="32" rx="6"/>
  <text x="448" y="65" text-anchor="middle" font-size="13">default case</text>

  <line class="fig-line" x1="308" y1="122" x2="354" y2="122" marker-end="url(#05-jump-table-arrow)"/>
  <text class="fig-muted" x="331" y="114" text-anchor="middle" font-size="12">in range</text>

  <text class="fig-muted" x="356" y="96" font-size="12">table in .rodata, indexed by x</text>
  <rect class="fig-box" x="356" y="102" width="184" height="118" rx="6"/>
  <rect class="fig-box" x="366" y="108" width="164" height="24" rx="4"/>
  <text class="fig-mono" x="374" y="125" font-size="12">.quad .Lcase0</text>
  <rect class="fig-box" x="366" y="134" width="164" height="24" rx="4"/>
  <text class="fig-mono" x="374" y="151" font-size="12">.quad .Lcase1</text>
  <rect class="fig-box" x="366" y="160" width="164" height="24" rx="4"/>
  <text class="fig-mono" x="374" y="177" font-size="12">.quad .Ldefault</text>
  <rect class="fig-accent" x="366" y="186" width="164" height="24" rx="4"/>
  <text class="fig-mono" x="374" y="203" font-size="12">.quad .Lcase3</text>

  <line class="fig-line" x1="530" y1="198" x2="576" y2="198" marker-end="url(#05-jump-table-arrow)"/>
  <rect class="fig-accent" x="578" y="180" width="120" height="36" rx="6"/>
  <text class="fig-mono" x="638" y="203" text-anchor="middle" font-size="12">jmp .Lcase3</text>

  <text class="fig-muted" x="638" y="150" text-anchor="middle" font-size="12">for x = 3</text>
</svg>
