<svg viewBox="0 0 720 330" role="img" aria-label="Side view. The view frustum is the part of space the camera sees, between the near and the far plane. Points P1 and P2 have the same height, but P2 is farther away. After the divide by w the frustum becomes a box from -1 to 1, and P2 lands closer to the middle, so it looks smaller">
  <defs>
    <marker id="13-frustum-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <polygon class="fig-box" points="80.0,142.0 330.0,29.5 330.0,290.5 80.0,178.0"/>
  <line class="fig-line" x1="40" y1="160" x2="330" y2="29.5"/>
  <line class="fig-line" x1="40" y1="160" x2="330" y2="290.5"/>
  <line class="fig-line" x1="40" y1="160" x2="350" y2="160" stroke-dasharray="3 4"/>
  <line class="fig-accent-line" x1="80" y1="142" x2="80" y2="178" stroke-width="1.5"/>
  <circle class="fig-accent-fill" cx="40" cy="160" r="5"/>
  <text x="40" y="182" text-anchor="middle" font-size="12">camera</text>
  <text class="fig-accent-text" x="82" y="196" text-anchor="middle" font-size="12">near</text>
  <text x="330" y="308.5" text-anchor="middle" font-size="12">far</text>
  <text class="fig-mono" x="344" y="178" text-anchor="middle" font-size="12">-z</text>
  <line class="fig-line" x1="40" y1="160" x2="150" y2="120" stroke-dasharray="4 3"/>
  <circle class="fig-accent-fill" cx="150" cy="120" r="4"/>
  <text class="fig-mono" x="150" y="110" text-anchor="middle" font-size="12">P1</text>
  <line class="fig-accent-line" x1="40" y1="160" x2="300" y2="120" stroke-dasharray="4 3"/>
  <circle class="fig-accent-fill" cx="300" cy="120" r="4"/>
  <text class="fig-mono" x="300" y="110" text-anchor="middle" font-size="12">P2</text>
  <rect class="fig-box" x="470" y="50" width="220" height="220" rx="0"/>
  <line class="fig-line" x1="470" y1="160" x2="690" y2="160" stroke-dasharray="3 4"/>
  <text class="fig-mono fig-accent-text" x="470" y="288" text-anchor="middle" font-size="12">z = -1</text>
  <text class="fig-mono" x="690" y="288" text-anchor="middle" font-size="12">z = 1</text>
  <text class="fig-mono" x="698" y="54" text-anchor="start" font-size="12">1</text>
  <text class="fig-mono" x="698" y="274" text-anchor="start" font-size="12">-1</text>
  <circle class="fig-accent-fill" cx="632.4" cy="71.1111" r="4"/>
  <text class="fig-mono" x="624.4" y="75.1111" text-anchor="end" font-size="12">P1</text>
  <circle class="fig-accent-fill" cx="685.938" cy="122.393" r="4"/>
  <text class="fig-mono" x="677.938" y="126.393" text-anchor="end" font-size="12">P2</text>
  <line class="fig-line" x1="375" y1="160" x2="458" y2="160" marker-end="url(#13-frustum-arrow)"/>
  <text class="fig-muted" x="416" y="150" text-anchor="middle" font-size="12">divide by w</text>
  <text x="185" y="315" text-anchor="middle" font-size="13" font-weight="600">view frustum</text>
  <text x="580" y="315" text-anchor="middle" font-size="13" font-weight="600">after the divide: NDC</text>
</svg>
