<svg viewBox="0 0 720 280" role="img" aria-label="SDL gives each shader stage two descriptor sets: a vertex shader reads textures and storage buffers from set 0 and uniforms from set 1, and a fragment shader reads textures with samplers from set 2 and uniforms from set 3. The space of an HLSL register names the set.">
  <defs>
    <marker id="14-descriptor-sets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="26" font-size="12">shader</text>
  <text class="fig-muted" x="230" y="26" font-size="12">descriptor set</text>
  <text class="fig-muted" x="470" y="26" font-size="12">how HLSL names it</text>
  <rect class="fig-box" x="20" y="40" width="150" height="100" rx="6"/>
  <text x="95.0" y="95.0" text-anchor="middle" font-size="13" font-weight="600">vertex shader</text>
  <rect class="fig-box" x="20" y="160" width="150" height="100" rx="6"/>
  <text x="95.0" y="215.0" text-anchor="middle" font-size="13" font-weight="600">fragment shader</text>
  <rect class="fig-box" x="230" y="40" width="200" height="40" rx="6"/>
  <text x="244" y="65" font-size="13" font-weight="600">set 0</text>
  <text class="fig-muted" x="420" y="65" text-anchor="end" font-size="12">textures, storage buffers</text>
  <text class="fig-mono" x="470" y="65" font-size="13">register(t0, space0)</text>
  <line class="fig-line" x1="170" y1="90" x2="228" y2="60" marker-end="url(#14-descriptor-sets-arrow)"/>
  <rect class="fig-box" x="230" y="100" width="200" height="40" rx="6"/>
  <text x="244" y="125" font-size="13" font-weight="600">set 1</text>
  <text class="fig-muted" x="420" y="125" text-anchor="end" font-size="12">uniforms</text>
  <text class="fig-mono" x="470" y="125" font-size="13">register(b0, space1)</text>
  <line class="fig-line" x1="170" y1="90" x2="228" y2="120" marker-end="url(#14-descriptor-sets-arrow)"/>
  <rect class="fig-accent" x="230" y="160" width="200" height="40" rx="6"/>
  <text x="244" y="185" font-size="13" font-weight="600">set 2</text>
  <text class="fig-muted" x="420" y="185" text-anchor="end" font-size="12">textures and samplers</text>
  <text class="fig-mono" x="470" y="185" font-size="13">register(t0, space2)</text>
  <line class="fig-line" x1="170" y1="210" x2="228" y2="180" marker-end="url(#14-descriptor-sets-arrow)"/>
  <rect class="fig-box" x="230" y="220" width="200" height="40" rx="6"/>
  <text x="244" y="245" font-size="13" font-weight="600">set 3</text>
  <text class="fig-muted" x="420" y="245" text-anchor="end" font-size="12">uniforms</text>
  <text class="fig-mono" x="470" y="245" font-size="13">register(b0, space3)</text>
  <line class="fig-line" x1="170" y1="210" x2="228" y2="240" marker-end="url(#14-descriptor-sets-arrow)"/>
  <text class="fig-muted" x="190" y="132" text-anchor="middle" font-size="12">reads</text>
  <text class="fig-muted" x="190" y="252" text-anchor="middle" font-size="12">reads</text>
</svg>
