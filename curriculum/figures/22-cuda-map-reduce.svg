<svg viewBox="0 0 720 360" role="img" aria-label="Left, the CUDA map: one thread per output element, in blocks of 32, with a bounds check. Right, the reduce for one output position: one block of 1024 threads, each thread sums every 1024th element into a local, then the block halves the shared array until one value is left.">
  <defs>
    <marker id="22-cuda-map-reduce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="150" y="28" text-anchor="middle" font-size="13" font-weight="600">map: one thread per element</text>
  <rect class="fig-box" x="26" y="48" width="82" height="60" rx="6"/>
  <text x="67.0" y="68" text-anchor="middle" font-size="12">block 0</text>
  <rect class="fig-accent-fill" x="32" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="41" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="50" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="59" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="68" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="77" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="86" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="95" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-box" x="116" y="48" width="82" height="60" rx="6"/>
  <text x="157.0" y="68" text-anchor="middle" font-size="12">block 1</text>
  <rect class="fig-accent-fill" x="122" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="131" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="140" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="149" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="158" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="167" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="176" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="185" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-box" x="206" y="48" width="82" height="60" rx="6"/>
  <text x="247.0" y="68" text-anchor="middle" font-size="12">block 2</text>
  <rect class="fig-accent-fill" x="212" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="221" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="230" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="239" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="248" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="257" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="266" y="80" width="7" height="18" rx="1"/>
  <rect class="fig-accent-fill" x="275" y="80" width="7" height="18" rx="1"/>
  <text class="fig-muted" x="150" y="128" text-anchor="middle" font-size="12">threads 0 to 31 in each block</text>
  <text class="fig-mono" x="150" y="160" text-anchor="middle" font-size="12">i = blockIdx.x * blockDim.x</text>
  <text class="fig-mono" x="150" y="178" text-anchor="middle" font-size="12" xml:space="preserve">    + threadIdx.x</text>
  <text class="fig-mono" x="150" y="204" text-anchor="middle" font-size="12">if i &lt; size:</text>
  <text class="fig-mono" x="150" y="222" text-anchor="middle" font-size="12" xml:space="preserve">  out[i] = fn(a[i])</text>
  <text class="fig-muted" x="150" y="260" text-anchor="middle" font-size="12">the last block has spare</text>
  <text class="fig-muted" x="150" y="276" text-anchor="middle" font-size="12">threads, the check stops them</text>
  <line class="fig-line" x1="300" y1="30" x2="300" y2="340"/>
  <text x="510" y="28" text-anchor="middle" font-size="13" font-weight="600">reduce: one block per output</text>
  <rect class="fig-box" x="330" y="48" width="88" height="30" rx="0"/>
  <text class="fig-mono" x="344" y="68" font-size="11">0..1023</text>
  <rect class="fig-accent-fill" x="334" y="50" width="6" height="26" rx="1"/>
  <rect class="fig-box" x="422" y="48" width="88" height="30" rx="0"/>
  <text class="fig-mono" x="436" y="68" font-size="11">1024..2047</text>
  <rect class="fig-accent-fill" x="426" y="50" width="6" height="26" rx="1"/>
  <rect class="fig-box" x="514" y="48" width="88" height="30" rx="0"/>
  <text class="fig-mono" x="528" y="68" font-size="11">2048..3071</text>
  <rect class="fig-accent-fill" x="518" y="50" width="6" height="26" rx="1"/>
  <rect class="fig-box" x="606" y="48" width="88" height="30" rx="0"/>
  <text class="fig-mono" x="620" y="68" font-size="11">3072..n</text>
  <rect class="fig-accent-fill" x="610" y="50" width="6" height="26" rx="1"/>
  <text class="fig-mono" x="510" y="98" text-anchor="middle" font-size="12">thread t reads t, t + 1024, t + 2048, ...</text>
  <rect class="fig-accent" x="340" y="112" width="340" height="34" rx="6"/>
  <text class="fig-mono" x="510" y="134" text-anchor="middle" font-size="12" xml:space="preserve">acc = fn(acc, a[j])   in a register</text>
  <line class="fig-line" x1="510" y1="146" x2="510" y2="164" marker-end="url(#22-cuda-map-reduce-arrow)"/>
  <rect class="fig-box" x="340.0" y="166" width="340" height="28" rx="0"/>
  <text class="fig-mono" x="510" y="185" text-anchor="middle" font-size="12">cache[1024] in shared memory</text>
  <rect class="fig-box" x="425.0" y="206" width="170" height="28" rx="0"/>
  <text class="fig-mono" x="510" y="225" text-anchor="middle" font-size="12">512</text>
  <rect class="fig-box" x="467.5" y="246" width="85" height="28" rx="0"/>
  <text class="fig-muted" x="560.5" y="265" font-size="12">256 ... 2</text>
  <rect class="fig-box" x="499.0" y="286" width="22" height="28" rx="0"/>
  <text class="fig-muted" x="529.0" y="305" font-size="12">1</text>
  <text class="fig-muted" x="380" y="236" text-anchor="middle" font-size="12">syncthreads</text>
  <text class="fig-mono" x="510" y="340" text-anchor="middle" font-size="12">thread 0 writes cache[0] to out[o]</text>
</svg>
