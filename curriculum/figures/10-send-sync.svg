<svg viewBox="0 0 720 290" role="img" aria-label="Send lets a value move from one thread to another. Sync lets two threads hold shared references to one value at the same time. Rc is neither, because clones in two threads would update one plain reference count without atomics.">
  <defs>
    <marker id="10-send-sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- panel 1: Send -->
  <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="600">Send: move it</text>
  <rect class="fig-box" x="35" y="52" width="80" height="34" rx="6"/>
  <text x="75" y="74" text-anchor="middle" font-size="13">thread 1</text>
  <rect class="fig-box" x="145" y="52" width="80" height="34" rx="6"/>
  <text x="185" y="74" text-anchor="middle" font-size="13">thread 2</text>
  <line class="fig-line" x1="75" y1="86" x2="75" y2="148" stroke-dasharray="4 3"/>
  <line class="fig-line" x1="185" y1="86" x2="185" y2="148"/>
  <rect class="fig-box" x="35" y="150" width="80" height="34" rx="6" stroke-dasharray="4 3"/>
  <text x="75" y="172" text-anchor="middle" font-size="13" class="fig-mono fig-muted">Swiss</text>
  <rect class="fig-accent" x="145" y="150" width="80" height="34" rx="6"/>
  <text x="185" y="172" text-anchor="middle" font-size="13" class="fig-mono">Swiss</text>
  <line class="fig-accent-line" x1="115" y1="167" x2="142" y2="167" marker-end="url(#10-send-sync-arrow)"/>
  <text x="130" y="210" text-anchor="middle" font-size="12" class="fig-muted">one owner at a time</text>
  <text x="130" y="262" text-anchor="middle" font-size="13" class="fig-mono">T: Send</text>

  <line class="fig-line" x1="245" y1="20" x2="245" y2="275" stroke-dasharray="4 4"/>

  <!-- panel 2: Sync -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600">Sync: share it</text>
  <rect class="fig-box" x="265" y="52" width="80" height="34" rx="6"/>
  <text x="305" y="74" text-anchor="middle" font-size="13">thread 1</text>
  <rect class="fig-box" x="375" y="52" width="80" height="34" rx="6"/>
  <text x="415" y="74" text-anchor="middle" font-size="13">thread 2</text>
  <line class="fig-line" x1="305" y1="86" x2="345" y2="148" marker-end="url(#10-send-sync-arrow)"/>
  <line class="fig-line" x1="415" y1="86" x2="375" y2="148" marker-end="url(#10-send-sync-arrow)"/>
  <text x="300" y="124" text-anchor="end" font-size="12" class="fig-mono">&amp;Swiss</text>
  <text x="420" y="124" font-size="12" class="fig-mono">&amp;Swiss</text>
  <rect class="fig-accent" x="320" y="150" width="80" height="34" rx="6"/>
  <text x="360" y="172" text-anchor="middle" font-size="13" class="fig-mono">Swiss</text>
  <text x="360" y="210" text-anchor="middle" font-size="12" class="fig-muted">both read at once</text>
  <text x="360" y="262" text-anchor="middle" font-size="13" class="fig-mono">T: Sync</text>

  <line class="fig-line" x1="475" y1="20" x2="475" y2="275" stroke-dasharray="4 4"/>

  <!-- panel 3: Rc -->
  <text x="590" y="30" text-anchor="middle" font-size="14" font-weight="600">Rc: neither</text>
  <rect class="fig-box" x="495" y="52" width="80" height="34" rx="6"/>
  <text x="535" y="74" text-anchor="middle" font-size="13">thread 1</text>
  <rect class="fig-box" x="605" y="52" width="80" height="34" rx="6"/>
  <text x="645" y="74" text-anchor="middle" font-size="13">thread 2</text>
  <line class="fig-line" x1="535" y1="86" x2="575" y2="148" marker-end="url(#10-send-sync-arrow)"/>
  <line class="fig-line" x1="645" y1="86" x2="605" y2="148" marker-end="url(#10-send-sync-arrow)"/>
  <text x="530" y="124" text-anchor="end" font-size="12" class="fig-mono">+= 1</text>
  <text x="650" y="124" font-size="12" class="fig-mono">+= 1</text>
  <rect class="fig-box" x="540" y="150" width="100" height="34" rx="6"/>
  <text x="590" y="172" text-anchor="middle" font-size="13" class="fig-mono">count: 2</text>
  <text x="590" y="210" text-anchor="middle" font-size="12" class="fig-muted">a plain add: lost update</text>
  <text x="590" y="262" text-anchor="middle" font-size="13" font-weight="600">rejected: E0277</text>
</svg>
