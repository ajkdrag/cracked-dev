<svg viewBox="0 0 720 300" role="img" aria-label="Your fused softmax, one row. The forward pass takes two reductions and one pass and saves only y. The backward pass takes the incoming gradient g, one more reduction for the dot product, and one pass to write dx.">
  <defs>
    <marker id="22-softmax-backward-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="13" font-weight="600">forward</text>
  <rect class="fig-box" x="20" y="44" width="110" height="52" rx="6"/>
  <text class="fig-mono" x="75.0" y="66" text-anchor="middle" font-size="12">x</text>
  <text class="fig-muted" x="75.0" y="85" text-anchor="middle" font-size="12">one row</text>
  <rect class="fig-box" x="160" y="44" width="140" height="52" rx="6"/>
  <text class="fig-mono" x="230.0" y="66" text-anchor="middle" font-size="12">m = max x</text>
  <text class="fig-muted" x="230.0" y="85" text-anchor="middle" font-size="12">reduction</text>
  <rect class="fig-box" x="330" y="44" width="160" height="52" rx="6"/>
  <text class="fig-mono" x="410.0" y="66" text-anchor="middle" font-size="12">s = sum exp(x - m)</text>
  <text class="fig-muted" x="410.0" y="85" text-anchor="middle" font-size="12">reduction</text>
  <rect class="fig-accent" x="520" y="44" width="180" height="52" rx="6"/>
  <text class="fig-mono" x="610.0" y="66" text-anchor="middle" font-size="12">y = exp(x - m) / s</text>
  <text class="fig-muted" x="610.0" y="85" text-anchor="middle" font-size="12">one pass</text>
  <line class="fig-line" x1="130" y1="70" x2="158" y2="70" marker-end="url(#22-softmax-backward-arrow)"/>
  <line class="fig-line" x1="300" y1="70" x2="328" y2="70" marker-end="url(#22-softmax-backward-arrow)"/>
  <line class="fig-line" x1="490" y1="70" x2="518" y2="70" marker-end="url(#22-softmax-backward-arrow)"/>
  <rect class="fig-box" x="560" y="124" width="140" height="36" rx="6" stroke-dasharray="4 3"/>
  <text class="fig-mono" x="630" y="147" text-anchor="middle" font-size="12">ctx saves y</text>
  <line class="fig-line" x1="630" y1="96" x2="630" y2="122" marker-end="url(#22-softmax-backward-arrow)"/>
  <text x="20" y="196" font-size="13" font-weight="600">backward</text>
  <rect class="fig-accent" x="20" y="210" width="200" height="52" rx="6"/>
  <text class="fig-mono" x="120.0" y="232" text-anchor="middle" font-size="12">dx = y * (g - dot)</text>
  <text class="fig-muted" x="120.0" y="251" text-anchor="middle" font-size="12">one pass</text>
  <rect class="fig-box" x="290" y="210" width="170" height="52" rx="6"/>
  <text class="fig-mono" x="375.0" y="232" text-anchor="middle" font-size="12">dot = sum g * y</text>
  <text class="fig-muted" x="375.0" y="251" text-anchor="middle" font-size="12">reduction</text>
  <rect class="fig-box" x="540" y="210" width="160" height="52" rx="6"/>
  <text class="fig-mono" x="620.0" y="232" text-anchor="middle" font-size="12">g</text>
  <text class="fig-muted" x="620.0" y="251" text-anchor="middle" font-size="12">from the next node</text>
  <line class="fig-accent-line" x1="538" y1="236" x2="462" y2="236" marker-end="url(#22-softmax-backward-arrow)"/>
  <line class="fig-accent-line" x1="288" y1="236" x2="222" y2="236" marker-end="url(#22-softmax-backward-arrow)"/>
  <path class="fig-line" d="M600 160 L600 186 L375 186 L375 208" fill="none" marker-end="url(#22-softmax-backward-arrow)"/>
  <path class="fig-line" d="M375 186 L110 186 L110 208" fill="none" marker-end="url(#22-softmax-backward-arrow)"/>
  <text class="fig-mono" x="470" y="180" text-anchor="middle" font-size="12">y</text>
  <text class="fig-muted" x="360" y="290" text-anchor="middle" font-size="12">x is never needed again, so it is not saved</text>
</svg>
