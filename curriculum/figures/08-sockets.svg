<svg viewBox="0 0 720 300" role="img" aria-label="A server holds one listening socket that new clients connect to, and one connected socket per client that accept returned. Bytes to and from a client move only on that client's own socket">
<defs><marker id="08-sockets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<rect class="fig-box" x="20" y="50" width="150" height="40" rx="6"/>
<text x="95" y="75" text-anchor="middle" font-size="13" font-weight="600">client 1</text>
<rect class="fig-box" x="20" y="120" width="150" height="40" rx="6"/>
<text x="95" y="145" text-anchor="middle" font-size="13" font-weight="600">client 2</text>
<rect class="fig-box" x="20" y="210" width="150" height="40" rx="6"/>
<text x="95" y="235" text-anchor="middle" font-size="13" font-weight="600">client 3, new</text>
<rect class="fig-box" x="330" y="20" width="370" height="260" rx="6"/>
<text x="515" y="42" text-anchor="middle" font-size="13" font-weight="600">server process</text>
<rect class="fig-box" x="350" y="50" width="200" height="40" rx="6"/>
<text class="fig-mono" x="450" y="75" text-anchor="middle" font-size="12">fd 5, connected</text>
<rect class="fig-box" x="350" y="120" width="200" height="40" rx="6"/>
<text class="fig-mono" x="450" y="145" text-anchor="middle" font-size="12">fd 6, connected</text>
<rect class="fig-accent" x="350" y="210" width="200" height="40" rx="6"/>
<text class="fig-mono" x="450" y="235" text-anchor="middle" font-size="12">fd 3, listening on 9000</text>
<line class="fig-line" x1="172" y1="70" x2="347" y2="70" marker-end="url(#08-sockets-arrow)"/>
<line class="fig-line" x1="348" y1="78" x2="173" y2="78" marker-end="url(#08-sockets-arrow)"/>
<text class="fig-muted" x="260" y="64" text-anchor="middle" font-size="12">bytes</text>
<line class="fig-line" x1="172" y1="140" x2="347" y2="140" marker-end="url(#08-sockets-arrow)"/>
<line class="fig-line" x1="348" y1="148" x2="173" y2="148" marker-end="url(#08-sockets-arrow)"/>
<text class="fig-muted" x="260" y="134" text-anchor="middle" font-size="12">bytes</text>
<line class="fig-accent-line" x1="172" y1="230" x2="347" y2="230" marker-end="url(#08-sockets-arrow)"/>
<text class="fig-accent-text" x="260" y="222" text-anchor="middle" font-size="12">connects</text>
<rect class="fig-box" x="580" y="190" width="100" height="40" rx="6" stroke-dasharray="4 3"/>
<text class="fig-mono" x="630" y="215" text-anchor="middle" font-size="12">fd 7</text>
<path class="fig-accent-line" d="M550 230 L565 230 L565 210 L577 210" fill="none" marker-end="url(#08-sockets-arrow)"/>
<text class="fig-accent-text" x="630" y="252" text-anchor="middle" font-size="12">accept returns</text>
<text class="fig-accent-text" x="630" y="268" text-anchor="middle" font-size="12">a new socket</text>
</svg>
