<svg viewBox="0 0 720 300" role="img" aria-label="A call to json_parse goes to a PLT stub that jumps through a GOT slot. before the first call the slot points back into the PLT resolver, and after the loader resolves it the slot points at json_parse inside libjson.so">
  <defs>
    <marker id="05-plt-got-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="30" y="56" width="160" height="44" rx="6"/>
  <text x="110" y="76" text-anchor="middle" font-size="13">your code</text>
  <text class="fig-mono fig-muted" x="110" y="93" text-anchor="middle" font-size="12">call json_parse@plt</text>

  <line class="fig-line" x1="190" y1="78" x2="235" y2="78" marker-end="url(#05-plt-got-arrow)"/>
  <text class="fig-muted" x="212" y="68" text-anchor="middle" font-size="12">calls</text>

  <rect class="fig-box" x="240" y="56" width="160" height="44" rx="6"/>
  <text x="320" y="76" text-anchor="middle" font-size="13">PLT stub</text>
  <text class="fig-mono fig-muted" x="320" y="93" text-anchor="middle" font-size="12">jmp *(GOT slot)</text>

  <line class="fig-line" x1="320" y1="100" x2="320" y2="146" marker-end="url(#05-plt-got-arrow)"/>
  <text class="fig-muted" x="334" y="126" font-size="12">reads</text>

  <rect class="fig-accent" x="240" y="146" width="160" height="44" rx="6"/>
  <text x="320" y="166" text-anchor="middle" font-size="13">GOT slot</text>
  <text class="fig-muted" x="320" y="182" text-anchor="middle" font-size="12">one address</text>

  <path class="fig-accent-line" d="M400 158 L470 110" fill="none" marker-end="url(#05-plt-got-arrow)"/>
  <text class="fig-muted" x="430" y="128" text-anchor="end" font-size="12">before</text>
  <path class="fig-accent-line" d="M400 178 L470 226" fill="none" marker-end="url(#05-plt-got-arrow)"/>
  <text class="fig-muted" x="430" y="214" text-anchor="end" font-size="12">after</text>

  <rect class="fig-box" x="480" y="80" width="200" height="44" rx="6"/>
  <text x="580" y="100" text-anchor="middle" font-size="13">the PLT resolver</text>
  <text class="fig-muted" x="580" y="116" text-anchor="middle" font-size="12">fills the slot, then jumps</text>
  <rect class="fig-accent" x="480" y="212" width="200" height="44" rx="6"/>
  <text x="580" y="232" text-anchor="middle" font-size="13">json_parse</text>
  <text class="fig-mono fig-muted" x="580" y="248" text-anchor="middle" font-size="12">in libjson.so</text>
</svg>
