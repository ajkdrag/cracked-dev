<svg viewBox="0 0 720 280" role="img" aria-label="A 64-bit double is 1 sign bit, 11 exponent bits and 52 fraction bits. The number 1.5 has an ordinary exponent. When all 11 exponent bits are ones and the top fraction bit is set, the value is a quiet NaN, and the remaining fraction bits are free to hold other data.">
  <defs>
    <marker id="11-double-bits-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono fig-muted" x="160" y="40" text-anchor="middle" font-size="12">63</text>
  <text class="fig-mono fig-muted" x="280" y="40" text-anchor="middle" font-size="12">62 .. 52</text>
  <text class="fig-mono fig-muted" x="530" y="40" text-anchor="middle" font-size="12">51 .. 0</text>
  <text x="118" y="75" text-anchor="end" font-size="13" font-weight="600">fields</text>
  <rect class="fig-box" x="130" y="52" width="60" height="36" rx="6"/>
  <text x="160" y="75" text-anchor="middle" font-size="12">sign</text>
  <rect class="fig-box" x="190" y="52" width="180" height="36" rx="6"/>
  <text x="280" y="75" text-anchor="middle" font-size="12">exponent, 11 bits</text>
  <rect class="fig-box" x="370" y="52" width="320" height="36" rx="6"/>
  <text x="530" y="75" text-anchor="middle" font-size="12">fraction, 52 bits</text>
  <text class="fig-mono" x="118" y="147" text-anchor="end" font-size="13" font-weight="600">1.5</text>
  <rect class="fig-box" x="130" y="124" width="60" height="36" rx="6"/>
  <text class="fig-mono" x="160" y="147" text-anchor="middle" font-size="12">0</text>
  <rect class="fig-box" x="190" y="124" width="180" height="36" rx="6"/>
  <text class="fig-mono" x="280" y="147" text-anchor="middle" font-size="12">01111111111</text>
  <rect class="fig-box" x="370" y="124" width="320" height="36" rx="6"/>
  <text class="fig-mono" x="530" y="147" text-anchor="middle" font-size="12">1000 ... 0000</text>
  <text x="118" y="219" text-anchor="end" font-size="13" font-weight="600">quiet NaN</text>
  <rect class="fig-box" x="130" y="196" width="60" height="36" rx="6"/>
  <text class="fig-mono" x="160" y="219" text-anchor="middle" font-size="12">0</text>
  <rect class="fig-accent" x="190" y="196" width="180" height="36" rx="6"/>
  <text class="fig-mono" x="280" y="219" text-anchor="middle" font-size="12">11111111111</text>
  <rect class="fig-accent" x="370" y="196" width="50" height="36" rx="6"/>
  <text class="fig-mono" x="395" y="219" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-box" x="420" y="196" width="270" height="36" rx="6"/>
  <text class="fig-muted" x="555" y="219" text-anchor="middle" font-size="12">51 bits free for a tag or pointer</text>
  <text class="fig-accent-text" x="280" y="254" text-anchor="middle" font-size="12">all ones: infinity or NaN</text>
  <text class="fig-accent-text" x="395" y="254" text-anchor="middle" font-size="12">quiet bit</text>
</svg>
