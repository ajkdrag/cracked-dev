<svg viewBox="0 0 720 330" role="img" aria-label="Left: the edge function of an edge from a to b is positive on one side of the line, negative on the other side and zero on the line. Right: a point is inside the triangle when the edge functions of all three edges are positive">
  <defs>
    <marker id="13-edge-function-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <polygon class="fig-box" points="30.0,175.6 320.0,94.4 320.0,250.0 30.0,250.0" stroke="none"/>
  <line class="fig-line" x1="30" y1="175.6" x2="320" y2="94.4"/>
  <line class="fig-accent-line" x1="50" y1="170" x2="175" y2="135" marker-end="url(#13-edge-function-arrow)"/>
  <line class="fig-accent-line" x1="50" y1="170" x2="300" y2="100"/>
  <circle class="fig-accent-fill" cx="50" cy="170" r="4"/>
  <text class="fig-mono" x="50" y="160" text-anchor="middle" font-size="13">a</text>
  <circle class="fig-accent-fill" cx="300" cy="100" r="4"/>
  <text class="fig-mono" x="300" y="90" text-anchor="middle" font-size="13">b</text>
  <circle class="fig-accent-fill" cx="210" cy="200" r="4"/>
  <text class="fig-mono" x="220" y="204" text-anchor="start" font-size="12">p: E &gt; 0</text>
  <circle class="fig-box" cx="140" cy="80" r="4"/>
  <text class="fig-mono" x="150" y="84" text-anchor="start" font-size="12">q: E &lt; 0</text>
  <circle class="fig-box" cx="230" cy="119.6" r="4"/>
  <text class="fig-mono" x="240" y="137.6" text-anchor="start" font-size="12">r: E = 0</text>
  <text class="fig-muted" x="175" y="275" text-anchor="middle" font-size="12">the side of the edge with E &gt; 0 is shaded</text>
  <polygon class="fig-accent" points="420.0,230.0 530.0,70.0 680.0,215.0"/>
  <line class="fig-line" x1="420" y1="230" x2="475" y2="150" marker-end="url(#13-edge-function-arrow)"/>
  <line class="fig-line" x1="530" y1="70" x2="605" y2="142.5" marker-end="url(#13-edge-function-arrow)"/>
  <line class="fig-line" x1="680" y1="215" x2="550" y2="222.5" marker-end="url(#13-edge-function-arrow)"/>
  <circle class="fig-accent-fill" cx="420" cy="230" r="4"/>
  <text class="fig-mono" x="412" y="248" text-anchor="middle" font-size="13">v0</text>
  <circle class="fig-accent-fill" cx="530" cy="70" r="4"/>
  <text class="fig-mono" x="530" y="60" text-anchor="middle" font-size="13">v1</text>
  <circle class="fig-accent-fill" cx="680" cy="215" r="4"/>
  <text class="fig-mono" x="688" y="233" text-anchor="middle" font-size="13">v2</text>
  <circle class="fig-accent-fill" cx="545" cy="175" r="4"/>
  <text class="fig-mono" x="545" y="197" text-anchor="middle" font-size="12">all three &gt; 0: inside</text>
  <circle class="fig-box" cx="615" cy="105" r="4"/>
  <text class="fig-mono" x="625" y="103" text-anchor="start" font-size="12">one &lt; 0:</text>
  <text class="fig-mono" x="625" y="119" text-anchor="start" font-size="12">outside</text>
  <text class="fig-mono" x="360" y="312" text-anchor="middle" font-size="13">E(a, b, p) = (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x)</text>
  <text x="175" y="40" text-anchor="middle" font-size="13" font-weight="600">one edge, y pointing down</text>
  <text x="550" y="40" text-anchor="middle" font-size="13" font-weight="600">three edges</text>
</svg>
