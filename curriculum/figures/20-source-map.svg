<svg viewBox="0 0 720 392" role="img" aria-label="The Valkey checkout by directory: src holds the server, tests the Tcl integration tests, src/unit the C++ unit tests, deps the libraries Valkey vendors and utils the scripts. Inside src, each group of files has one job.">
  <defs>
    <marker id="20-source-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="20" width="128" height="56" rx="6"/>
  <text class="fig-mono" x="84.0" y="44" text-anchor="middle" font-size="14" font-weight="600">src/</text>
  <text class="fig-muted" x="84.0" y="63" text-anchor="middle" font-size="12">the server, in C</text>
  <rect class="fig-box" x="158" y="20" width="128" height="56" rx="6"/>
  <text class="fig-mono" x="222.0" y="44" text-anchor="middle" font-size="14" font-weight="600">tests/</text>
  <text class="fig-muted" x="222.0" y="63" text-anchor="middle" font-size="12">Tcl, real servers</text>
  <rect class="fig-box" x="296" y="20" width="128" height="56" rx="6"/>
  <text class="fig-mono" x="360.0" y="44" text-anchor="middle" font-size="14" font-weight="600">src/unit/</text>
  <text class="fig-muted" x="360.0" y="63" text-anchor="middle" font-size="12">C++ GoogleTest</text>
  <rect class="fig-box" x="434" y="20" width="128" height="56" rx="6"/>
  <text class="fig-mono" x="498.0" y="44" text-anchor="middle" font-size="14" font-weight="600">deps/</text>
  <text class="fig-muted" x="498.0" y="63" text-anchor="middle" font-size="12">jemalloc, lua, ...</text>
  <rect class="fig-box" x="572" y="20" width="128" height="56" rx="6"/>
  <text class="fig-mono" x="636.0" y="44" text-anchor="middle" font-size="14" font-weight="600">utils/</text>
  <text class="fig-muted" x="636.0" y="63" text-anchor="middle" font-size="12">scripts, generators</text>
  <rect class="fig-box" x="20" y="104" width="680" height="270" rx="6"/>
  <line class="fig-line" x1="84" y1="76" x2="84" y2="102"/>
  <text x="40" y="126" font-size="13" font-weight="600">inside src/, by job</text>
  <rect class="fig-box" x="36" y="140" width="316" height="50" rx="6"/>
  <text x="50" y="161" font-size="13" font-weight="600">event loop</text>
  <text class="fig-mono" x="50" y="180" font-size="12" xml:space="preserve">ae.c  ae_epoll.c</text>
  <rect class="fig-box" x="36" y="198" width="316" height="50" rx="6"/>
  <text x="50" y="219" font-size="13" font-weight="600">connections, RESP</text>
  <text class="fig-mono" x="50" y="238" font-size="12" xml:space="preserve">socket.c  networking.c</text>
  <rect class="fig-box" x="36" y="256" width="316" height="50" rx="6"/>
  <text x="50" y="277" font-size="13" font-weight="600">command table, call</text>
  <text class="fig-mono" x="50" y="296" font-size="12" xml:space="preserve">server.c  commands.def</text>
  <rect class="fig-box" x="36" y="314" width="316" height="50" rx="6"/>
  <text x="50" y="335" font-size="13" font-weight="600">one file per type</text>
  <text class="fig-mono" x="50" y="354" font-size="12" xml:space="preserve">t_string.c  t_list.c ...</text>
  <rect class="fig-box" x="368" y="140" width="316" height="50" rx="6"/>
  <text x="382" y="161" font-size="13" font-weight="600">keyspace</text>
  <text class="fig-mono" x="382" y="180" font-size="12" xml:space="preserve">db.c  kvstore.c  hashtable.c</text>
  <rect class="fig-box" x="368" y="198" width="316" height="50" rx="6"/>
  <text x="382" y="219" font-size="13" font-weight="600">values, strings</text>
  <text class="fig-mono" x="382" y="238" font-size="12" xml:space="preserve">object.c  sds.c  zmalloc.c</text>
  <rect class="fig-box" x="368" y="256" width="316" height="50" rx="6"/>
  <text x="382" y="277" font-size="13" font-weight="600">persistence</text>
  <text class="fig-mono" x="382" y="296" font-size="12" xml:space="preserve">aof.c  rdb.c  bio.c</text>
  <rect class="fig-box" x="368" y="314" width="316" height="50" rx="6"/>
  <text x="382" y="335" font-size="13" font-weight="600">replication, cluster</text>
  <text class="fig-mono" x="382" y="354" font-size="12" xml:space="preserve">replication.c  cluster*.c</text>
</svg>
