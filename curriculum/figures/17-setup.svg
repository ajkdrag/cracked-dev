<svg viewBox="0 0 720 340" role="img" aria-label="Two USB cables leave the laptop. The Pico 2's cable stays with Windows, which shows the RP2350 drive in Explorer. The Debug Probe's cable is shared by usbipd and attached to WSL2, where OpenOCD, gdb-multiarch and minicom use it. The probe reaches the Pico 2 over three SWD wires and three UART wires.">
  <defs>
    <marker id="17-setup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="300" height="300" rx="6"/>
  <text x="36" y="42" font-size="14" font-weight="600">Laptop</text>

  <rect class="fig-box" x="36" y="52" width="268" height="146" rx="6"/>
  <text x="52" y="74" font-size="13" font-weight="600">Windows 11</text>
  <rect class="fig-box" x="52" y="86" width="236" height="40" rx="6"/>
  <text x="170" y="102" text-anchor="middle" font-size="13" font-weight="600">Explorer</text>
  <text class="fig-muted" x="170" y="118" text-anchor="middle" font-size="12">shows the RP2350 drive</text>
  <rect class="fig-box" x="52" y="140" width="236" height="40" rx="6"/>
  <text x="170" y="156" text-anchor="middle" font-size="13" font-weight="600">usbipd</text>
  <text class="fig-muted" x="170" y="172" text-anchor="middle" font-size="12">shares the probe with WSL</text>

  <line class="fig-line" x1="170" y1="180" x2="170" y2="220" marker-end="url(#17-setup-arrow)"/>
  <text class="fig-muted" x="182" y="212" font-size="12">attach --wsl</text>

  <rect class="fig-accent" x="36" y="224" width="268" height="84" rx="6"/>
  <text x="52" y="246" font-size="13" font-weight="600">WSL2 Ubuntu</text>
  <text class="fig-mono" x="52" y="270" font-size="12">openocd, gdb-multiarch</text>
  <text class="fig-mono" x="52" y="292" font-size="12">minicom on /dev/ttyACM0</text>

  <line class="fig-line" x1="288" y1="106" x2="560" y2="106"/>
  <text class="fig-muted" x="436" y="98" text-anchor="middle" font-size="12">USB cable</text>
  <line class="fig-line" x1="288" y1="160" x2="380" y2="160"/>
  <text class="fig-muted" x="352" y="152" text-anchor="middle" font-size="12">USB</text>

  <rect class="fig-box" x="380" y="140" width="120" height="150" rx="6"/>
  <text x="440" y="176" text-anchor="middle" font-size="13" font-weight="600">Debug Probe</text>
  <rect class="fig-box" x="392" y="190" width="96" height="36" rx="6"/>
  <text x="440" y="213" text-anchor="middle" font-size="12">D port</text>
  <rect class="fig-box" x="392" y="240" width="96" height="36" rx="6"/>
  <text x="440" y="263" text-anchor="middle" font-size="12">U port</text>

  <line class="fig-line" x1="488" y1="208" x2="560" y2="208"/>
  <text class="fig-muted" x="524" y="200" text-anchor="middle" font-size="12">SWD</text>
  <line class="fig-line" x1="488" y1="258" x2="560" y2="258"/>
  <text class="fig-muted" x="524" y="250" text-anchor="middle" font-size="12">UART</text>

  <rect class="fig-accent" x="548" y="52" width="152" height="250" rx="6"/>
  <text x="624" y="74" text-anchor="middle" font-size="14" font-weight="600">Pico 2</text>
  <rect class="fig-box" x="560" y="86" width="128" height="40" rx="6"/>
  <text x="624" y="102" text-anchor="middle" font-size="13">USB port</text>
  <text class="fig-muted" x="624" y="118" text-anchor="middle" font-size="12">power, BOOTSEL</text>
  <rect class="fig-box" x="560" y="188" width="128" height="40" rx="6"/>
  <text x="624" y="204" text-anchor="middle" font-size="13">debug connector</text>
  <text class="fig-mono" x="624" y="220" text-anchor="middle" font-size="11">SWCLK SWDIO GND</text>
  <rect class="fig-box" x="560" y="238" width="128" height="40" rx="6"/>
  <text x="624" y="254" text-anchor="middle" font-size="13">pins</text>
  <text class="fig-mono" x="624" y="270" text-anchor="middle" font-size="11">GP0 GP1 GND</text>
</svg>
