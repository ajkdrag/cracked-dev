<svg viewBox="0 0 720 230" role="img" aria-label="The one-bit register: the Mux feeds the DFF either in or the DFF's own output, chosen by load, and the wire from out back to the Mux keeps the value while load is 0">
  <defs>
    <marker id="03-bit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="160" y="30" text-anchor="middle" font-size="13">load</text>
  <line class="fig-line" x1="160" y1="38" x2="160" y2="68" marker-end="url(#03-bit-arrow)"/>
  <text class="fig-mono" x="20" y="134" font-size="13">in</text>
  <line class="fig-line" x1="44" y1="130" x2="118" y2="130" marker-end="url(#03-bit-arrow)"/>
  <rect class="fig-box" x="120" y="70" width="80" height="80" rx="6"/>
  <text x="160" y="115" text-anchor="middle" font-size="14" font-weight="600">Mux</text>
  <text class="fig-muted" x="128" y="94" font-size="11">a</text>
  <text class="fig-muted" x="128" y="134" font-size="11">b</text>
  <text class="fig-muted" x="160" y="84" text-anchor="middle" font-size="11">sel</text>
  <line class="fig-line" x1="200" y1="110" x2="278" y2="110" marker-end="url(#03-bit-arrow)"/>
  <rect class="fig-accent" x="280" y="80" width="100" height="60" rx="6"/>
  <text x="330" y="106" text-anchor="middle" font-size="14" font-weight="600">DFF</text>
  <text class="fig-muted" x="330" y="124" text-anchor="middle" font-size="12">one cycle late</text>
  <line class="fig-line" x1="380" y1="110" x2="508" y2="110" marker-end="url(#03-bit-arrow)"/>
  <text class="fig-mono" x="516" y="114" font-size="13">out</text>
  <circle class="fig-accent-fill" cx="450" cy="110" r="3.5"/>
  <path class="fig-accent-line" d="M450 110 L450 190 L90 190 L90 90 L118 90" marker-end="url(#03-bit-arrow)"/>
  <text class="fig-accent-text" x="270" y="182" text-anchor="middle" font-size="12">feedback: the old value</text>
  <text class="fig-mono" x="560" y="160" font-size="12">load = 0: keeps out</text>
  <text class="fig-mono" x="560" y="180" font-size="12">load = 1: stores in</text>
</svg>
