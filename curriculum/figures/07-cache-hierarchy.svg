<svg viewBox="0 0 720 340" role="img" aria-label="The cache hierarchy of one Alder Lake P core: each core has its own 48 KB L1 data cache and 1.25 MB L2, all cores share an L3 of up to 30 MB, and DRAM holds gigabytes. Each level down is larger and slower, and data moves between levels in 64-byte lines">
  <defs>
    <marker id="07-cache-hierarchy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="20" width="140" height="40" rx="6"/>
  <text x="90" y="45" text-anchor="middle" font-size="13">core 0</text>
  <rect class="fig-box" x="20" y="80" width="140" height="40" rx="6"/>
  <text x="90" y="105" text-anchor="middle" font-size="13">L1 data</text>
  <rect class="fig-box" x="20" y="140" width="140" height="40" rx="6"/>
  <text x="90" y="165" text-anchor="middle" font-size="13">L2</text>
  <line class="fig-line" x1="90" y1="60" x2="90" y2="80"/>
  <line class="fig-line" x1="90" y1="120" x2="90" y2="140"/>
  <line class="fig-line" x1="90" y1="180" x2="90" y2="200"/>
  <rect class="fig-accent" x="180" y="20" width="140" height="40" rx="6"/>
  <text x="250" y="45" text-anchor="middle" font-size="13">core 1</text>
  <rect class="fig-box" x="180" y="80" width="140" height="40" rx="6"/>
  <text x="250" y="105" text-anchor="middle" font-size="13">L1 data</text>
  <rect class="fig-box" x="180" y="140" width="140" height="40" rx="6"/>
  <text x="250" y="165" text-anchor="middle" font-size="13">L2</text>
  <line class="fig-line" x1="250" y1="60" x2="250" y2="80"/>
  <line class="fig-line" x1="250" y1="120" x2="250" y2="140"/>
  <line class="fig-line" x1="250" y1="180" x2="250" y2="200"/>
  <rect class="fig-box" x="20" y="200" width="300" height="40" rx="6"/>
  <text x="170" y="225" text-anchor="middle" font-size="13">L3, shared by all cores</text>
  <rect class="fig-box" x="20" y="260" width="300" height="40" rx="6"/>
  <text x="170" y="285" text-anchor="middle" font-size="13">DRAM</text>
  <line class="fig-line" x1="170" y1="240" x2="170" y2="260"/>
  <text x="360" y="97" font-size="13">48 KB per core</text>
  <text class="fig-muted" x="360" y="114" font-size="12">about 5 cycles</text>
  <text x="360" y="157" font-size="13">1.25 MB per core</text>
  <text class="fig-muted" x="360" y="174" font-size="12">about 15 cycles</text>
  <text x="360" y="217" font-size="13">4 to 30 MB in all</text>
  <text class="fig-muted" x="360" y="234" font-size="12">about 65 cycles</text>
  <text x="360" y="277" font-size="13">gigabytes</text>
  <text class="fig-muted" x="360" y="294" font-size="12">hundreds of cycles</text>
  <text class="fig-muted" x="360" y="37" font-size="12">Alder Lake P core, Agner Fog table 13.1</text>
  <text class="fig-muted" x="360" y="54" font-size="12">size and load latency, 64-byte lines</text>
  <line class="fig-line" x1="600" y1="84" x2="600" y2="294" marker-end="url(#07-cache-hierarchy-arrow)"/>
  <text class="fig-muted" x="612" y="160" font-size="12">larger</text>
  <text class="fig-muted" x="612" y="178" font-size="12">and slower</text>
</svg>
