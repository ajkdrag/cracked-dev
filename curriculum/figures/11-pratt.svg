<svg viewBox="0 0 720 360" role="img" aria-label="Pratt parsing of 1 + 2 * 3. Each call of parsePrecedence handles operators at its level or higher. The + at TERM calls binary, which parses its right side at FACTOR, so the * binds first and MULTIPLY is emitted before ADD.">
  <defs>
    <marker id="11-pratt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="40" text-anchor="start" font-size="12">precedence, low to high</text>
  <rect class="fig-accent" x="20" y="56" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="72" text-anchor="start" font-size="12">ASSIGNMENT</text>
  <rect class="fig-box" x="20" y="82" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="98" text-anchor="start" font-size="12">OR</text>
  <rect class="fig-box" x="20" y="108" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="124" text-anchor="start" font-size="12">AND</text>
  <rect class="fig-box" x="20" y="134" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="150" text-anchor="start" font-size="12">EQUALITY</text>
  <rect class="fig-box" x="20" y="160" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="176" text-anchor="start" font-size="12">COMPARISON</text>
  <rect class="fig-accent" x="20" y="186" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="202" text-anchor="start" font-size="12">TERM  (+ -)</text>
  <rect class="fig-accent" x="20" y="212" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="228" text-anchor="start" font-size="12">FACTOR  (* /)</text>
  <rect class="fig-accent" x="20" y="238" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="254" text-anchor="start" font-size="12">UNARY  (! -)</text>
  <rect class="fig-box" x="20" y="264" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="280" text-anchor="start" font-size="12">CALL</text>
  <rect class="fig-box" x="20" y="290" width="150" height="22" rx="6"/>
  <text class="fig-mono" x="30" y="306" text-anchor="start" font-size="12">PRIMARY</text>
  <rect class="fig-box" x="200" y="30" width="500" height="270" rx="6"/>
  <text class="fig-mono" x="212" y="50" text-anchor="start" font-size="13" font-weight="600">parsePrecedence(ASSIGNMENT)</text>
  <text class="fig-muted" x="560" y="50" text-anchor="start" font-size="12">emits</text>
  <text class="fig-mono" x="224" y="72" text-anchor="start" font-size="12">number 1</text>
  <text class="fig-mono fig-accent-text" x="560" y="72" text-anchor="start" font-size="12">CONSTANT 1</text>
  <text class="fig-mono" x="224" y="92" text-anchor="start" font-size="12">+ is TERM, TERM &gt;= ASSIGNMENT</text>
  <rect class="fig-box" x="220" y="102" width="466" height="168" rx="6"/>
  <text class="fig-mono" x="232" y="122" text-anchor="start" font-size="13" font-weight="600">binary(): parsePrecedence(FACTOR)</text>
  <text class="fig-mono" x="244" y="144" text-anchor="start" font-size="12">number 2</text>
  <text class="fig-mono fig-accent-text" x="560" y="144" text-anchor="start" font-size="12">CONSTANT 2</text>
  <text class="fig-mono" x="244" y="164" text-anchor="start" font-size="12">* is FACTOR, FACTOR &gt;= FACTOR</text>
  <rect class="fig-accent" x="240" y="174" width="432" height="66" rx="6"/>
  <text class="fig-mono" x="252" y="194" text-anchor="start" font-size="13" font-weight="600">binary(): parsePrecedence(UNARY)</text>
  <text class="fig-mono" x="264" y="214" text-anchor="start" font-size="12">number 3</text>
  <text class="fig-mono fig-accent-text" x="560" y="214" text-anchor="start" font-size="12">CONSTANT 3</text>
  <text class="fig-mono fig-muted" x="264" y="232" text-anchor="start" font-size="12">end of input is NONE: return</text>
  <text class="fig-mono fig-muted" x="244" y="260" text-anchor="start" font-size="12">end of input is NONE: return</text>
  <text class="fig-mono fig-accent-text" x="560" y="260" text-anchor="start" font-size="12">MULTIPLY</text>
  <text class="fig-mono fig-muted" x="224" y="290" text-anchor="start" font-size="12">end of input is NONE: return</text>
  <text class="fig-mono fig-accent-text" x="560" y="290" text-anchor="start" font-size="12">ADD</text>
  <text class="fig-muted" x="200" y="330" text-anchor="start" font-size="12">bytecode in order: CONSTANT 1, CONSTANT 2, CONSTANT 3, MULTIPLY, ADD</text>
</svg>
