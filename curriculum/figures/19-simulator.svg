<svg viewBox="0 0 720 340" role="img" aria-label="One process holds three Raft cores, a virtual clock and a queue of messages in flight. Every node is ticked, messages are delivered when their time comes, every message a node sends passes through fault choices made from one seed, and the checker reads every node after every step.">
  <defs>
    <marker id="19-simulator-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="40" y="30" width="200" height="44" rx="6"/>
  <text x="140" y="49" text-anchor="middle" font-size="13" font-weight="600">checker</text>
  <text class="fig-muted" x="140" y="66" text-anchor="middle" font-size="12">paper&#x27;s Figure 3 properties</text>
  <rect class="fig-box" x="300" y="30" width="200" height="44" rx="6"/>
  <text x="400" y="49" text-anchor="middle" font-size="13" font-weight="600">virtual clock</text>
  <text class="fig-mono" x="400" y="66" text-anchor="middle" font-size="12">now = 1840 ms</text>
  <rect class="fig-accent" x="560" y="30" width="140" height="44" rx="6"/>
  <text x="630" y="49" text-anchor="middle" font-size="13" font-weight="600">seed</text>
  <text class="fig-mono" x="630" y="66" text-anchor="middle" font-size="12">42</text>
  <rect class="fig-box" x="40" y="120" width="200" height="150" rx="6"/>
  <text x="140" y="144" text-anchor="middle" font-size="13" font-weight="600">messages in flight</text>
  <text class="fig-mono" x="56" y="172" font-size="12">1843  vote    2 to 0</text>
  <text class="fig-mono" x="56" y="196" font-size="12">1851  append  0 to 1</text>
  <text class="fig-mono" x="56" y="220" font-size="12">1851  append  0 to 2</text>
  <text class="fig-mono" x="56" y="244" font-size="12">1866  reply   1 to 0</text>
  <rect class="fig-box" x="312" y="112" width="176" height="166" rx="6" stroke-dasharray="5 4"/>
  <rect class="fig-box" x="330" y="124" width="140" height="40" rx="6"/>
  <text x="400" y="149" text-anchor="middle" font-size="13">node 0</text>
  <rect class="fig-box" x="330" y="176" width="140" height="40" rx="6"/>
  <text x="400" y="201" text-anchor="middle" font-size="13">node 1</text>
  <rect class="fig-box" x="330" y="228" width="140" height="40" rx="6"/>
  <text x="400" y="253" text-anchor="middle" font-size="13">node 2</text>
  <line class="fig-line" x1="400" y1="74" x2="400" y2="110" marker-end="url(#19-simulator-arrow)"/>
  <text class="fig-muted" x="408" y="97" font-size="12">ticks all, every 10 ms</text>
  <line class="fig-line" x1="240" y1="196" x2="310" y2="196" marker-end="url(#19-simulator-arrow)"/>
  <text class="fig-muted" x="276" y="188" text-anchor="middle" font-size="12">deliver</text>
  <line class="fig-line" x1="312" y1="120" x2="242" y2="76" marker-end="url(#19-simulator-arrow)"/>
  <text class="fig-muted" x="300" y="94" font-size="12">reads all</text>
  <rect class="fig-accent" x="560" y="120" width="140" height="150" rx="6"/>
  <text x="630" y="144" text-anchor="middle" font-size="13" font-weight="600">faults</text>
  <text x="630" y="168" text-anchor="middle" font-size="12">drop 10%</text>
  <text x="630" y="189" text-anchor="middle" font-size="12">delay 1 to 30 ms</text>
  <text x="630" y="210" text-anchor="middle" font-size="12">duplicate 2%</text>
  <text x="630" y="231" text-anchor="middle" font-size="12">partitions</text>
  <text x="630" y="252" text-anchor="middle" font-size="12">crash, restart</text>
  <line class="fig-line" x1="630" y1="74" x2="630" y2="118" marker-end="url(#19-simulator-arrow)"/>
  <text class="fig-muted" x="638" y="97" font-size="12">chooses</text>
  <line class="fig-line" x1="488" y1="196" x2="558" y2="196" marker-end="url(#19-simulator-arrow)"/>
  <text class="fig-muted" x="523" y="188" text-anchor="middle" font-size="12">send</text>
  <path class="fig-line" d="M630 270 L630 308 L140 308 L140 272" marker-end="url(#19-simulator-arrow)"/>
  <text class="fig-muted" x="385" y="300" text-anchor="middle" font-size="12">queued with a delivery time</text>
</svg>
