  <rect class="fig-box" x="600" y="132" width="96" height="56" rx="6"/>
  <text x="648.0" y="158.0" text-anchor="middle" font-size="14" font-weight="600">jump</text>
  <text class="fig-muted" x="648.0" y="175.0" text-anchor="middle" font-size="12">j bits 2-0</text>
  <line class="fig-line" x1="648" y1="132" x2="648" y2="90" marker-end="url(#03-cpu-datapath-arrow)"/>
  <text class="fig-muted" x="654" y="116" font-size="11">load</text>
  <rect class="fig-box" x="600" y="36" width="96" height="52" rx="6"/>
  <text x="648.0" y="60.0" text-anchor="middle" font-size="14" font-weight="600">PC</text>
  <text class="fig-muted" x="648.0" y="77.0" text-anchor="middle" font-size="12">next address</text>
</svg>
