<svg viewBox="0 0 720 330" role="img" aria-label="The graph of h = log(z) + exp(z) with z = x * y at x = 2, y = 3. Each box holds the value from the forward pass. The accent numbers under the boxes are the derivatives of h that the backward pass leaves on each node.">
  <defs>
    <marker id="22-graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="30" width="132" height="52" rx="6"/>
  <text x="86.0" y="52" text-anchor="middle" font-size="13" font-weight="600">x</text>
  <text class="fig-mono" x="86.0" y="71" text-anchor="middle" font-size="13">2</text>
  <rect class="fig-box" x="20" y="210" width="132" height="52" rx="6"/>
  <text x="86.0" y="232" text-anchor="middle" font-size="13" font-weight="600">y</text>
  <text class="fig-mono" x="86.0" y="251" text-anchor="middle" font-size="13">3</text>
  <rect class="fig-accent" x="200" y="120" width="132" height="52" rx="6"/>
  <text x="266.0" y="142" text-anchor="middle" font-size="13" font-weight="600">z = x * y</text>
  <text class="fig-mono" x="266.0" y="161" text-anchor="middle" font-size="13">6</text>
  <rect class="fig-box" x="384" y="30" width="132" height="52" rx="6"/>
  <text x="450.0" y="52" text-anchor="middle" font-size="13" font-weight="600">log z</text>
  <text class="fig-mono" x="450.0" y="71" text-anchor="middle" font-size="13">1.79</text>
  <rect class="fig-box" x="384" y="210" width="132" height="52" rx="6"/>
  <text x="450.0" y="232" text-anchor="middle" font-size="13" font-weight="600">exp z</text>
  <text class="fig-mono" x="450.0" y="251" text-anchor="middle" font-size="13">403.43</text>
  <rect class="fig-box" x="568" y="120" width="132" height="52" rx="6"/>
  <text x="634.0" y="142" text-anchor="middle" font-size="13" font-weight="600">h = log + exp</text>
  <text class="fig-mono" x="634.0" y="161" text-anchor="middle" font-size="13">405.22</text>
  <line class="fig-line" x1="152" y1="56.0" x2="198" y2="146.0" marker-end="url(#22-graph-arrow)"/>
  <line class="fig-line" x1="152" y1="236.0" x2="198" y2="146.0" marker-end="url(#22-graph-arrow)"/>
  <line class="fig-line" x1="332" y1="146.0" x2="382" y2="56.0" marker-end="url(#22-graph-arrow)"/>
  <line class="fig-line" x1="332" y1="146.0" x2="382" y2="236.0" marker-end="url(#22-graph-arrow)"/>
  <line class="fig-line" x1="516" y1="56.0" x2="566" y2="146.0" marker-end="url(#22-graph-arrow)"/>
  <line class="fig-line" x1="516" y1="236.0" x2="566" y2="146.0" marker-end="url(#22-graph-arrow)"/>
  <text class="fig-accent-text fig-mono" x="86.0" y="100" text-anchor="middle" font-size="12">d = 3 * 403.60</text>
  <text class="fig-accent-text fig-mono" x="86.0" y="116" text-anchor="middle" font-size="12">= 1210.79</text>
  <text class="fig-accent-text fig-mono" x="86.0" y="280" text-anchor="middle" font-size="12">d = 2 * 403.60</text>
  <text class="fig-accent-text fig-mono" x="86.0" y="296" text-anchor="middle" font-size="12">= 807.19</text>
  <text class="fig-accent-text fig-mono" x="266.0" y="190" text-anchor="middle" font-size="12">d = 1/z + exp z</text>
  <text class="fig-accent-text fig-mono" x="266.0" y="206" text-anchor="middle" font-size="12">= 403.60</text>
  <text class="fig-accent-text fig-mono" x="450.0" y="100" text-anchor="middle" font-size="12">d = 1</text>
  <text class="fig-accent-text fig-mono" x="450.0" y="280" text-anchor="middle" font-size="12">d = 1</text>
  <text class="fig-accent-text fig-mono" x="634.0" y="190" text-anchor="middle" font-size="12">d = 1</text>
  <text class="fig-muted" x="360" y="316" text-anchor="middle" font-size="12" xml:space="preserve">forward: values flow left to right.   backward: derivatives flow right to left.</text>
</svg>
