<svg viewBox="0 0 720 290" role="img" aria-label="A move copies the three-word String header from a to b and leaves one heap buffer, with a unusable. A clone copies the header and the heap bytes, so a and b each own a buffer.">
  <defs>
    <marker id="10-move-clone-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="185" y="34" text-anchor="middle" font-size="14" font-weight="600" class="fig-mono">let b = a;</text>
  <text x="185" y="54" text-anchor="middle" font-size="12" class="fig-muted">a move</text>
  <text x="545" y="34" text-anchor="middle" font-size="14" font-weight="600" class="fig-mono">let b = a.clone();</text>
  <text x="545" y="54" text-anchor="middle" font-size="12" class="fig-muted">a clone</text>
  <line class="fig-line" x1="360" y1="24" x2="360" y2="270" stroke-dasharray="4 4"/>

  <text x="110" y="76" text-anchor="middle" font-size="12" class="fig-muted">stack</text>
  <text x="290" y="76" text-anchor="middle" font-size="12" class="fig-muted">heap</text>
  <text x="470" y="76" text-anchor="middle" font-size="12" class="fig-muted">stack</text>
  <text x="650" y="76" text-anchor="middle" font-size="12" class="fig-muted">heap</text>

  <!-- left: a, moved -->
  <text x="34" y="118" font-size="14" class="fig-mono fig-muted">a</text>
  <rect class="fig-box" x="50" y="96" width="44" height="34" rx="6" stroke-dasharray="4 3"/>
  <rect class="fig-box" x="94" y="96" width="44" height="34" rx="6" stroke-dasharray="4 3"/>
  <rect class="fig-box" x="138" y="96" width="44" height="34" rx="6" stroke-dasharray="4 3"/>
  <text x="72" y="118" text-anchor="middle" font-size="12" class="fig-muted fig-mono">ptr</text>
  <text x="116" y="118" text-anchor="middle" font-size="12" class="fig-muted fig-mono">len 2</text>
  <text x="160" y="118" text-anchor="middle" font-size="12" class="fig-muted fig-mono">cap 2</text>
  <text x="116" y="150" text-anchor="middle" font-size="12" class="fig-muted">moved out: unusable</text>

  <!-- left: b -->
  <text x="34" y="208" font-size="14" class="fig-mono">b</text>
  <rect class="fig-accent" x="50" y="186" width="44" height="34" rx="6"/>
  <rect class="fig-accent" x="94" y="186" width="44" height="34" rx="6"/>
  <rect class="fig-accent" x="138" y="186" width="44" height="34" rx="6"/>
  <text x="72" y="208" text-anchor="middle" font-size="12" class="fig-mono">ptr</text>
  <text x="116" y="208" text-anchor="middle" font-size="12" class="fig-mono">len 2</text>
  <text x="160" y="208" text-anchor="middle" font-size="12" class="fig-mono">cap 2</text>
  <text x="116" y="250" text-anchor="middle" font-size="12" class="fig-muted">owner: frees the buffer</text>

  <!-- left heap -->
  <rect class="fig-box" x="250" y="141" width="40" height="34" rx="6"/>
  <rect class="fig-box" x="290" y="141" width="40" height="34" rx="6"/>
  <text x="270" y="163" text-anchor="middle" font-size="13" class="fig-mono">h</text>
  <text x="310" y="163" text-anchor="middle" font-size="13" class="fig-mono">i</text>
  <path class="fig-accent-line" d="M72 220 L72 228 L230 228 L230 158 L247 158" fill="none" marker-end="url(#10-move-clone-arrow)"/>

  <!-- right: a -->
  <text x="394" y="118" font-size="14" class="fig-mono">a</text>
  <rect class="fig-box" x="410" y="96" width="44" height="34" rx="6"/>
  <rect class="fig-box" x="454" y="96" width="44" height="34" rx="6"/>
  <rect class="fig-box" x="498" y="96" width="44" height="34" rx="6"/>
  <text x="432" y="118" text-anchor="middle" font-size="12" class="fig-mono">ptr</text>
  <text x="476" y="118" text-anchor="middle" font-size="12" class="fig-mono">len 2</text>
  <text x="520" y="118" text-anchor="middle" font-size="12" class="fig-mono">cap 2</text>

  <!-- right: b -->
  <text x="394" y="208" font-size="14" class="fig-mono">b</text>
  <rect class="fig-accent" x="410" y="186" width="44" height="34" rx="6"/>
  <rect class="fig-accent" x="454" y="186" width="44" height="34" rx="6"/>
  <rect class="fig-accent" x="498" y="186" width="44" height="34" rx="6"/>
  <text x="432" y="208" text-anchor="middle" font-size="12" class="fig-mono">ptr</text>
  <text x="476" y="208" text-anchor="middle" font-size="12" class="fig-mono">len 2</text>
  <text x="520" y="208" text-anchor="middle" font-size="12" class="fig-mono">cap 2</text>

  <!-- right heap: two buffers -->
  <rect class="fig-box" x="610" y="96" width="40" height="34" rx="6"/>
  <rect class="fig-box" x="650" y="96" width="40" height="34" rx="6"/>
  <text x="630" y="118" text-anchor="middle" font-size="13" class="fig-mono">h</text>
  <text x="670" y="118" text-anchor="middle" font-size="13" class="fig-mono">i</text>
  <rect class="fig-accent" x="610" y="186" width="40" height="34" rx="6"/>
  <rect class="fig-accent" x="650" y="186" width="40" height="34" rx="6"/>
  <text x="630" y="208" text-anchor="middle" font-size="13" class="fig-mono">h</text>
  <text x="670" y="208" text-anchor="middle" font-size="13" class="fig-mono">i</text>
  <path class="fig-line" d="M432 96 L432 88 L590 88 L590 113 L607 113" fill="none" marker-end="url(#10-move-clone-arrow)"/>
  <path class="fig-accent-line" d="M432 220 L432 236 L590 236 L590 203 L607 203" fill="none" marker-end="url(#10-move-clone-arrow)"/>
  <text x="650" y="160" text-anchor="middle" font-size="12" class="fig-muted">bytes copied</text>
  <text x="545" y="266" text-anchor="middle" font-size="12" class="fig-muted">two owners, two buffers, two frees</text>
</svg>
