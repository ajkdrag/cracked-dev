<svg viewBox="0 0 720 290" role="img" aria-label="One process with two threads. Code, globals, the heap and the file descriptors are shared, and each thread has its own registers and its own stack.">
  <defs>
    <marker id="09-threads-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="680" height="250" rx="6"/>
  <text x="36" y="44" font-size="13" font-weight="600">one process</text>
  <text class="fig-muted" x="684" y="44" text-anchor="end" font-size="12">shared by both threads</text>
  <rect class="fig-accent" x="40" y="60" width="145" height="52" rx="6"/>
  <text x="112.5" y="83.0" text-anchor="middle" font-size="13" font-weight="600">code</text>
  <text class="fig-muted" x="112.5" y="100.0" text-anchor="middle" font-size="12">instructions</text>
  <rect class="fig-accent" x="205" y="60" width="145" height="52" rx="6"/>
  <text x="277.5" y="83.0" text-anchor="middle" font-size="13" font-weight="600">globals</text>
  <text class="fig-muted" x="277.5" y="100.0" text-anchor="middle" font-size="12">counter</text>
  <rect class="fig-accent" x="370" y="60" width="145" height="52" rx="6"/>
  <text x="442.5" y="83.0" text-anchor="middle" font-size="13" font-weight="600">heap</text>
  <text class="fig-muted" x="442.5" y="100.0" text-anchor="middle" font-size="12">malloc blocks</text>
  <rect class="fig-accent" x="535" y="60" width="145" height="52" rx="6"/>
  <text x="607.5" y="83.0" text-anchor="middle" font-size="13" font-weight="600">file descriptors</text>
  <text class="fig-muted" x="607.5" y="100.0" text-anchor="middle" font-size="12">0, 1, 2, sockets</text>
  <rect class="fig-box" x="40" y="160" width="300" height="94" rx="6"/>
  <text x="56" y="182" font-size="13" font-weight="600">thread 1</text>
  <rect class="fig-box" x="56" y="192" width="128" height="50" rx="6"/>
  <text x="120.0" y="214.0" text-anchor="middle" font-size="13" font-weight="600">registers</text>
  <text class="fig-muted" x="120.0" y="231.0" text-anchor="middle" font-size="12">rip, rsp, rax ...</text>
  <rect class="fig-box" x="196" y="192" width="128" height="50" rx="6"/>
  <text x="260.0" y="214.0" text-anchor="middle" font-size="13" font-weight="600">stack</text>
  <text class="fig-muted" x="260.0" y="231.0" text-anchor="middle" font-size="12">locals, calls</text>
  <line class="fig-line" x1="190" y1="158" x2="190" y2="116" marker-end="url(#09-threads-arrow)"/>
  <text class="fig-muted" x="198" y="142" font-size="12">reads and writes</text>
  <rect class="fig-box" x="380" y="160" width="300" height="94" rx="6"/>
  <text x="396" y="182" font-size="13" font-weight="600">thread 2</text>
  <rect class="fig-box" x="396" y="192" width="128" height="50" rx="6"/>
  <text x="460.0" y="214.0" text-anchor="middle" font-size="13" font-weight="600">registers</text>
  <text class="fig-muted" x="460.0" y="231.0" text-anchor="middle" font-size="12">rip, rsp, rax ...</text>
  <rect class="fig-box" x="536" y="192" width="128" height="50" rx="6"/>
  <text x="600.0" y="214.0" text-anchor="middle" font-size="13" font-weight="600">stack</text>
  <text class="fig-muted" x="600.0" y="231.0" text-anchor="middle" font-size="12">locals, calls</text>
  <line class="fig-line" x1="530" y1="158" x2="530" y2="116" marker-end="url(#09-threads-arrow)"/>
  <text class="fig-muted" x="538" y="142" font-size="12">reads and writes</text>
</svg>
