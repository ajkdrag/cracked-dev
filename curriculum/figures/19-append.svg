<svg viewBox="0 0 720 320" role="img" aria-label="The leader sends entry 3 with the index and term of the entry before it. The follower finds its entry 2 has term 1, as the message says, so it appends entry 3 and replies with success.">
  <defs>
    <marker id="19-append-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="215" y="46" text-anchor="middle" font-size="12">index 1</text>
  <text class="fig-muted" x="315" y="46" text-anchor="middle" font-size="12">index 2</text>
  <text class="fig-muted" x="415" y="46" text-anchor="middle" font-size="12">index 3</text>
  <text x="40" y="88" font-size="14" font-weight="600">leader</text>
  <text x="40" y="248" font-size="14" font-weight="600">follower</text>
  <rect class="fig-box" x="170" y="60" width="90" height="46" rx="6"/>
  <text class="fig-muted" x="215" y="78" text-anchor="middle" font-size="12">term 1</text>
  <text class="fig-mono" x="215" y="96" text-anchor="middle" font-size="12">put a 1</text>
  <rect class="fig-box" x="270" y="60" width="90" height="46" rx="6"/>
  <text class="fig-muted" x="315" y="78" text-anchor="middle" font-size="12">term 1</text>
  <text class="fig-mono" x="315" y="96" text-anchor="middle" font-size="12">put b 2</text>
  <rect class="fig-accent" x="370" y="60" width="90" height="46" rx="6"/>
  <text class="fig-muted" x="415" y="78" text-anchor="middle" font-size="12">term 2</text>
  <text class="fig-mono" x="415" y="96" text-anchor="middle" font-size="12">put c 3</text>
  <rect class="fig-box" x="170" y="220" width="90" height="46" rx="6"/>
  <text class="fig-muted" x="215" y="238" text-anchor="middle" font-size="12">term 1</text>
  <text class="fig-mono" x="215" y="256" text-anchor="middle" font-size="12">put a 1</text>
  <rect class="fig-accent" x="270" y="220" width="90" height="46" rx="6"/>
  <text class="fig-muted" x="315" y="238" text-anchor="middle" font-size="12">term 1</text>
  <text class="fig-mono" x="315" y="256" text-anchor="middle" font-size="12">put b 2</text>
  <rect class="fig-box" x="370" y="220" width="90" height="46" rx="6" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="415" y="238" text-anchor="middle" font-size="12">term 2</text>
  <text class="fig-mono" x="415" y="256" text-anchor="middle" font-size="12">put c 3</text>
  <rect class="fig-box" x="500" y="60" width="200" height="118" rx="6"/>
  <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="600">AppendEntries</text>
  <text class="fig-mono" x="516" y="104" font-size="12">term 2</text>
  <text class="fig-mono" x="516" y="120" font-size="12">prevIndex 2</text>
  <text class="fig-mono" x="516" y="136" font-size="12">prevTerm 1</text>
  <text class="fig-mono" x="516" y="152" font-size="12">entries: entry 3</text>
  <text class="fig-mono" x="516" y="168" font-size="12">leaderCommit 2</text>
  <line class="fig-line" x1="460" y1="83" x2="498" y2="83" marker-end="url(#19-append-arrow)"/>
  <text class="fig-muted" x="479" y="74" text-anchor="middle" font-size="12">1</text>
  <path class="fig-line" d="M600 178 L600 243 L462 243" marker-end="url(#19-append-arrow)"/>
  <text class="fig-muted" x="612" y="214" font-size="12">2 check</text>
  <line class="fig-line" x1="415" y1="218" x2="415" y2="108" marker-end="url(#19-append-arrow)" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="408" y="160" text-anchor="end" font-size="12">3 success,</text>
  <text class="fig-muted" x="408" y="175" text-anchor="end" font-size="12">match 3</text>
  <text class="fig-muted" x="315" y="292" text-anchor="middle" font-size="12">Follower&#x27;s entry 2 has term 1, equal to prevTerm,</text>
  <text class="fig-muted" x="315" y="308" text-anchor="middle" font-size="12">so its log matches up to 2 and entry 3 is appended.</text>
</svg>
