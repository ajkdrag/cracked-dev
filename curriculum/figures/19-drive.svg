<svg viewBox="0 0 720 200" role="img" aria-label="After every input the driver first makes the new term, vote and log entries durable, then sends the messages the core produced, then applies newly committed entries to the store and answers clients.">
  <defs>
    <marker id="19-drive-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="40" y="40" width="110" height="70" rx="6"/>
  <text x="95" y="68" text-anchor="middle" font-size="13" font-weight="600">input</text>
  <text class="fig-muted" x="95" y="88" text-anchor="middle" font-size="12">message or tick</text>
  <rect class="fig-accent" x="190" y="40" width="120" height="70" rx="6"/>
  <text x="250" y="68" text-anchor="middle" font-size="13" font-weight="600">Raft core</text>
  <text class="fig-muted" x="250" y="88" text-anchor="middle" font-size="12">no I/O inside</text>
  <line class="fig-line" x1="150" y1="75" x2="188" y2="75" marker-end="url(#19-drive-arrow)"/>
  <line class="fig-line" x1="310" y1="75" x2="348" y2="75" marker-end="url(#19-drive-arrow)"/>
  <rect class="fig-box" x="350" y="40" width="100" height="70" rx="6"/>
  <text x="400" y="64" text-anchor="middle" font-size="13" font-weight="600">1 persist</text>
  <text class="fig-muted" x="400" y="84" text-anchor="middle" font-size="12">fsync term,</text>
  <text class="fig-muted" x="400" y="99" text-anchor="middle" font-size="12">vote, log</text>
  <text class="fig-muted" x="400" y="140" text-anchor="middle" font-size="12">durable before</text>
  <text class="fig-muted" x="400" y="156" text-anchor="middle" font-size="12">anyone hears</text>
  <line class="fig-line" x1="450" y1="75" x2="468" y2="75" marker-end="url(#19-drive-arrow)"/>
  <rect class="fig-box" x="470" y="40" width="100" height="70" rx="6"/>
  <text x="520" y="64" text-anchor="middle" font-size="13" font-weight="600">2 send</text>
  <text class="fig-muted" x="520" y="84" text-anchor="middle" font-size="12">messages</text>
  <text class="fig-muted" x="520" y="99" text-anchor="middle" font-size="12">to peers</text>
  <text class="fig-muted" x="520" y="140" text-anchor="middle" font-size="12">peers may</text>
  <text class="fig-muted" x="520" y="156" text-anchor="middle" font-size="12">now rely on it</text>
  <line class="fig-line" x1="570" y1="75" x2="588" y2="75" marker-end="url(#19-drive-arrow)"/>
  <rect class="fig-box" x="590" y="40" width="100" height="70" rx="6"/>
  <text x="640" y="64" text-anchor="middle" font-size="13" font-weight="600">3 apply</text>
  <text class="fig-muted" x="640" y="84" text-anchor="middle" font-size="12">committed</text>
  <text class="fig-muted" x="640" y="99" text-anchor="middle" font-size="12">entries</text>
  <text class="fig-muted" x="640" y="140" text-anchor="middle" font-size="12">then answer</text>
  <text class="fig-muted" x="640" y="156" text-anchor="middle" font-size="12">the clients</text>
</svg>
