  <line class="fig-accent-line" x1="130" y1="202" x2="562" y2="202" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text class="fig-accent-text" x="572" y="200" font-size="12">__syncthreads():</text>
  <text class="fig-accent-text" x="572" y="216" font-size="12">waits for all stores</text>
  <path class="fig-accent-line" d="M 373.0 160 C 373.0 230, 319.0 210, 319.0 261" fill="none" marker-end="url(#21-shared-barrier-arrow)"/>
  <text class="fig-muted" x="572" y="256" font-size="12">2. then thread 3</text>
