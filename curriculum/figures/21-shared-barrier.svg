<svg viewBox="0 0 720 330" role="img" aria-label="Each of the block's eight threads loads one element from global memory into shared memory. __syncthreads() waits until all eight stores are done. Only after it does thread 3 read s[4], which thread 4 wrote.">
  <defs>
    <marker id="21-shared-barrier-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="52" font-size="12">global memory</text>
  <text class="fig-muted" x="20" y="148" font-size="12">shared memory</text>
  <text class="fig-muted" x="20" y="164" font-size="12">of the block</text>
  <text class="fig-muted" x="20" y="282" font-size="12">threads</text>
  <rect class="fig-box" x="134" y="32" width="46" height="30" rx="4"/>
  <text class="fig-mono" x="157.0" y="52" text-anchor="middle" font-size="12">x[0]</text>
