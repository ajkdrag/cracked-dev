<svg viewBox="0 0 720 320" role="img" aria-label="Triangle a, b, c with vertex a on the wrong side of the near plane. Clipping keeps b and c, adds the two points where the edges cross the plane, and gives a polygon of four vertices, in the order new 1, b, c, new 2. It is drawn as two triangles fanned from new 1, the first vertex the clipper emits.">
  <defs>
    <marker id="13-near-clip-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="30" width="160" height="250" rx="0"/>
  <text class="fig-muted" x="100" y="52" text-anchor="middle" font-size="12">d &lt; 0: cut away</text>
  <line class="fig-accent-line" x1="180" y1="30" x2="180" y2="280" stroke-width="1.5"/>
  <text class="fig-accent-text" x="180" y="300" text-anchor="middle" font-size="12">near plane, d = z + w = 0</text>
  <polygon class="fig-line" points="70.0,190.0 390.0,70.0 350.0,270.0" stroke-dasharray="5 4"/>
  <polygon class="fig-accent" points="390.0,70.0 350.0,270.0 180.0,221.4 180.0,148.8"/>
  <line class="fig-line" x1="180" y1="148.75" x2="350" y2="270" stroke-dasharray="4 3"/>
  <circle class="fig-accent-fill" cx="70" cy="190" r="4"/>
  <text class="fig-mono" x="58" y="194" text-anchor="middle" font-size="13">a</text>
  <circle class="fig-accent-fill" cx="390" cy="70" r="4"/>
  <text class="fig-mono" x="402" y="74" text-anchor="middle" font-size="13">b</text>
  <circle class="fig-accent-fill" cx="350" cy="270" r="4"/>
  <text class="fig-mono" x="362" y="274" text-anchor="middle" font-size="13">c</text>
  <circle class="fig-box" cx="180" cy="148.75" r="4"/>
  <text class="fig-mono" x="170" y="138.75" text-anchor="end" font-size="12">new 1</text>
  <circle class="fig-box" cx="180" cy="221.429" r="4"/>
  <text class="fig-mono" x="170" y="241.429" text-anchor="end" font-size="12">new 2</text>
  <text x="450" y="70" text-anchor="start" font-size="13" font-weight="600">each vertex has a distance d</text>
  <text class="fig-muted" x="450" y="92" text-anchor="start" font-size="12">inside when d &gt;= 0</text>
  <text x="450" y="128" text-anchor="start" font-size="13" font-weight="600">a crossing point:</text>
  <text class="fig-mono" x="450" y="150" text-anchor="start" font-size="12">t = d_in / (d_in - d_out)</text>
  <text class="fig-mono" x="450" y="170" text-anchor="start" font-size="12">P = in + t * (out - in)</text>
  <text x="450" y="206" text-anchor="start" font-size="13" font-weight="600">one vertex out: 4 vertices</text>
  <text x="450" y="228" text-anchor="start" font-size="13" font-weight="600">two vertices out: 3 vertices</text>
  <text class="fig-muted" x="450" y="256" text-anchor="start" font-size="12">fan from new 1: (new 1, b, c),</text>
  <text class="fig-muted" x="450" y="274" text-anchor="start" font-size="12">(new 1, c, new 2)</text>
</svg>
