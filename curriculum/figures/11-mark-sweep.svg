  <line class="fig-line" x1="140" y1="170" x2="198" y2="215" marker-end="url(#11-mark-sweep-arrow)"/>
  <line class="fig-line" x1="280" y1="72" x2="338" y2="72" marker-end="url(#11-mark-sweep-arrow)"/>
  <line class="fig-line" x1="420" y1="245" x2="478" y2="245" marker-end="url(#11-mark-sweep-arrow)"/>
  <line class="fig-line" x1="480" y1="262" x2="422" y2="262" marker-end="url(#11-mark-sweep-arrow)"/>
  <rect class="fig-box" x="480" y="40" width="220" height="100" rx="6"/>
  <text x="590" y="62" text-anchor="middle" font-size="13" font-weight="600">gray worklist</text>
