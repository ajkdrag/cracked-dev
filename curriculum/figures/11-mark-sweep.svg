<svg viewBox="0 0 720 330" role="img" aria-label="Marking in progress. The roots reach A and B. A is black: marked and traced. B and C are gray: marked and waiting on the worklist. D and E point at each other, but nothing reachable points at them, so they stay white and the sweep frees them.">
