    <marker id="11-mark-sweep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="120" width="120" height="70" rx="6"/>
  <text x="80" y="148" text-anchor="middle" font-size="13" font-weight="600">roots</text>
