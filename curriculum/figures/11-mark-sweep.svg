  <rect class="fig-box" x="340" y="230" width="80" height="44" rx="6" stroke-dasharray="4 3"/>
  <text x="380" y="257" text-anchor="middle" font-size="14" font-weight="600">D</text>
  <text class="fig-muted" x="380" y="292" text-anchor="middle" font-size="12">white</text>
  <rect class="fig-box" x="480" y="230" width="80" height="44" rx="6" stroke-dasharray="4 3"/>
