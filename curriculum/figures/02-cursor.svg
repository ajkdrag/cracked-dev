<svg viewBox="0 0 720 366" role="img" aria-label="To remove the node holding 7, cur holds the address of the next field that points at it. Writing through cur relinks node 3 to node 9, and the removed node is freed">
  <defs>
    <marker id="02-cursor-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="13" font-weight="600">Before: cur holds the address of the pointer to the node holding 7</text>
  <rect class="fig-box" x="20" y="54" width="80" height="44" rx="6"/>
  <text class="fig-mono" x="60" y="81" text-anchor="middle" font-size="14">head</text>
  <line class="fig-line" x1="100" y1="76" x2="148" y2="76" marker-end="url(#02-cursor-arrow)"/>
  <rect class="fig-accent" x="150" y="54" width="150" height="44"/>
  <line class="fig-line" x1="200" y1="54" x2="200" y2="98"/>
  <text class="fig-mono" x="175" y="81" text-anchor="middle" font-size="14">3</text>
  <circle class="fig-accent-fill" cx="250" cy="76" r="4"/>
  <line class="fig-line" x1="250" y1="76" x2="338" y2="76" marker-end="url(#02-cursor-arrow)"/>
  <rect class="fig-box" x="340" y="54" width="150" height="44"/>
  <line class="fig-line" x1="390" y1="54" x2="390" y2="98"/>
  <text class="fig-mono" x="365" y="81" text-anchor="middle" font-size="14">7</text>
  <circle class="fig-accent-fill" cx="440" cy="76" r="4"/>
  <line class="fig-line" x1="440" y1="76" x2="528" y2="76" marker-end="url(#02-cursor-arrow)"/>
  <rect class="fig-box" x="530" y="54" width="150" height="44"/>
  <line class="fig-line" x1="580" y1="54" x2="580" y2="98"/>
  <text class="fig-mono" x="555" y="81" text-anchor="middle" font-size="14">9</text>
  <text class="fig-mono fig-muted" x="630" y="81" text-anchor="middle" font-size="13">NULL</text>
  <rect class="fig-box" x="185" y="134" width="130" height="36" rx="6"/>
  <text class="fig-mono" x="250" y="157" text-anchor="middle" font-size="13">Node **cur</text>
  <line class="fig-accent-line" x1="250" y1="134" x2="250" y2="100" marker-end="url(#02-cursor-arrow)"/>
  <text class="fig-muted" x="331" y="157" font-size="12">holds the address of this next field</text>
  <text x="20" y="214" font-size="13" font-weight="600">After: <tspan class="fig-mono">*cur = dead-&gt;next;</tspan> then <tspan class="fig-mono">free(dead);</tspan></text>
  <rect class="fig-box" x="20" y="234" width="80" height="44" rx="6"/>
  <text class="fig-mono" x="60" y="261" text-anchor="middle" font-size="14">head</text>
  <line class="fig-line" x1="100" y1="256" x2="148" y2="256" marker-end="url(#02-cursor-arrow)"/>
  <rect class="fig-accent" x="150" y="234" width="150" height="44"/>
  <line class="fig-line" x1="200" y1="234" x2="200" y2="278"/>
  <text class="fig-mono" x="175" y="261" text-anchor="middle" font-size="14">3</text>
  <rect class="fig-box" x="340" y="234" width="150" height="44" stroke-dasharray="4 3"/>
  <line class="fig-line" x1="390" y1="234" x2="390" y2="278" stroke-dasharray="4 3"/>
  <text class="fig-mono fig-muted" x="365" y="261" text-anchor="middle" font-size="14">7</text>
  <text class="fig-mono fig-muted" x="440" y="261" text-anchor="middle" font-size="13">freed</text>
  <rect class="fig-box" x="530" y="234" width="150" height="44"/>
  <line class="fig-line" x1="580" y1="234" x2="580" y2="278"/>
  <text class="fig-mono" x="555" y="261" text-anchor="middle" font-size="14">9</text>
  <text class="fig-mono fig-muted" x="630" y="261" text-anchor="middle" font-size="13">NULL</text>
  <circle class="fig-accent-fill" cx="250" cy="278" r="4"/>
  <path class="fig-accent-line" d="M 250 278 C 270 334, 570 334, 590 282" marker-end="url(#02-cursor-arrow)"/>
  <text class="fig-accent-text" x="415" y="348" text-anchor="middle" font-size="12">the next field now points past the removed node</text>
</svg>
