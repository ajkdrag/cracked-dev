<svg viewBox="0 0 720 270" role="img" aria-label="Two kinds of mapping in the allocator: a chunk of 1 MB holds many blocks between its own prologue and epilogue, and a large request gets a mapping of its own with a 16-byte header, which free hands back with munmap">
<defs><marker id="08-malloc-chunks-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<text x="20" y="34" font-size="13" font-weight="600">a chunk of 1 MB from mmap, shared by many blocks</text>
<rect class="fig-box" x="20" y="50" width="40" height="44" rx="0"/>
<text x="40.0" y="77" text-anchor="middle" font-size="12">pad</text>
<rect class="fig-box" x="60" y="50" width="80" height="44" rx="0"/>
<text x="100.0" y="77" text-anchor="middle" font-size="12">prologue</text>
<rect class="fig-box" x="140" y="50" width="90" height="44" rx="0"/>
<text x="185.0" y="77" text-anchor="middle" font-size="12">block</text>
<rect class="fig-accent" x="230" y="50" width="110" height="44" rx="0"/>
<text x="285.0" y="77" text-anchor="middle" font-size="12">free</text>
<rect class="fig-box" x="340" y="50" width="70" height="44" rx="0"/>
<text x="375.0" y="77" text-anchor="middle" font-size="12">block</text>
<rect class="fig-box" x="410" y="50" width="100" height="44" rx="0"/>
<text x="460.0" y="77" text-anchor="middle" font-size="12">block</text>
<rect class="fig-accent" x="510" y="50" width="110" height="44" rx="0"/>
<text x="565.0" y="77" text-anchor="middle" font-size="12">free</text>
<rect class="fig-box" x="620" y="50" width="80" height="44" rx="0"/>
<text x="660.0" y="77" text-anchor="middle" font-size="12">epilogue</text>
<text class="fig-muted" x="20" y="116" font-size="12">coalescing stops at the prologue and the epilogue, so chunks never merge</text>
<text x="20" y="160" font-size="13" font-weight="600">a request above 256 KB, mapped on its own</text>
<rect class="fig-accent" x="20" y="176" width="110" height="44" rx="0"/>
<text class="fig-mono" x="75" y="203" text-anchor="middle" font-size="12">16-byte header</text>
<rect class="fig-box" x="130" y="176" width="400" height="44" rx="0"/>
<text x="330" y="203" text-anchor="middle" font-size="12">payload, rounded up to whole pages</text>
<line class="fig-line" x1="532" y1="198" x2="578" y2="198" marker-end="url(#08-malloc-chunks-arrow)"/>
<rect class="fig-box" x="580" y="178" width="120" height="40" rx="6"/>
<text class="fig-mono" x="640" y="203" text-anchor="middle" font-size="13">munmap</text>
<text class="fig-muted" x="555" y="190" text-anchor="middle" font-size="12">free</text>
<text class="fig-muted" x="20" y="244" font-size="12">the header records the size of the mapping</text>
</svg>
