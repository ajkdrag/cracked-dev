<svg viewBox="0 0 720 230" role="img" aria-label="clang preprocesses main.c, compiles it to assembly in main.s, assembles that into the object file main.o, and links main.o with the C library into the executable hello">
  <defs>
    <marker id="01-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="60" width="100" height="52" rx="6"/>
  <text class="fig-mono" x="70" y="82" text-anchor="middle" font-size="13">main.c</text>
  <text class="fig-muted" x="70" y="100" text-anchor="middle" font-size="12">C you wrote</text>
  <rect class="fig-box" x="165" y="60" width="100" height="52" rx="6"/>
  <text x="215" y="82" text-anchor="middle" font-size="13">expanded C</text>
  <text class="fig-muted" x="215" y="100" text-anchor="middle" font-size="12">headers in</text>
  <rect class="fig-box" x="310" y="60" width="100" height="52" rx="6"/>
  <text class="fig-mono" x="360" y="82" text-anchor="middle" font-size="13">main.s</text>
  <text class="fig-muted" x="360" y="100" text-anchor="middle" font-size="12">assembly</text>
  <rect class="fig-box" x="455" y="60" width="100" height="52" rx="6"/>
  <text class="fig-mono" x="505" y="82" text-anchor="middle" font-size="13">main.o</text>
  <text class="fig-muted" x="505" y="100" text-anchor="middle" font-size="12">object file</text>
  <rect class="fig-accent" x="600" y="60" width="100" height="52" rx="6"/>
  <text class="fig-mono" x="650" y="82" text-anchor="middle" font-size="13">hello</text>
  <text class="fig-muted" x="650" y="100" text-anchor="middle" font-size="12">executable</text>
  <line class="fig-line" x1="120" y1="86" x2="163" y2="86" marker-end="url(#01-stages-arrow)"/>
  <text class="fig-muted" x="142" y="46" text-anchor="middle" font-size="12">preprocess</text>
  <line class="fig-line" x1="265" y1="86" x2="308" y2="86" marker-end="url(#01-stages-arrow)"/>
  <text class="fig-muted" x="287" y="46" text-anchor="middle" font-size="12">compile</text>
  <line class="fig-line" x1="410" y1="86" x2="453" y2="86" marker-end="url(#01-stages-arrow)"/>
  <text class="fig-muted" x="432" y="46" text-anchor="middle" font-size="12">assemble</text>
  <line class="fig-accent-line" x1="555" y1="86" x2="598" y2="86" marker-end="url(#01-stages-arrow)"/>
  <text class="fig-accent-text" x="577" y="46" text-anchor="middle" font-size="12">link</text>
  <text class="fig-mono fig-muted" x="360" y="132" text-anchor="middle" font-size="12">clang -S</text>
  <text class="fig-mono fig-muted" x="505" y="132" text-anchor="middle" font-size="12">clang -c</text>
  <rect class="fig-box" x="560" y="160" width="140" height="50" rx="6"/>
  <text x="630" y="182" text-anchor="middle" font-size="13">C library</text>
  <text class="fig-muted" x="630" y="200" text-anchor="middle" font-size="12">code of printf</text>
  <line class="fig-accent-line" x1="577" y1="158" x2="577" y2="90" marker-end="url(#01-stages-arrow)"/>
  <text class="fig-accent-text" x="567" y="150" text-anchor="end" font-size="12">joined in</text>
</svg>
