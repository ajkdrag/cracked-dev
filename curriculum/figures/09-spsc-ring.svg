  <text class="fig-muted fig-mono" x="620.0" y="142" text-anchor="middle" font-size="11">14</text>
  <rect class="fig-box" x="640" y="90" width="40" height="36" rx="6"/>
  <text class="fig-muted fig-mono" x="660.0" y="142" text-anchor="middle" font-size="11">15</text>
