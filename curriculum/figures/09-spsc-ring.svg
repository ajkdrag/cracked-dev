  <path class="fig-line" d="M 164 150 L 164 158 L 396 158 L 396 150"/>
  <text class="fig-muted" x="280.0" y="176" text-anchor="middle" font-size="12">consumer owns: items 19 to 24</text>
  <path class="fig-line" d="M 404 150 L 404 158 L 676 158 L 676 150"/>
  <text class="fig-muted" x="540.0" y="176" text-anchor="middle" font-size="12">producer owns: free</text>
  <path class="fig-line" d="M 44 150 L 44 158 L 156 158 L 156 150"/>
  <text class="fig-muted" x="100.0" y="176" text-anchor="middle" font-size="12">producer owns: free</text>
  <rect class="fig-box" x="40" y="214" width="300" height="52" rx="6"/>
  <text x="190.0" y="237.0" text-anchor="middle" font-size="13" font-weight="600">consumer's cache line</text>
  <text class="fig-muted" x="190.0" y="254.0" text-anchor="middle" font-size="12">head, private copy of tail</text>
  <rect class="fig-box" x="380" y="214" width="300" height="52" rx="6"/>
  <text x="530.0" y="237.0" text-anchor="middle" font-size="13" font-weight="600">producer's cache line</text>
  <text class="fig-muted" x="530.0" y="254.0" text-anchor="middle" font-size="12">tail, private copy of head</text>
  <text class="fig-mono" x="40" y="296" font-size="12">push: fill slot tail &amp; 15, then release-store tail + 1</text>
  <text class="fig-mono" x="40" y="316" font-size="12">pop: read slot head &amp; 15, then release-store head + 1</text>
