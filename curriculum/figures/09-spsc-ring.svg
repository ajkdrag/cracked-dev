  <rect class="fig-box" x="400" y="90" width="40" height="36" rx="6"/>
  <text class="fig-muted fig-mono" x="420.0" y="142" text-anchor="middle" font-size="11">9</text>
  <rect class="fig-box" x="440" y="90" width="40" height="36" rx="6"/>
  <text class="fig-muted fig-mono" x="460.0" y="142" text-anchor="middle" font-size="11">10</text>
  <rect class="fig-box" x="480" y="90" width="40" height="36" rx="6"/>
