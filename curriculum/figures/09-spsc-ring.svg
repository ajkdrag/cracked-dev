<svg viewBox="0 0 720 330" role="img" aria-label="A ring of 16 slots with head = 19 and tail = 25, so the items 19 to 24 sit in slots 3 to 8. The consumer owns those slots, and the producer owns the free ones. Each index sits on its own cache line next to a private copy of the other index.">
  <defs>
    <marker id="09-spsc-ring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="180.0" y="46" text-anchor="middle" font-size="13">head = 19</text>
  <text class="fig-muted fig-mono" x="180.0" y="62" text-anchor="middle" font-size="12">19 &amp; 15 = 3</text>
  <line class="fig-line" x1="180.0" y1="66" x2="180.0" y2="88" marker-end="url(#09-spsc-ring-arrow)"/>
  <text class="fig-mono" x="420.0" y="46" text-anchor="middle" font-size="13">tail = 25</text>
  <text class="fig-muted fig-mono" x="420.0" y="62" text-anchor="middle" font-size="12">25 &amp; 15 = 9</text>
  <line class="fig-line" x1="420.0" y1="66" x2="420.0" y2="88" marker-end="url(#09-spsc-ring-arrow)"/>
  <rect class="fig-box" x="40" y="90" width="40" height="36" rx="6"/>
  <text class="fig-muted fig-mono" x="60.0" y="142" text-anchor="middle" font-size="11">0</text>
  <rect class="fig-box" x="80" y="90" width="40" height="36" rx="6"/>
  <text class="fig-muted fig-mono" x="100.0" y="142" text-anchor="middle" font-size="11">1</text>
  <rect class="fig-box" x="120" y="90" width="40" height="36" rx="6"/>
  <text class="fig-muted fig-mono" x="140.0" y="142" text-anchor="middle" font-size="11">2</text>
  <rect class="fig-accent" x="160" y="90" width="40" height="36" rx="6"/>
  <text class="fig-mono" x="180.0" y="113" text-anchor="middle" font-size="13">19</text>
  <text class="fig-muted fig-mono" x="180.0" y="142" text-anchor="middle" font-size="11">3</text>
  <rect class="fig-accent" x="200" y="90" width="40" height="36" rx="6"/>
  <text class="fig-mono" x="220.0" y="113" text-anchor="middle" font-size="13">20</text>
  <text class="fig-muted fig-mono" x="220.0" y="142" text-anchor="middle" font-size="11">4</text>
  <rect class="fig-accent" x="240" y="90" width="40" height="36" rx="6"/>
  <text class="fig-mono" x="260.0" y="113" text-anchor="middle" font-size="13">21</text>
  <text class="fig-muted fig-mono" x="260.0" y="142" text-anchor="middle" font-size="11">5</text>
  <rect class="fig-accent" x="280" y="90" width="40" height="36" rx="6"/>
  <text class="fig-mono" x="300.0" y="113" text-anchor="middle" font-size="13">22</text>
  <text class="fig-muted fig-mono" x="300.0" y="142" text-anchor="middle" font-size="11">6</text>
  <rect class="fig-accent" x="320" y="90" width="40" height="36" rx="6"/>
  <text class="fig-mono" x="340.0" y="113" text-anchor="middle" font-size="13">23</text>
