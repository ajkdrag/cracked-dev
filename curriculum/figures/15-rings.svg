<svg viewBox="0 0 720 370" role="img" aria-label="The user task runs in ring 3 with CS 0x2b and SS 0x23, selectors whose low two bits say 3. On an interrupt or int 0x80 the CPU loads rsp from the TSS&#x27;s RSP0 and pushes the user&#x27;s SS, RSP, RFLAGS, CS and RIP on that kernel stack. iretq pops them and returns to ring 3.">
  <defs>
    <marker id="15-rings-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="680" height="110" rx="6"/>
  <text x="36" y="42" text-anchor="start" font-size="13" font-weight="600">ring 3, user</text>
  <rect class="fig-box" x="160" y="46" width="240" height="64" rx="6"/>
  <text x="280.0" y="65.0" text-anchor="middle" font-size="13" font-weight="600">user code</text>
  <text class="fig-muted" x="280.0" y="83.0" text-anchor="middle" font-size="12">0x1000_0000_0000, CS = 0x2b</text>
  <text class="fig-muted" x="280.0" y="100.0" text-anchor="middle" font-size="12">pages with the U bit</text>
  <rect class="fig-box" x="440" y="46" width="240" height="64" rx="6"/>
  <text x="560.0" y="65.0" text-anchor="middle" font-size="13" font-weight="600">user stack</text>
  <text class="fig-muted" x="560.0" y="83.0" text-anchor="middle" font-size="12">top 0x1000_0002_0000</text>
  <text class="fig-muted" x="560.0" y="100.0" text-anchor="middle" font-size="12">SS = 0x23</text>
  <rect class="fig-box" x="20" y="160" width="680" height="190" rx="6"/>
  <text x="36" y="182" text-anchor="start" font-size="13" font-weight="600">ring 0, kernel</text>
  <rect class="fig-box" x="36" y="196" width="200" height="140" rx="6"/>
  <text x="136" y="214" text-anchor="middle" font-size="13" font-weight="600">GDT</text>
  <rect class="fig-box" x="46" y="222" width="180" height="20" rx="3"/>
  <text class="fig-mono" x="56" y="236" text-anchor="start" font-size="11">0 null</text>
  <rect class="fig-box" x="46" y="244" width="180" height="20" rx="3"/>
  <text class="fig-mono" x="56" y="258" text-anchor="start" font-size="11">1 kernel code  0x08</text>
  <rect class="fig-box" x="46" y="266" width="180" height="20" rx="3"/>
  <text class="fig-mono" x="56" y="280" text-anchor="start" font-size="11">2-3 TSS  0x10</text>
  <rect class="fig-accent" x="46" y="288" width="180" height="20" rx="3"/>
  <text class="fig-mono" x="56" y="302" text-anchor="start" font-size="11">4 user data  0x23</text>
  <rect class="fig-accent" x="46" y="310" width="180" height="20" rx="3"/>
  <text class="fig-mono" x="56" y="324" text-anchor="start" font-size="11">5 user code  0x2b</text>
  <rect class="fig-box" x="270" y="196" width="170" height="80" rx="6"/>
  <text x="355" y="216" text-anchor="middle" font-size="13" font-weight="600">TSS</text>
  <rect class="fig-accent" x="282" y="228" width="146" height="26" rx="3"/>
  <text class="fig-mono" x="355" y="246" text-anchor="middle" font-size="12">RSP0 = stack top</text>
  <rect class="fig-box" x="500" y="196" width="180" height="140" rx="6"/>
  <text x="590" y="214" text-anchor="middle" font-size="13" font-weight="600">kernel stack</text>
  <rect class="fig-box" x="512" y="222" width="156" height="20" rx="0"/>
  <text class="fig-mono" x="590" y="236" text-anchor="middle" font-size="11">SS 0x23</text>
  <rect class="fig-box" x="512" y="244" width="156" height="20" rx="0"/>
  <text class="fig-mono" x="590" y="258" text-anchor="middle" font-size="11">user RSP</text>
  <rect class="fig-box" x="512" y="266" width="156" height="20" rx="0"/>
  <text class="fig-mono" x="590" y="280" text-anchor="middle" font-size="11">RFLAGS</text>
  <rect class="fig-box" x="512" y="288" width="156" height="20" rx="0"/>
  <text class="fig-mono" x="590" y="302" text-anchor="middle" font-size="11">CS 0x2b</text>
  <rect class="fig-box" x="512" y="310" width="156" height="20" rx="0"/>
  <text class="fig-mono" x="590" y="324" text-anchor="middle" font-size="11">RIP</text>
  <line class="fig-line" x1="428" y1="241" x2="510" y2="233" marker-end="url(#15-rings-arrow)"/>
  <text class="fig-muted" x="456" y="296" text-anchor="middle" font-size="12">rsp loaded</text>
  <text class="fig-muted" x="456" y="312" text-anchor="middle" font-size="12">from here</text>
  <line class="fig-line" x1="240" y1="112" x2="300" y2="194" marker-end="url(#15-rings-arrow)"/>
  <text class="fig-mono" x="300" y="150" text-anchor="start" font-size="12">interrupt or int 0x80</text>
  <line class="fig-line" x1="620" y1="194" x2="620" y2="112" marker-end="url(#15-rings-arrow)"/>
  <text class="fig-mono" x="628" y="150" text-anchor="start" font-size="12">iretq</text>
</svg>
