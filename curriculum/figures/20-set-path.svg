    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="40" width="76" height="260" rx="6"/>
  <text x="58" y="160" text-anchor="middle" font-size="13" font-weight="600">socket</text>
  <text class="fig-muted" x="58" y="180" text-anchor="middle" font-size="12">client</text>
  <rect class="fig-box" x="160" y="40" width="140" height="84" rx="6"/>
  <text x="230.0" y="64" text-anchor="middle" font-size="13" font-weight="600">event loop</text>
  <text class="fig-mono" x="230.0" y="84" text-anchor="middle" font-size="12">ae.c</text>
  <text class="fig-mono" x="230.0" y="104" text-anchor="middle" font-size="12">aeProcessEvents</text>
  <rect class="fig-box" x="360" y="40" width="140" height="84" rx="6"/>
  <text x="430.0" y="64" text-anchor="middle" font-size="13" font-weight="600">parser</text>
  <text class="fig-mono" x="430.0" y="84" text-anchor="middle" font-size="12">networking.c</text>
  <text class="fig-mono" x="430.0" y="104" text-anchor="middle" font-size="12">querybuf → argv</text>
  <rect class="fig-box" x="560" y="40" width="140" height="84" rx="6"/>
  <text x="630.0" y="64" text-anchor="middle" font-size="13" font-weight="600">command table</text>
  <text class="fig-mono" x="630.0" y="84" text-anchor="middle" font-size="12">server.c</text>
  <text class="fig-mono" x="630.0" y="104" text-anchor="middle" font-size="12">lookupCommand</text>
