<svg viewBox="0 0 720 320" role="img" aria-label="SET k v arrives on the socket. The event loop sees the descriptor readable, the parser cuts the RESP bytes into arguments, the command table finds setCommand, setKey stores the value and addReply puts +OK in the client&#x27;s reply buffer. Before the loop waits again, beforeSleep calls handleClientsWithPendingWrites, which writes the reply to the socket.">
  <defs>
    <marker id="20-set-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
