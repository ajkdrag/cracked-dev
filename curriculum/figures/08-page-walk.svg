<svg viewBox="0 0 720 330" role="img" aria-label="An Sv39 virtual address splits into L2, L1 and L0 indexes and a 12-bit offset. satp points at the root table, entry L2 points at a middle table, entry L1 at a leaf table, entry L0 at the physical page, and the offset picks the byte">
  <defs>
    <marker id="08-page-walk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="56" font-size="13" font-weight="600">virtual address</text>
  <rect class="fig-accent" x="200" y="34" width="130" height="36" rx="0"/>
  <text class="fig-mono" x="265.0" y="57" text-anchor="middle" font-size="12">L2, 9 bits</text>
  <rect class="fig-accent" x="330" y="34" width="130" height="36" rx="0"/>
  <text class="fig-mono" x="395.0" y="57" text-anchor="middle" font-size="12">L1, 9 bits</text>
  <rect class="fig-accent" x="460" y="34" width="130" height="36" rx="0"/>
  <text class="fig-mono" x="525.0" y="57" text-anchor="middle" font-size="12">L0, 9 bits</text>
  <rect class="fig-box" x="590" y="34" width="110" height="36" rx="0"/>
  <text class="fig-mono" x="645.0" y="57" text-anchor="middle" font-size="12">offset, 12</text>
  <rect class="fig-box" x="20" y="220" width="80" height="36" rx="6"/>
  <text class="fig-mono" x="60.0" y="243.0" text-anchor="middle" font-size="13">satp</text>
  <rect class="fig-box" x="130" y="130" width="110" height="160" rx="6"/>
  <text class="fig-muted" x="185" y="308" text-anchor="middle" font-size="12">root table</text>
  <rect class="fig-accent" x="138" y="160" width="94" height="20" rx="3"/>
  <text class="fig-mono" x="185" y="175" text-anchor="middle" font-size="12">[L2]</text>
  <line class="fig-line" x1="265.0" y1="72" x2="185" y2="158" marker-end="url(#08-page-walk-arrow)"/>
  <rect class="fig-box" x="280" y="130" width="110" height="160" rx="6"/>
  <text class="fig-muted" x="335" y="308" text-anchor="middle" font-size="12">middle table</text>
  <rect class="fig-accent" x="288" y="196" width="94" height="20" rx="3"/>
  <text class="fig-mono" x="335" y="211" text-anchor="middle" font-size="12">[L1]</text>
  <line class="fig-line" x1="395.0" y1="72" x2="335" y2="194" marker-end="url(#08-page-walk-arrow)"/>
  <rect class="fig-box" x="430" y="130" width="110" height="160" rx="6"/>
  <text class="fig-muted" x="485" y="308" text-anchor="middle" font-size="12">leaf table</text>
  <rect class="fig-accent" x="438" y="232" width="94" height="20" rx="3"/>
  <text class="fig-mono" x="485" y="247" text-anchor="middle" font-size="12">[L0]</text>
  <line class="fig-line" x1="525.0" y1="72" x2="485" y2="230" marker-end="url(#08-page-walk-arrow)"/>
  <line class="fig-line" x1="100" y1="238" x2="128" y2="238" marker-end="url(#08-page-walk-arrow)"/>
  <line class="fig-line" x1="232" y1="170" x2="278" y2="170" marker-end="url(#08-page-walk-arrow)"/>
  <line class="fig-line" x1="382" y1="206" x2="428" y2="206" marker-end="url(#08-page-walk-arrow)"/>
  <rect class="fig-box" x="580" y="130" width="120" height="160" rx="6"/>
  <text class="fig-muted" x="640" y="308" text-anchor="middle" font-size="12">physical page</text>
  <rect class="fig-accent" x="588" y="268" width="104" height="16" rx="3"/>
  <text class="fig-mono" x="640" y="281" text-anchor="middle" font-size="12">byte</text>
  <line class="fig-line" x1="532" y1="242" x2="578" y2="242" marker-end="url(#08-page-walk-arrow)"/>
  <line class="fig-line" x1="645" y1="72" x2="645" y2="266" marker-end="url(#08-page-walk-arrow)"/>
</svg>
