<svg viewBox="0 0 720 220" role="img" aria-label="struct Pair puts char a at offset 0, three padding bytes at offsets 1 to 3, and int b at offsets 4 to 7, so its size is 8">
  <text class="fig-mono" x="80" y="36" font-size="14" font-weight="600">struct Pair { char a; int b; };</text>
  <text class="fig-mono fig-muted" x="115" y="72" text-anchor="middle" font-size="11">0</text>
  <text class="fig-mono fig-muted" x="185" y="72" text-anchor="middle" font-size="11">1</text>
  <text class="fig-mono fig-muted" x="255" y="72" text-anchor="middle" font-size="11">2</text>
  <text class="fig-mono fig-muted" x="325" y="72" text-anchor="middle" font-size="11">3</text>
  <text class="fig-mono fig-muted" x="395" y="72" text-anchor="middle" font-size="11">4</text>
  <text class="fig-mono fig-muted" x="465" y="72" text-anchor="middle" font-size="11">5</text>
  <text class="fig-mono fig-muted" x="535" y="72" text-anchor="middle" font-size="11">6</text>
  <text class="fig-mono fig-muted" x="605" y="72" text-anchor="middle" font-size="11">7</text>
  <rect class="fig-accent" x="80" y="80" width="70" height="50"/>
  <text class="fig-mono" x="115" y="111" text-anchor="middle" font-size="14">a</text>
  <rect class="fig-box" x="150" y="80" width="70" height="50" stroke-dasharray="4 3"/>
  <text class="fig-muted" x="185" y="110" text-anchor="middle" font-size="12">padding</text>
  <rect class="fig-box" x="220" y="80" width="70" height="50" stroke-dasharray="4 3"/>
  <text class="fig-muted" x="255" y="110" text-anchor="middle" font-size="12">padding</text>
  <rect class="fig-box" x="290" y="80" width="70" height="50" stroke-dasharray="4 3"/>
  <text class="fig-muted" x="325" y="110" text-anchor="middle" font-size="12">padding</text>
  <rect class="fig-accent" x="360" y="80" width="280" height="50"/>
  <text class="fig-mono" x="500" y="111" text-anchor="middle" font-size="14">b</text>
  <line class="fig-accent-line" x1="430" y1="118" x2="430" y2="130" stroke-dasharray="2 2"/>
  <line class="fig-accent-line" x1="500" y1="118" x2="500" y2="130" stroke-dasharray="2 2"/>
  <line class="fig-accent-line" x1="570" y1="118" x2="570" y2="130" stroke-dasharray="2 2"/>
  <text class="fig-mono" x="80" y="164" font-size="13">offsetof(struct Pair, a) is 0</text>
  <text class="fig-mono" x="360" y="164" font-size="13">offsetof(struct Pair, b) is 4</text>
  <text class="fig-muted" x="80" y="192" font-size="12">sizeof(struct Pair) is 8. The padding bytes keep whatever was in memory before.</text>
</svg>
