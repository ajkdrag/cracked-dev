<svg viewBox="0 0 720 300" role="img" aria-label="The two handlers set bits in the pending word with atomic_fetch_or. main's loop masks interrupts, checks pending and sleeps in wfi only when it is zero, unmasks so that a waiting handler runs, takes all bits at once with atomic_exchange, runs the work for each event and goes around again.">
  <defs>
    <marker id="17-event-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="40" y="24" width="190" height="50" rx="6"/>
  <text class="fig-mono" x="135" y="45" text-anchor="middle" font-size="13">timer0_irq</text>
  <text class="fig-muted" x="135" y="63" text-anchor="middle" font-size="12">every 1 ms</text>
  <rect class="fig-box" x="490" y="24" width="190" height="50" rx="6"/>
  <text class="fig-mono" x="585" y="45" text-anchor="middle" font-size="13">uart0_irq</text>
  <text class="fig-muted" x="585" y="63" text-anchor="middle" font-size="12">bytes arrived</text>

  <rect class="fig-accent" x="290" y="24" width="140" height="50" rx="6"/>
  <text class="fig-mono" x="360" y="45" text-anchor="middle" font-size="13">pending</text>
  <text class="fig-mono" x="360" y="63" text-anchor="middle" font-size="12">EV_RX | EV_TICK</text>
  <line class="fig-line" x1="230" y1="49" x2="288" y2="49" marker-end="url(#17-event-loop-arrow)"/>
  <text class="fig-muted" x="259" y="41" text-anchor="middle" font-size="11">fetch_or</text>
  <line class="fig-line" x1="490" y1="49" x2="432" y2="49" marker-end="url(#17-event-loop-arrow)"/>
  <text class="fig-muted" x="461" y="41" text-anchor="middle" font-size="11">fetch_or</text>

  <rect class="fig-box" x="20" y="140" width="120" height="60" rx="6"/>
  <text class="fig-mono" x="80" y="164" text-anchor="middle" font-size="13">cpsid i</text>
  <text class="fig-muted" x="80" y="184" text-anchor="middle" font-size="12">mask interrupts</text>
  <rect class="fig-accent" x="156" y="140" width="120" height="60" rx="6"/>
  <text class="fig-mono" x="216" y="164" text-anchor="middle" font-size="12">pending == 0?</text>
  <text class="fig-muted" x="216" y="184" text-anchor="middle" font-size="12">then wfi: sleep</text>
  <rect class="fig-box" x="292" y="140" width="120" height="60" rx="6"/>
  <text class="fig-mono" x="352" y="164" text-anchor="middle" font-size="13">cpsie i</text>
  <text class="fig-muted" x="352" y="184" text-anchor="middle" font-size="12">handlers run</text>
  <rect class="fig-accent" x="428" y="140" width="120" height="60" rx="6"/>
  <text class="fig-mono" x="488" y="164" text-anchor="middle" font-size="12">exchange(0)</text>
  <text class="fig-muted" x="488" y="184" text-anchor="middle" font-size="12">take every bit</text>
  <rect class="fig-box" x="564" y="140" width="136" height="60" rx="6"/>
  <text x="632" y="164" text-anchor="middle" font-size="13">run the work</text>
  <text class="fig-muted" x="632" y="184" text-anchor="middle" font-size="12">timers, the ring</text>

  <line class="fig-line" x1="140" y1="170" x2="154" y2="170" marker-end="url(#17-event-loop-arrow)"/>
  <line class="fig-line" x1="276" y1="170" x2="290" y2="170" marker-end="url(#17-event-loop-arrow)"/>
  <line class="fig-line" x1="412" y1="170" x2="426" y2="170" marker-end="url(#17-event-loop-arrow)"/>
  <line class="fig-line" x1="548" y1="170" x2="562" y2="170" marker-end="url(#17-event-loop-arrow)"/>
  <path class="fig-line" d="M632 200 V240 H80 V202" fill="none" marker-end="url(#17-event-loop-arrow)"/>
  <text class="fig-muted" x="356" y="262" text-anchor="middle" font-size="12">no task has its own stack, and each runs to completion</text>

  <path class="fig-accent-line" d="M330 74 L230 138" fill="none" marker-end="url(#17-event-loop-arrow)"/>
  <text class="fig-accent-text" x="262" y="108" text-anchor="end" font-size="12">load</text>
  <path class="fig-accent-line" d="M390 74 L478 138" fill="none" marker-end="url(#17-event-loop-arrow)"/>
  <text class="fig-accent-text" x="448" y="108" font-size="12">take</text>
</svg>
