<svg viewBox="0 0 720 330" role="img" aria-label="A timer interrupt in the shell enters its kernel thread, which calls swtch to the CPU&#x27;s scheduler thread. The scheduler finds cat RUNNABLE and calls swtch into cat&#x27;s kernel thread, which returns to cat in user mode">
  <defs>
    <marker id="08-context-switch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="24" font-size="12">user mode</text>
  <text class="fig-muted" x="20" y="114" font-size="12">kernel</text>
  <rect class="fig-box" x="20" y="34" width="200" height="48" rx="6"/>
  <text x="120.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600">shell</text>
  <text class="fig-muted" x="120.0" y="72.0" text-anchor="middle" font-size="12">running</text>
  <rect class="fig-box" x="500" y="34" width="200" height="48" rx="6"/>
  <text x="600.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600">cat</text>
  <text class="fig-muted" x="600.0" y="72.0" text-anchor="middle" font-size="12">running again</text>
  <rect class="fig-box" x="20" y="124" width="200" height="60" rx="6"/>
  <text x="120.0" y="151.0" text-anchor="middle" font-size="13" font-weight="600">shell's kernel thread</text>
  <text class="fig-muted" x="120.0" y="168.0" text-anchor="middle" font-size="12">usertrap, yield, sched</text>
  <rect class="fig-box" x="500" y="124" width="200" height="60" rx="6"/>
  <text x="600.0" y="151.0" text-anchor="middle" font-size="13" font-weight="600">cat's kernel thread</text>
  <text class="fig-muted" x="600.0" y="168.0" text-anchor="middle" font-size="12">returns from sched</text>
  <rect class="fig-accent" x="260" y="236" width="200" height="60" rx="6"/>
  <text x="360.0" y="263.0" text-anchor="middle" font-size="13" font-weight="600">scheduler thread</text>
  <text class="fig-muted" x="360.0" y="280.0" text-anchor="middle" font-size="12">finds cat RUNNABLE</text>
  <line class="fig-line" x1="120" y1="82" x2="120" y2="122" marker-end="url(#08-context-switch-arrow)"/>
  <text class="fig-muted" x="128" y="106" font-size="12">timer interrupt</text>
  <line class="fig-line" x1="600" y1="122" x2="600" y2="84" marker-end="url(#08-context-switch-arrow)"/>
  <text class="fig-muted" x="592" y="106" text-anchor="end" font-size="12">usertrap returns, sret</text>
  <path class="fig-line" d="M120 184 L120 266 L258 266" marker-end="url(#08-context-switch-arrow)"/>
  <text class="fig-mono" x="128" y="216" font-size="12">swtch saves ra, sp, s0-s11</text>
  <text class="fig-muted" x="128" y="232" font-size="12">into shell's context</text>
  <path class="fig-line" d="M460 266 L600 266 L600 186" marker-end="url(#08-context-switch-arrow)"/>
  <text class="fig-mono" x="592" y="216" text-anchor="end" font-size="12">swtch loads</text>
  <text class="fig-muted" x="592" y="232" text-anchor="end" font-size="12">cat's context</text>
</svg>
