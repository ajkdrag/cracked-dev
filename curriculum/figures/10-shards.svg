<svg viewBox="0 0 720 316" role="img" aria-label="With 96-byte shards, cache lines 1 and 4 each hold the end of one shard and the start of the next. With each shard padded to 128 bytes, every cache line belongs to one shard.">
  <text x="110" y="30" font-size="14" font-weight="600" class="fig-mono">Mutex&lt;Swiss&gt;: 96 bytes</text>
  <text x="110" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">0</text>
  <text x="206" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">64</text>
  <text x="302" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">128</text>
  <text x="398" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">192</text>
  <text x="494" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">256</text>
  <text x="590" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">320</text>
  <text x="686" y="50" text-anchor="middle" font-size="12" class="fig-mono fig-muted">384</text>
  <text x="24" y="75" font-size="12" class="fig-muted">cache lines</text>
  <rect class="fig-box" x="110" y="58" width="96" height="26" rx="6"/>
  <text x="158" y="75" text-anchor="middle" font-size="12" class="fig-muted">line 0</text>
  <rect class="fig-accent" x="206" y="58" width="96" height="26" rx="6"/>
  <text x="254" y="75" text-anchor="middle" font-size="12" class="fig-muted">line 1</text>
  <rect class="fig-box" x="302" y="58" width="96" height="26" rx="6"/>
  <text x="350" y="75" text-anchor="middle" font-size="12" class="fig-muted">line 2</text>
  <rect class="fig-box" x="398" y="58" width="96" height="26" rx="6"/>
  <text x="446" y="75" text-anchor="middle" font-size="12" class="fig-muted">line 3</text>
  <rect class="fig-accent" x="494" y="58" width="96" height="26" rx="6"/>
  <text x="542" y="75" text-anchor="middle" font-size="12" class="fig-muted">line 4</text>
  <rect class="fig-box" x="590" y="58" width="96" height="26" rx="6"/>
  <text x="638" y="75" text-anchor="middle" font-size="12" class="fig-muted">line 5</text>
  <text x="24" y="111" font-size="12" class="fig-muted">shards</text>
  <rect class="fig-box" x="110" y="92" width="144" height="30" rx="6"/>
  <text x="182" y="112" text-anchor="middle" font-size="13">shard 0</text>
  <rect class="fig-box" x="254" y="92" width="144" height="30" rx="6"/>
  <text x="326" y="112" text-anchor="middle" font-size="13">shard 1</text>
  <rect class="fig-box" x="398" y="92" width="144" height="30" rx="6"/>
  <text x="470" y="112" text-anchor="middle" font-size="13">shard 2</text>
  <rect class="fig-box" x="542" y="92" width="144" height="30" rx="6"/>
  <text x="614" y="112" text-anchor="middle" font-size="13">shard 3</text>
  <text x="110" y="144" font-size="12" class="fig-accent-text">lines 1 and 4 each hold two shards, so their locks fight over the line</text>
  <text x="110" y="186" font-size="14" font-weight="600" class="fig-mono">#[repr(align(64))]: 128 bytes</text>
  <text x="110" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">0</text>
  <text x="206" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">64</text>
  <text x="302" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">128</text>
  <text x="398" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">192</text>
  <text x="494" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">256</text>
  <text x="590" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">320</text>
  <text x="686" y="206" text-anchor="middle" font-size="12" class="fig-mono fig-muted">384</text>
  <text x="24" y="231" font-size="12" class="fig-muted">cache lines</text>
  <rect class="fig-box" x="110" y="214" width="96" height="26" rx="6"/>
  <text x="158" y="231" text-anchor="middle" font-size="12" class="fig-muted">line 0</text>
  <rect class="fig-box" x="206" y="214" width="96" height="26" rx="6"/>
  <text x="254" y="231" text-anchor="middle" font-size="12" class="fig-muted">line 1</text>
  <rect class="fig-box" x="302" y="214" width="96" height="26" rx="6"/>
  <text x="350" y="231" text-anchor="middle" font-size="12" class="fig-muted">line 2</text>
  <rect class="fig-box" x="398" y="214" width="96" height="26" rx="6"/>
  <text x="446" y="231" text-anchor="middle" font-size="12" class="fig-muted">line 3</text>
  <rect class="fig-box" x="494" y="214" width="96" height="26" rx="6"/>
  <text x="542" y="231" text-anchor="middle" font-size="12" class="fig-muted">line 4</text>
  <rect class="fig-box" x="590" y="214" width="96" height="26" rx="6"/>
  <text x="638" y="231" text-anchor="middle" font-size="12" class="fig-muted">line 5</text>
  <text x="24" y="267" font-size="12" class="fig-muted">shards</text>
  <rect class="fig-box" x="110" y="248" width="192" height="30" rx="6"/>
  <line class="fig-line" x1="254" y1="252" x2="254" y2="274" stroke-dasharray="3 3"/>
  <text x="182" y="268" text-anchor="middle" font-size="13">shard 0</text>
  <text x="278" y="268" text-anchor="middle" font-size="12" class="fig-muted">pad</text>
  <rect class="fig-box" x="302" y="248" width="192" height="30" rx="6"/>
  <line class="fig-line" x1="446" y1="252" x2="446" y2="274" stroke-dasharray="3 3"/>
  <text x="374" y="268" text-anchor="middle" font-size="13">shard 1</text>
  <text x="470" y="268" text-anchor="middle" font-size="12" class="fig-muted">pad</text>
  <rect class="fig-box" x="494" y="248" width="192" height="30" rx="6"/>
  <line class="fig-line" x1="638" y1="252" x2="638" y2="274" stroke-dasharray="3 3"/>
  <text x="566" y="268" text-anchor="middle" font-size="13">shard 2</text>
  <text x="662" y="268" text-anchor="middle" font-size="12" class="fig-muted">pad</text>
  <text x="110" y="300" font-size="12" class="fig-muted">each line belongs to one shard</text>
</svg>
