<svg viewBox="0 0 720 330" role="img" aria-label="Each worker has a deque. Its owner pushes and pops jobs at the bottom. Worker 1&#x27;s deque is empty, so it steals j6, the oldest job, from the top of worker 2&#x27;s deque and runs it.">
  <defs>
    <marker id="09-work-stealing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="110" y="76" text-anchor="middle" font-size="13" font-weight="600">worker 0</text>
  <rect class="fig-box" x="40" y="90" width="140" height="150" rx="6"/>
  <rect class="fig-box" x="60" y="106" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="110" y="124" text-anchor="middle" font-size="13">j0</text>
  <rect class="fig-box" x="60" y="136" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="110" y="154" text-anchor="middle" font-size="13">j1</text>
  <rect class="fig-box" x="60" y="166" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="110" y="184" text-anchor="middle" font-size="13">j2</text>
  <rect class="fig-box" x="60" y="196" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="110" y="214" text-anchor="middle" font-size="13">j3</text>
  <text class="fig-muted" x="188" y="124" font-size="12">top</text>
  <text class="fig-muted" x="188" y="214" font-size="12">bottom</text>
  <text x="360" y="76" text-anchor="middle" font-size="13" font-weight="600">worker 1</text>
  <rect class="fig-box" x="290" y="90" width="140" height="150" rx="6"/>
  <text class="fig-muted" x="360" y="170" text-anchor="middle" font-size="12">empty</text>
  <text x="610" y="76" text-anchor="middle" font-size="13" font-weight="600">worker 2</text>
  <rect class="fig-box" x="540" y="90" width="140" height="150" rx="6"/>
  <rect class="fig-accent" x="560" y="106" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="610" y="124" text-anchor="middle" font-size="13">j6</text>
  <rect class="fig-box" x="560" y="136" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="610" y="154" text-anchor="middle" font-size="13">j7</text>
  <rect class="fig-box" x="560" y="166" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="610" y="184" text-anchor="middle" font-size="13">j8</text>
  <rect class="fig-box" x="560" y="196" width="100" height="26" rx="6"/>
  <text class="fig-mono" x="610" y="214" text-anchor="middle" font-size="13">j9</text>
  <line class="fig-line" x1="94" y1="290" x2="94" y2="244" marker-end="url(#09-work-stealing-arrow)"/>
  <line class="fig-line" x1="126" y1="244" x2="126" y2="290" marker-end="url(#09-work-stealing-arrow)"/>
  <text class="fig-muted" x="110" y="308" text-anchor="middle" font-size="12">owner pushes, pops</text>
  <line class="fig-line" x1="594" y1="290" x2="594" y2="244" marker-end="url(#09-work-stealing-arrow)"/>
  <line class="fig-line" x1="626" y1="244" x2="626" y2="290" marker-end="url(#09-work-stealing-arrow)"/>
  <text class="fig-muted" x="610" y="308" text-anchor="middle" font-size="12">owner pushes, pops</text>
  <path class="fig-accent-line" d="M 558 119 C 520 30, 420 30, 384 88" marker-end="url(#09-work-stealing-arrow)"/>
  <text class="fig-accent-text" x="470" y="34" text-anchor="middle" font-size="12">steals j6 from the top, runs it</text>
</svg>
