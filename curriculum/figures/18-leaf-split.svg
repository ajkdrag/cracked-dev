<svg viewBox="0 0 720 240" role="img" aria-label="A full leaf with 40, 50, 60 and 70 receives 55. It splits by bytes into a leaf with 40, 50 and 55 and a new leaf with 60 and 70, and the new leaf&#x27;s first key, 60, is copied up into the parent as a separator">
  <defs>
    <marker id="18-leaf-split-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="175" y="28" text-anchor="middle" font-size="13" font-weight="600">before</text>
  <text x="555" y="28" text-anchor="middle" font-size="13" font-weight="600">after</text>
  <rect class="fig-box" x="95" y="42" width="160" height="40" rx="6"/>
  <text class="fig-mono" x="175.0" y="66.55" text-anchor="middle" font-size="13">40  |  80</text>
  <line class="fig-line" x1="175" y1="82" x2="175" y2="138" marker-end="url(#18-leaf-split-arrow)"/>
  <rect class="fig-accent" x="75" y="140" width="200" height="44" rx="6"/>
  <text class="fig-mono" x="175.0" y="166.55" text-anchor="middle" font-size="13">40  50  60  70</text>
  <text class="fig-accent-text" x="175" y="206" text-anchor="middle" font-size="12">full leaf, insert 55</text>
  <line class="fig-line" x1="300" y1="162" x2="368" y2="162" marker-end="url(#18-leaf-split-arrow)"/>
  <text class="fig-muted" x="334" y="152" text-anchor="middle" font-size="12">split</text>
  <rect class="fig-box" x="455" y="42" width="200" height="40" rx="6"/>
  <text class="fig-mono" x="500" y="67" text-anchor="middle" font-size="14">40</text>
  <text class="fig-mono" x="528" y="67" text-anchor="middle" font-size="14">|</text>
  <text class="fig-accent-text" x="555" y="67" text-anchor="middle" font-size="14" font-family="monospace">60</text>
  <text class="fig-mono" x="582" y="67" text-anchor="middle" font-size="14">|</text>
  <text class="fig-mono" x="610" y="67" text-anchor="middle" font-size="14">80</text>
  <line class="fig-line" x1="505" y1="82" x2="470" y2="138" marker-end="url(#18-leaf-split-arrow)"/>
  <line class="fig-line" x1="568" y1="82" x2="628" y2="138" marker-end="url(#18-leaf-split-arrow)"/>
  <rect class="fig-box" x="390" y="140" width="160" height="44" rx="6"/>
  <text class="fig-mono" x="470.0" y="166.55" text-anchor="middle" font-size="13">40  50  55</text>
  <rect class="fig-accent" x="580" y="140" width="120" height="44" rx="6"/>
  <text class="fig-mono" x="640.0" y="166.55" text-anchor="middle" font-size="13">60  70</text>
  <line class="fig-line" x1="550" y1="162" x2="578" y2="162" marker-end="url(#18-leaf-split-arrow)"/>
  <text class="fig-muted" x="470" y="206" text-anchor="middle" font-size="12">old page</text>
  <text class="fig-muted" x="640" y="206" text-anchor="middle" font-size="12">new page</text>
  <text class="fig-accent-text" x="555" y="226" text-anchor="middle" font-size="12">60 is copied up as a separator</text>
</svg>
