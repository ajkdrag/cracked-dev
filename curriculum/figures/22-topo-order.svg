<svg viewBox="0 0 720 300" role="img" aria-label="The backward pass visits the nodes in topological order: h, exp, log, z, y, x. z comes after both exp and log, so it has received both contributions before it passes its derivative on to x and y.">
  <defs>
    <marker id="22-topo-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="120" width="100" height="56" rx="6"/>
  <text x="70.0" y="143" text-anchor="middle" font-size="13" font-weight="600">1. h</text>
  <text class="fig-mono" x="70.0" y="163" text-anchor="middle" font-size="12">d = 1</text>
  <rect class="fig-box" x="136" y="120" width="100" height="56" rx="6"/>
  <text x="186.0" y="143" text-anchor="middle" font-size="13" font-weight="600">2. exp z</text>
  <text class="fig-mono" x="186.0" y="163" text-anchor="middle" font-size="12">d = 1</text>
  <rect class="fig-box" x="252" y="120" width="100" height="56" rx="6"/>
  <text x="302.0" y="143" text-anchor="middle" font-size="13" font-weight="600">3. log z</text>
  <text class="fig-mono" x="302.0" y="163" text-anchor="middle" font-size="12">d = 1</text>
  <rect class="fig-accent" x="368" y="120" width="100" height="56" rx="6"/>
  <text x="418.0" y="143" text-anchor="middle" font-size="13" font-weight="600">4. z</text>
  <text class="fig-mono" x="418.0" y="163" text-anchor="middle" font-size="12">d = 403.60</text>
  <rect class="fig-box" x="484" y="120" width="100" height="56" rx="6"/>
  <text x="534.0" y="143" text-anchor="middle" font-size="13" font-weight="600">5. y</text>
  <text class="fig-mono" x="534.0" y="163" text-anchor="middle" font-size="12">d = 807.19</text>
  <rect class="fig-box" x="600" y="120" width="100" height="56" rx="6"/>
  <text x="650.0" y="143" text-anchor="middle" font-size="13" font-weight="600">6. x</text>
  <text class="fig-mono" x="650.0" y="163" text-anchor="middle" font-size="12">d = 1210.79</text>
  <path class="fig-accent-line" d="M78.0 120 Q128.0 70 178.0 118" fill="none" marker-end="url(#22-topo-order-arrow)"/>
  <text class="fig-accent-text fig-mono" x="128.0" y="91.0" text-anchor="middle" font-size="12">1</text>
  <path class="fig-accent-line" d="M194.0 120 Q302.0 20 410.0 118" fill="none" marker-end="url(#22-topo-order-arrow)"/>
  <text class="fig-accent-text fig-mono" x="302.0" y="66.0" text-anchor="middle" font-size="12">exp z = 403.43</text>
  <path class="fig-accent-line" d="M426.0 120 Q476.0 70 526.0 118" fill="none" marker-end="url(#22-topo-order-arrow)"/>
  <text class="fig-accent-text fig-mono" x="476.0" y="91.0" text-anchor="middle" font-size="12">* x</text>
  <path class="fig-accent-line" d="M78.0 176 Q186.0 246 294.0 178" fill="none" marker-end="url(#22-topo-order-arrow)"/>
  <text class="fig-accent-text fig-mono" x="186.0" y="225.0" text-anchor="middle" font-size="12">1</text>
  <path class="fig-accent-line" d="M310.0 176 Q360.0 226 410.0 178" fill="none" marker-end="url(#22-topo-order-arrow)"/>
  <text class="fig-accent-text fig-mono" x="360.0" y="215.0" text-anchor="middle" font-size="12">1/z</text>
  <path class="fig-accent-line" d="M426.0 176 Q534.0 266 642.0 178" fill="none" marker-end="url(#22-topo-order-arrow)"/>
  <text class="fig-accent-text fig-mono" x="534.0" y="235.0" text-anchor="middle" font-size="12">* y</text>
  <text class="fig-muted" x="360" y="290" text-anchor="middle" font-size="12">each arc carries one contribution. z adds its two before it sends anything.</text>
</svg>
