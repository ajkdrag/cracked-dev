<svg viewBox="0 0 720 280" role="img" aria-label="And16 on two 16-wire buses: wire i of a and wire i of b go into the i-th And, which drives wire i of out, so bit 2 of 0x0005 And 0x0006 is 1 and the others are 0">
  <defs>
    <marker id="03-bus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="20" y="34" font-size="13">a = 0x0005</text>
  <text class="fig-mono" x="20" y="54" font-size="13">b = 0x0006</text>
  <text class="fig-muted" x="150" y="40" text-anchor="middle" font-size="12">bit 15</text>
  <text class="fig-mono" x="134" y="72" text-anchor="middle" font-size="13">0</text>
  <text class="fig-mono" x="166" y="72" text-anchor="middle" font-size="13">0</text>
  <line class="fig-line" x1="134" y1="80" x2="134" y2="118" marker-end="url(#03-bus-arrow)"/>
  <line class="fig-line" x1="166" y1="80" x2="166" y2="118" marker-end="url(#03-bus-arrow)"/>
  <rect class="fig-box" x="114" y="120" width="72" height="50" rx="6"/>
  <text x="150" y="150" text-anchor="middle" font-size="14" font-weight="600">And</text>
  <line class="fig-line" x1="150" y1="170" x2="150" y2="206" marker-end="url(#03-bus-arrow)"/>
  <text class="fig-mono" x="150" y="226" text-anchor="middle" font-size="13">0</text>
  <text class="fig-muted" x="300" y="150" text-anchor="middle" font-size="16">...</text>
  <text class="fig-muted" x="390" y="40" text-anchor="middle" font-size="12">bit 2</text>
  <text class="fig-mono" x="374" y="72" text-anchor="middle" font-size="13">1</text>
  <text class="fig-mono" x="406" y="72" text-anchor="middle" font-size="13">1</text>
  <line class="fig-accent-line" x1="374" y1="80" x2="374" y2="118" marker-end="url(#03-bus-arrow)"/>
  <line class="fig-accent-line" x1="406" y1="80" x2="406" y2="118" marker-end="url(#03-bus-arrow)"/>
  <rect class="fig-accent" x="354" y="120" width="72" height="50" rx="6"/>
  <text x="390" y="150" text-anchor="middle" font-size="14" font-weight="600">And</text>
  <line class="fig-accent-line" x1="390" y1="170" x2="390" y2="206" marker-end="url(#03-bus-arrow)"/>
  <text class="fig-accent-text fig-mono" x="390" y="226" text-anchor="middle" font-size="13">1</text>
  <text class="fig-muted" x="500" y="40" text-anchor="middle" font-size="12">bit 1</text>
  <text class="fig-mono" x="484" y="72" text-anchor="middle" font-size="13">0</text>
  <text class="fig-mono" x="516" y="72" text-anchor="middle" font-size="13">1</text>
  <line class="fig-line" x1="484" y1="80" x2="484" y2="118" marker-end="url(#03-bus-arrow)"/>
  <line class="fig-line" x1="516" y1="80" x2="516" y2="118" marker-end="url(#03-bus-arrow)"/>
  <rect class="fig-box" x="464" y="120" width="72" height="50" rx="6"/>
  <text x="500" y="150" text-anchor="middle" font-size="14" font-weight="600">And</text>
  <line class="fig-line" x1="500" y1="170" x2="500" y2="206" marker-end="url(#03-bus-arrow)"/>
  <text class="fig-mono" x="500" y="226" text-anchor="middle" font-size="13">0</text>
  <text class="fig-muted" x="610" y="40" text-anchor="middle" font-size="12">bit 0</text>
  <text class="fig-mono" x="594" y="72" text-anchor="middle" font-size="13">1</text>
  <text class="fig-mono" x="626" y="72" text-anchor="middle" font-size="13">0</text>
  <line class="fig-line" x1="594" y1="80" x2="594" y2="118" marker-end="url(#03-bus-arrow)"/>
  <line class="fig-line" x1="626" y1="80" x2="626" y2="118" marker-end="url(#03-bus-arrow)"/>
  <rect class="fig-box" x="574" y="120" width="72" height="50" rx="6"/>
  <text x="610" y="150" text-anchor="middle" font-size="14" font-weight="600">And</text>
  <line class="fig-line" x1="610" y1="170" x2="610" y2="206" marker-end="url(#03-bus-arrow)"/>
  <text class="fig-mono" x="610" y="226" text-anchor="middle" font-size="13">0</text>
  <text class="fig-mono" x="20" y="226" font-size="13">out = 0x0004</text>
  <text class="fig-muted" x="360" y="262" text-anchor="middle" font-size="12">16 separate Ands, one per wire pair. No wire affects its neighbor.</text>
</svg>
