<svg viewBox="0 0 720 270" role="img" aria-label="A Value on the VM stack is a 4-byte type tag, 4 bytes of padding and an 8-byte payload. For a string the payload points at an ObjString on the heap, which starts with the Obj header shared by every object.">
  <defs>
    <marker id="11-value-object-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="120" y="44" text-anchor="middle" font-size="13" font-weight="600">Value on the VM stack</text>
  <text class="fig-muted" x="120" y="62" text-anchor="middle" font-size="12">16 bytes</text>
  <rect class="fig-box" x="20" y="76" width="100" height="36" rx="6"/>
  <text class="fig-mono" x="70" y="99" text-anchor="middle" font-size="12">VAL_OBJ</text>
  <rect class="fig-box" x="120" y="76" width="100" height="36" rx="6"/>
  <text class="fig-muted" x="170" y="99" text-anchor="middle" font-size="12">padding</text>
  <rect class="fig-accent" x="20" y="112" width="200" height="36" rx="6"/>
  <text class="fig-mono" x="70" y="135" text-anchor="middle" font-size="12">as.obj</text>
  <text x="214" y="94" text-anchor="middle" font-size="11"></text>
  <text class="fig-muted" x="20" y="166" text-anchor="start" font-size="11">tag 4 bytes, padding 4, payload 8</text>
  <line class="fig-accent-line" x1="200" y1="130" x2="298" y2="86" marker-end="url(#11-value-object-arrow)"/>
  <text x="410" y="34" text-anchor="middle" font-size="13" font-weight="600">ObjString on the heap</text>
  <rect class="fig-accent" x="300" y="50" width="220" height="36" rx="6"/>
  <text class="fig-mono" x="312" y="73" text-anchor="start" font-size="12">obj.type</text>
  <text class="fig-mono" x="508" y="73" text-anchor="end" font-size="12">OBJ_STRING</text>
  <rect class="fig-accent" x="300" y="86" width="220" height="36" rx="6"/>
  <text class="fig-mono" x="312" y="109" text-anchor="start" font-size="12">obj.next</text>
  <rect class="fig-box" x="300" y="122" width="220" height="36" rx="6"/>
  <text class="fig-mono" x="312" y="145" text-anchor="start" font-size="12">length</text>
  <text class="fig-mono" x="508" y="145" text-anchor="end" font-size="12">5</text>
  <rect class="fig-box" x="300" y="158" width="220" height="36" rx="6"/>
  <text class="fig-mono" x="312" y="181" text-anchor="start" font-size="12">chars</text>
  <rect class="fig-box" x="300" y="194" width="220" height="36" rx="6"/>
  <text class="fig-mono" x="312" y="217" text-anchor="start" font-size="12">hash</text>
  <text class="fig-mono" x="508" y="217" text-anchor="end" font-size="12">of the chars</text>
  <text class="fig-muted" x="310" y="250" text-anchor="start" font-size="11">the first two rows are the Obj header</text>
  <line class="fig-line" x1="500" y1="104" x2="556" y2="104" marker-end="url(#11-value-object-arrow)"/>
  <text class="fig-muted" x="562" y="108" text-anchor="start" font-size="12">next object</text>
  <line class="fig-line" x1="500" y1="176" x2="556" y2="176" marker-end="url(#11-value-object-arrow)"/>
  <rect class="fig-box" x="558" y="163" width="23" height="26" rx="6"/>
  <text class="fig-mono" x="569.5" y="181" text-anchor="middle" font-size="12">h</text>
  <rect class="fig-box" x="581" y="163" width="23" height="26" rx="6"/>
  <text class="fig-mono" x="592.5" y="181" text-anchor="middle" font-size="12">e</text>
  <rect class="fig-box" x="604" y="163" width="23" height="26" rx="6"/>
  <text class="fig-mono" x="615.5" y="181" text-anchor="middle" font-size="12">l</text>
  <rect class="fig-box" x="627" y="163" width="23" height="26" rx="6"/>
  <text class="fig-mono" x="638.5" y="181" text-anchor="middle" font-size="12">l</text>
  <rect class="fig-box" x="650" y="163" width="23" height="26" rx="6"/>
  <text class="fig-mono" x="661.5" y="181" text-anchor="middle" font-size="12">o</text>
  <rect class="fig-box" x="673" y="163" width="23" height="26" rx="6"/>
  <text class="fig-mono" x="684.5" y="181" text-anchor="middle" font-size="12">\0</text>
</svg>
