  <line class="fig-line" x1="200" y1="356" x2="200" y2="390" marker-end="url(#04-descent-arrow)"/>
  <line class="fig-line" x1="520" y1="356" x2="520" y2="390" marker-end="url(#04-descent-arrow)"/>
  <line class="fig-line" x1="520" y1="436" x2="520" y2="470" marker-end="url(#04-descent-arrow)"/>
  <line class="fig-line" x1="520" y1="516" x2="520" y2="550" marker-end="url(#04-descent-arrow)"/>
  <text class="fig-muted" x="20" y="330" font-size="12">calls</text>
  <text class="fig-muted" x="20" y="346" font-size="12">go down</text>
</svg>
