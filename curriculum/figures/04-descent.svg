  <text class="fig-mono fig-muted" x="200" y="348" text-anchor="middle" font-size="12">sees 1 at 1</text>
  <rect class="fig-box" x="435" y="312" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="520" y="331" text-anchor="middle" font-size="13">parse_value</text>
  <text class="fig-mono fig-muted" x="520" y="348" text-anchor="middle" font-size="12">sees [ at 3</text>
  <rect class="fig-box" x="115" y="392" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="200" y="411" text-anchor="middle" font-size="13">parse_number</text>
  <text class="fig-mono fig-muted" x="200" y="428" text-anchor="middle" font-size="12">reads 1</text>
  <rect class="fig-accent" x="435" y="392" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="520" y="411" text-anchor="middle" font-size="13">parse_array</text>
  <text class="fig-mono fig-muted" x="520" y="428" text-anchor="middle" font-size="12">[ ... ] at 3 to 8</text>
  <rect class="fig-box" x="435" y="472" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="520" y="491" text-anchor="middle" font-size="13">parse_value</text>
  <text class="fig-mono fig-muted" x="520" y="508" text-anchor="middle" font-size="12">sees t at 4</text>
  <rect class="fig-box" x="435" y="552" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="520" y="571" text-anchor="middle" font-size="13">parse_literal</text>
  <text class="fig-mono fig-muted" x="520" y="588" text-anchor="middle" font-size="12">reads true</text>
  <line class="fig-line" x1="360" y1="136" x2="360" y2="160" marker-end="url(#04-descent-arrow)"/>
  <line class="fig-line" x1="360" y1="206" x2="360" y2="230" marker-end="url(#04-descent-arrow)"/>
  <line class="fig-line" x1="320" y1="276" x2="220" y2="310" marker-end="url(#04-descent-arrow)"/>
