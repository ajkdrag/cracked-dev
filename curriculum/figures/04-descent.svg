<svg viewBox="0 0 720 616" role="img" aria-label="Parsing [1,[true]]: json_parse calls parse_value, which sees [ and calls parse_array. That calls parse_value for 1, which calls parse_number, and parse_value for the inner array, which calls parse_array, parse_value and parse_literal.">
  <defs>
    <marker id="04-descent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="46" font-size="12">input</text>
  <rect class="fig-box" x="210" y="24" width="30" height="32"/>
  <text class="fig-mono" x="225" y="45" text-anchor="middle" font-size="15">[</text>
  <text class="fig-mono fig-muted" x="225" y="72" text-anchor="middle" font-size="11">0</text>
  <rect class="fig-box" x="240" y="24" width="30" height="32"/>
  <text class="fig-mono" x="255" y="45" text-anchor="middle" font-size="15">1</text>
