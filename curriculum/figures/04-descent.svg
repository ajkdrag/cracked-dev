  <rect class="fig-box" x="300" y="24" width="30" height="32"/>
  <text class="fig-mono" x="315" y="45" text-anchor="middle" font-size="15">[</text>
  <text class="fig-mono fig-muted" x="315" y="72" text-anchor="middle" font-size="11">3</text>
  <rect class="fig-box" x="330" y="24" width="30" height="32"/>
  <text class="fig-mono" x="345" y="45" text-anchor="middle" font-size="15">t</text>
  <text class="fig-mono fig-muted" x="345" y="72" text-anchor="middle" font-size="11">4</text>
  <rect class="fig-box" x="360" y="24" width="30" height="32"/>
  <text class="fig-mono" x="375" y="45" text-anchor="middle" font-size="15">r</text>
  <text class="fig-mono fig-muted" x="375" y="72" text-anchor="middle" font-size="11">5</text>
  <rect class="fig-box" x="390" y="24" width="30" height="32"/>
  <text class="fig-mono" x="405" y="45" text-anchor="middle" font-size="15">u</text>
  <text class="fig-mono fig-muted" x="405" y="72" text-anchor="middle" font-size="11">6</text>
  <rect class="fig-box" x="420" y="24" width="30" height="32"/>
  <text class="fig-mono" x="435" y="45" text-anchor="middle" font-size="15">e</text>
  <text class="fig-mono fig-muted" x="435" y="72" text-anchor="middle" font-size="11">7</text>
  <rect class="fig-box" x="450" y="24" width="30" height="32"/>
  <text class="fig-mono" x="465" y="45" text-anchor="middle" font-size="15">]</text>
  <text class="fig-mono fig-muted" x="465" y="72" text-anchor="middle" font-size="11">8</text>
  <rect class="fig-box" x="480" y="24" width="30" height="32"/>
  <text class="fig-mono" x="495" y="45" text-anchor="middle" font-size="15">]</text>
  <text class="fig-mono fig-muted" x="495" y="72" text-anchor="middle" font-size="11">9</text>
  <rect class="fig-box" x="275" y="92" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="360" y="111" text-anchor="middle" font-size="13">json_parse</text>
  <text class="fig-mono fig-muted" x="360" y="128" text-anchor="middle" font-size="12">bytes 0 to 9</text>
  <rect class="fig-box" x="275" y="162" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="360" y="181" text-anchor="middle" font-size="13">parse_value</text>
  <text class="fig-mono fig-muted" x="360" y="198" text-anchor="middle" font-size="12">sees [ at 0</text>
  <rect class="fig-accent" x="275" y="232" width="170" height="44" rx="6"/>
  <text class="fig-mono" x="360" y="251" text-anchor="middle" font-size="13">parse_array</text>
  <text class="fig-mono fig-muted" x="360" y="268" text-anchor="middle" font-size="12">[ 1 , ... ]</text>
  <rect class="fig-box" x="115" y="312" width="170" height="44" rx="6"/>
