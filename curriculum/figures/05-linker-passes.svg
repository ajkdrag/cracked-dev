<svg viewBox="0 0 720 220" role="img" aria-label="The linker runs two passes over the object files: pass one matches every used name to one definition, pass two lays out the sections and fills every relocation hole, giving one executable.">
  <defs>
    <marker id="05-linker-passes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="30" y="48" width="140" height="28" rx="6"/>
  <text class="fig-mono" x="100" y="67" text-anchor="middle" font-size="13">arena.o</text>
  <rect class="fig-box" x="30" y="84" width="140" height="28" rx="6"/>
  <text class="fig-mono" x="100" y="103" text-anchor="middle" font-size="13">json.o</text>
  <rect class="fig-box" x="30" y="120" width="140" height="28" rx="6"/>
  <text class="fig-mono" x="100" y="139" text-anchor="middle" font-size="13">jsoncheck.o</text>

  <line class="fig-line" x1="170" y1="98" x2="235" y2="98" marker-end="url(#05-linker-passes-arrow)"/>
  <text class="fig-muted" x="202" y="90" text-anchor="middle" font-size="12">ld</text>

  <rect class="fig-accent" x="245" y="54" width="230" height="40" rx="6"/>
  <text x="360" y="70" text-anchor="middle" font-size="13" font-weight="600">pass 1: resolve symbols</text>
  <text class="fig-muted" x="360" y="86" text-anchor="middle" font-size="12">match every use to one definition</text>

  <rect class="fig-accent" x="245" y="104" width="230" height="40" rx="6"/>
  <text x="360" y="120" text-anchor="middle" font-size="13" font-weight="600">pass 2: relocate</text>
  <text class="fig-muted" x="360" y="136" text-anchor="middle" font-size="12">lay out sections, fill every hole</text>

  <line class="fig-line" x1="360" y1="94" x2="360" y2="104" marker-end="url(#05-linker-passes-arrow)"/>

  <line class="fig-line" x1="475" y1="112" x2="540" y2="112" marker-end="url(#05-linker-passes-arrow)"/>
  <rect class="fig-box" x="550" y="94" width="140" height="36" rx="6"/>
  <text class="fig-mono" x="620" y="117" text-anchor="middle" font-size="13">app</text>

  <text class="fig-muted" x="360" y="186" text-anchor="middle" font-size="12">a missing definition fails pass 1, a hole with no known target fails pass 2</text>
</svg>
