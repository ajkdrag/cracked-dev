<svg viewBox="0 0 720 200" role="img" aria-label="x86-64 splits the low 48 bits of a virtual address into four 9-bit indexes and a 12-bit offset, and bits 63 to 48 must copy bit 47. CR3 points at the level 4 table, and each index picks an entry in the next table. Sv39 in chapter 08 walks the same way without the level 4 step.">
  <defs>
    <marker id="15-page-walk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="20" y="26" text-anchor="start" font-size="12">a 64-bit virtual address on x86-64</text>
  <rect class="fig-box" x="40" y="36" width="110" height="34" rx="0"/>
  <text class="fig-mono" x="95.0" y="58" text-anchor="middle" font-size="12">63..48</text>
  <rect class="fig-accent" x="150" y="36" width="110" height="34" rx="0"/>
  <text class="fig-mono" x="205.0" y="58" text-anchor="middle" font-size="12">L4  47..39</text>
  <rect class="fig-box" x="260" y="36" width="110" height="34" rx="0"/>
  <text class="fig-mono" x="315.0" y="58" text-anchor="middle" font-size="12">L3  38..30</text>
  <rect class="fig-box" x="370" y="36" width="110" height="34" rx="0"/>
  <text class="fig-mono" x="425.0" y="58" text-anchor="middle" font-size="12">L2  29..21</text>
  <rect class="fig-box" x="480" y="36" width="110" height="34" rx="0"/>
  <text class="fig-mono" x="535.0" y="58" text-anchor="middle" font-size="12">L1  20..12</text>
  <rect class="fig-box" x="590" y="36" width="110" height="34" rx="0"/>
  <text class="fig-mono" x="645.0" y="58" text-anchor="middle" font-size="12">offset 11..0</text>
  <rect class="fig-box" x="30" y="96" width="80" height="46" rx="6"/>
  <text class="fig-mono" x="70.0" y="124.0" text-anchor="middle" font-size="12">CR3</text>
  <rect class="fig-accent" x="165" y="96" width="80" height="46" rx="6"/>
  <text class="fig-mono" x="205.0" y="114.5" text-anchor="middle" font-size="12">L4</text>
  <text class="fig-muted" x="205.0" y="132.5" text-anchor="middle" font-size="12">table</text>
  <line class="fig-line" x1="110" y1="119" x2="163" y2="119" marker-end="url(#15-page-walk-arrow)"/>
  <rect class="fig-box" x="275" y="96" width="80" height="46" rx="6"/>
  <text class="fig-mono" x="315.0" y="114.5" text-anchor="middle" font-size="12">L3</text>
  <text class="fig-muted" x="315.0" y="132.5" text-anchor="middle" font-size="12">table</text>
  <line class="fig-line" x1="245" y1="119" x2="273" y2="119" marker-end="url(#15-page-walk-arrow)"/>
  <rect class="fig-box" x="385" y="96" width="80" height="46" rx="6"/>
  <text class="fig-mono" x="425.0" y="114.5" text-anchor="middle" font-size="12">L2</text>
  <text class="fig-muted" x="425.0" y="132.5" text-anchor="middle" font-size="12">table</text>
  <line class="fig-line" x1="355" y1="119" x2="383" y2="119" marker-end="url(#15-page-walk-arrow)"/>
  <rect class="fig-box" x="495" y="96" width="80" height="46" rx="6"/>
  <text class="fig-mono" x="535.0" y="114.5" text-anchor="middle" font-size="12">L1</text>
  <text class="fig-muted" x="535.0" y="132.5" text-anchor="middle" font-size="12">table</text>
  <line class="fig-line" x1="465" y1="119" x2="493" y2="119" marker-end="url(#15-page-walk-arrow)"/>
  <rect class="fig-box" x="605" y="96" width="80" height="46" rx="6"/>
  <text class="fig-mono" x="645.0" y="124.0" text-anchor="middle" font-size="12">frame</text>
  <line class="fig-line" x1="575" y1="119" x2="603" y2="119" marker-end="url(#15-page-walk-arrow)"/>
  <text class="fig-muted" x="360" y="178" text-anchor="middle" font-size="12">each table: 512 entries of 8 bytes, one 4 KiB frame</text>
</svg>
