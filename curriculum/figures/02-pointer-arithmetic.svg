<svg viewBox="0 0 720 340" role="img" aria-label="Adding 1 to an int pointer moves it 4 bytes, one int. Adding 1 to a char pointer moves it 1 byte, one char">
  <defs>
    <marker id="02-pointer-arithmetic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="40" y="34" font-size="14" font-weight="600">int nums[4] = {10, 20, 30, 40};  int *p = nums;</text>
  <text class="fig-mono fig-accent-text" x="48" y="70" text-anchor="end" font-size="13">p</text>
  <line class="fig-accent-line" x1="56" y1="54" x2="56" y2="88" marker-end="url(#02-pointer-arithmetic-arrow)"/>
  <text class="fig-mono fig-accent-text" x="192" y="70" font-size="13">p + 1</text>
  <line class="fig-accent-line" x1="184" y1="54" x2="184" y2="88" marker-end="url(#02-pointer-arithmetic-arrow)"/>
  <rect class="fig-box" x="40" y="90" width="128" height="44"/>
  <line class="fig-line" x1="72" y1="122" x2="72" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="104" y1="122" x2="104" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="136" y1="122" x2="136" y2="134" stroke-dasharray="2 2"/>
  <text class="fig-mono" x="104" y="117" text-anchor="middle" font-size="13">10</text>
  <text class="fig-mono fig-muted" x="56" y="152" text-anchor="middle" font-size="11">+0</text>
  <rect class="fig-box" x="168" y="90" width="128" height="44"/>
  <line class="fig-line" x1="200" y1="122" x2="200" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="232" y1="122" x2="232" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="264" y1="122" x2="264" y2="134" stroke-dasharray="2 2"/>
  <text class="fig-mono" x="232" y="117" text-anchor="middle" font-size="13">20</text>
  <text class="fig-mono fig-muted" x="184" y="152" text-anchor="middle" font-size="11">+4</text>
  <rect class="fig-box" x="296" y="90" width="128" height="44"/>
  <line class="fig-line" x1="328" y1="122" x2="328" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="360" y1="122" x2="360" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="392" y1="122" x2="392" y2="134" stroke-dasharray="2 2"/>
  <text class="fig-mono" x="360" y="117" text-anchor="middle" font-size="13">30</text>
  <text class="fig-mono fig-muted" x="312" y="152" text-anchor="middle" font-size="11">+8</text>
  <rect class="fig-box" x="424" y="90" width="128" height="44"/>
  <line class="fig-line" x1="456" y1="122" x2="456" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="488" y1="122" x2="488" y2="134" stroke-dasharray="2 2"/>
  <line class="fig-line" x1="520" y1="122" x2="520" y2="134" stroke-dasharray="2 2"/>
  <text class="fig-mono" x="488" y="117" text-anchor="middle" font-size="13">40</text>
  <text class="fig-mono fig-muted" x="440" y="152" text-anchor="middle" font-size="11">+12</text>
  <text class="fig-muted" x="680" y="117" text-anchor="end" font-size="12">p + 1 is 4 bytes on</text>
  <text class="fig-mono" x="40" y="184" font-size="14" font-weight="600">char text[4] = "cat";  char *q = text;</text>
  <text class="fig-mono fig-accent-text" x="48" y="220" text-anchor="end" font-size="13">q</text>
  <line class="fig-accent-line" x1="56" y1="204" x2="56" y2="238" marker-end="url(#02-pointer-arithmetic-arrow)"/>
  <text class="fig-mono fig-accent-text" x="96" y="220" font-size="13">q + 1</text>
  <line class="fig-accent-line" x1="88" y1="204" x2="88" y2="238" marker-end="url(#02-pointer-arithmetic-arrow)"/>
  <rect class="fig-box" x="40" y="240" width="32" height="44"/>
  <text class="fig-mono" x="56" y="267" text-anchor="middle" font-size="13">c</text>
  <text class="fig-mono fig-muted" x="56" y="302" text-anchor="middle" font-size="11">+0</text>
  <rect class="fig-box" x="72" y="240" width="32" height="44"/>
  <text class="fig-mono" x="88" y="267" text-anchor="middle" font-size="13">a</text>
  <text class="fig-mono fig-muted" x="88" y="302" text-anchor="middle" font-size="11">+1</text>
  <rect class="fig-box" x="104" y="240" width="32" height="44"/>
  <text class="fig-mono" x="120" y="267" text-anchor="middle" font-size="13">t</text>
  <text class="fig-mono fig-muted" x="120" y="302" text-anchor="middle" font-size="11">+2</text>
  <rect class="fig-box" x="136" y="240" width="32" height="44"/>
  <text class="fig-mono" x="152" y="267" text-anchor="middle" font-size="13">\0</text>
  <text class="fig-mono fig-muted" x="152" y="302" text-anchor="middle" font-size="11">+3</text>
  <text class="fig-muted" x="680" y="267" text-anchor="end" font-size="12">q + 1 is 1 byte on</text>
  <text class="fig-muted" x="40" y="324" font-size="12">The numbers under the boxes are byte offsets from the start of each array.</text>
</svg>
