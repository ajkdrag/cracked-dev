<svg viewBox="0 0 720 340" role="img" aria-label="Achieved FLOP/s against arithmetic intensity, both on log scales. Left of the ridge point the bandwidth line is the limit, right of it the compute peak is. Copy and softmax sit far left, a large matrix multiply sits right of the ridge.">
  <defs>
    <marker id="21-roofline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <line class="fig-line" x1="90" y1="280" x2="650" y2="280" marker-end="url(#21-roofline-arrow)"/>
  <line class="fig-line" x1="90" y1="280" x2="90" y2="50" marker-end="url(#21-roofline-arrow)"/>
  <text class="fig-muted" x="650" y="324" text-anchor="end" font-size="12">arithmetic intensity: FLOP per byte of DRAM traffic (log)</text>
  <text class="fig-muted" x="30" y="60" font-size="12">FLOP/s</text>
  <text class="fig-muted" x="30" y="76" font-size="12">(log)</text>
  <line class="fig-accent-line" x1="100" y1="260" x2="360" y2="90" stroke-width="1.5"/>
  <line class="fig-accent-line" x1="360" y1="90" x2="630" y2="90" stroke-width="1.5"/>
  <text class="fig-accent-text" x="560" y="80" text-anchor="middle" font-size="12">peak FP32: compute limit</text>
  <text class="fig-accent-text" x="215" y="150" text-anchor="end" font-size="12">slope: DRAM bandwidth</text>
  <line class="fig-line" x1="360" y1="94" x2="360" y2="280" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="360" y="298" text-anchor="middle" font-size="12">ridge point</text>
  <text class="fig-muted" x="225" y="298" text-anchor="middle" font-size="12">memory-bound</text>
  <text class="fig-muted" x="505" y="298" text-anchor="middle" font-size="12">compute-bound</text>
  <circle class="fig-accent-fill" cx="120" cy="252" r="5"/>
  <text x="130" y="256" font-size="12">copy</text>
  <circle class="fig-accent-fill" cx="165" cy="214" r="5"/>
  <text x="175" y="218" font-size="12">softmax</text>
  <circle class="fig-accent-fill" cx="540" cy="112" r="5"/>
  <text x="550" y="116" font-size="12">matmul 4096</text>
</svg>
