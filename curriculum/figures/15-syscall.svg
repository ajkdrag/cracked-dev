<svg viewBox="0 0 720 400" role="img" aria-label="One write through int 0x80: the user program puts the number in rax and the arguments in rdi and rsi, the CPU enters through IDT entry 0x80 on the TSS stack, syscall_entry saves the registers, syscall_dispatch calls sys_write, and the return value travels back in the saved rax through iretq.">
  <defs>
    <marker id="15-syscall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="130" y="26" text-anchor="middle" font-size="12">ring 3</text>
  <text class="fig-muted" x="500" y="26" text-anchor="middle" font-size="12">ring 0</text>
  <line class="fig-line" x1="265" y1="14" x2="265" y2="386"/>
  <rect class="fig-box" x="20" y="40" width="220" height="96" rx="6"/>
  <text class="fig-mono" x="36" y="62" text-anchor="start" font-size="12">mov rax, 1</text>
  <text class="fig-mono" x="36" y="82" text-anchor="start" font-size="12">lea rdi, [rip + msg]</text>
  <text class="fig-mono" x="36" y="102" text-anchor="start" font-size="12">mov rsi, 18</text>
  <text class="fig-mono" x="36" y="122" text-anchor="start" font-size="12">int 0x80</text>
  <rect class="fig-box" x="300" y="40" width="400" height="50" rx="6"/>
  <text class="fig-mono" x="500.0" y="60.5" text-anchor="middle" font-size="12">the CPU</text>
  <text class="fig-muted" x="500.0" y="78.5" text-anchor="middle" font-size="12">IDT[0x80] has DPL 3, rsp from RSP0</text>
  <rect class="fig-box" x="300" y="104" width="400" height="50" rx="6"/>
  <text class="fig-mono" x="500.0" y="124.5" text-anchor="middle" font-size="12">syscall_entry</text>
  <text class="fig-muted" x="500.0" y="142.5" text-anchor="middle" font-size="12">push 15 registers, call</text>
  <rect class="fig-accent" x="300" y="168" width="400" height="50" rx="6"/>
  <text class="fig-mono" x="500.0" y="188.5" text-anchor="middle" font-size="12">syscall_dispatch(regs)</text>
  <text class="fig-muted" x="500.0" y="206.5" text-anchor="middle" font-size="12">regs.rax == 1: write</text>
  <rect class="fig-box" x="300" y="232" width="400" height="50" rx="6"/>
  <text class="fig-mono" x="500.0" y="252.5" text-anchor="middle" font-size="12">sys_write(regs.rdi, regs.rsi)</text>
  <text class="fig-muted" x="500.0" y="270.5" text-anchor="middle" font-size="12">checks the range, prints 18 bytes</text>
  <rect class="fig-box" x="300" y="296" width="400" height="50" rx="6"/>
  <text class="fig-mono" x="500.0" y="316.5" text-anchor="middle" font-size="12">syscall_entry</text>
  <text class="fig-muted" x="500.0" y="334.5" text-anchor="middle" font-size="12">regs.rax = 18, pop 15, iretq</text>
  <line class="fig-line" x1="500" y1="90" x2="500" y2="102" marker-end="url(#15-syscall-arrow)"/>
  <line class="fig-line" x1="500" y1="154" x2="500" y2="166" marker-end="url(#15-syscall-arrow)"/>
  <line class="fig-line" x1="500" y1="218" x2="500" y2="230" marker-end="url(#15-syscall-arrow)"/>
  <line class="fig-line" x1="500" y1="282" x2="500" y2="294" marker-end="url(#15-syscall-arrow)"/>
  <line class="fig-line" x1="240" y1="108" x2="298" y2="66" marker-end="url(#15-syscall-arrow)"/>
  <rect class="fig-box" x="20" y="296" width="220" height="50" rx="6"/>
  <text x="130" y="318" text-anchor="middle" font-size="12" font-weight="600">user program</text>
  <text class="fig-mono" x="130" y="336" text-anchor="middle" font-size="12">continues, rax = 18</text>
  <line class="fig-line" x1="298" y1="321" x2="242" y2="321" marker-end="url(#15-syscall-arrow)"/>
  <text class="fig-muted" x="130" y="376" text-anchor="middle" font-size="12">the next instruction after int 0x80</text>
</svg>
