<svg viewBox="0 0 720 290" role="img" aria-label="The AST of x*x + 2*x and the IR its codegen emits. Each binary node first generates its two children and then appends one instruction, so the two multiplications come out before the addition. Leaves emit no instruction and return the argument %x or a constant.">
  <defs>
    <marker id="12-ast-codegen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="200" y="26" text-anchor="middle" font-size="13" font-weight="600">AST of x*x + 2*x</text>
  <text x="550" y="26" text-anchor="middle" font-size="13" font-weight="600">IR, in the order emitted</text>

  <rect class="fig-accent" x="140" y="40" width="120" height="36" rx="6"/>
  <text x="200" y="63" text-anchor="middle" font-size="13"><tspan class="fig-accent-fill" font-weight="600">3</tspan>  Binary +</text>

  <rect class="fig-accent" x="52" y="120" width="110" height="36" rx="6"/>
  <text x="107" y="143" text-anchor="middle" font-size="13"><tspan class="fig-accent-fill" font-weight="600">1</tspan>  Binary *</text>
  <rect class="fig-accent" x="238" y="120" width="110" height="36" rx="6"/>
  <text x="293" y="143" text-anchor="middle" font-size="13"><tspan class="fig-accent-fill" font-weight="600">2</tspan>  Binary *</text>

  <rect class="fig-box" x="20" y="200" width="84" height="36" rx="6"/>
  <text x="62" y="223" text-anchor="middle" font-size="12">Variable x</text>
  <rect class="fig-box" x="110" y="200" width="84" height="36" rx="6"/>
  <text x="152" y="223" text-anchor="middle" font-size="12">Variable x</text>
  <rect class="fig-box" x="206" y="200" width="84" height="36" rx="6"/>
  <text x="248" y="223" text-anchor="middle" font-size="12">Number 2</text>
  <rect class="fig-box" x="296" y="200" width="84" height="36" rx="6"/>
  <text x="338" y="223" text-anchor="middle" font-size="12">Variable x</text>

  <line class="fig-line" x1="180" y1="76" x2="113" y2="118"/>
  <line class="fig-line" x1="220" y1="76" x2="287" y2="118"/>
  <line class="fig-line" x1="90" y1="156" x2="66" y2="198"/>
  <line class="fig-line" x1="124" y1="156" x2="148" y2="198"/>
  <line class="fig-line" x1="276" y1="156" x2="252" y2="198"/>
  <line class="fig-line" x1="310" y1="156" x2="334" y2="198"/>
  <text class="fig-muted" x="200" y="264" text-anchor="middle" font-size="12">leaves emit nothing, they return %x or 2.0</text>

  <rect class="fig-box" x="392" y="80" width="308" height="140" rx="6"/>
  <text class="fig-mono" x="404" y="106" font-size="11">entry:</text>
  <text class="fig-accent-text" x="404" y="130" font-size="13" font-weight="600">1</text>
  <text class="fig-mono" x="420" y="130" font-size="11">%multmp = fmul double %x, %x</text>
  <text class="fig-accent-text" x="404" y="154" font-size="13" font-weight="600">2</text>
  <text class="fig-mono" x="420" y="154" font-size="11">%multmp1 = fmul double 2.000000e+00, %x</text>
  <text class="fig-accent-text" x="404" y="178" font-size="13" font-weight="600">3</text>
  <text class="fig-mono" x="420" y="178" font-size="11">%addtmp = fadd double %multmp, %multmp1</text>
  <text class="fig-mono" x="420" y="202" font-size="11">ret double %addtmp</text>
</svg>
