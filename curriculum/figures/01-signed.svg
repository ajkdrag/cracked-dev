<svg viewBox="0 0 720 240" role="img" aria-label="Adding 1 to the int 0x7fffffff gives the bits 0x80000000, and because the leftmost bit counts as -2147483648, the int reads as -2147483648">
  <defs>
    <marker id="01-signed-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="20" y="60" font-size="14">0x7fffffff</text>
  <text class="fig-muted" x="20" y="80" font-size="12">= 2147483647</text>
  <text class="fig-mono" x="20" y="170" font-size="14">0x80000000</text>
  <text class="fig-muted" x="20" y="190" font-size="12">= -2147483648</text>
  <line class="fig-line" x1="60" y1="94" x2="60" y2="148" marker-end="url(#01-signed-arrow)"/>
  <text class="fig-mono" x="72" y="126" font-size="13">+ 1</text>
  <rect class="fig-box" x="200" y="40" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="255" y="62" text-anchor="middle" font-size="14">7f</text>
  <text class="fig-mono fig-muted" x="255" y="80" text-anchor="middle" font-size="12">0111 1111</text>
  <rect class="fig-box" x="320" y="40" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="375" y="62" text-anchor="middle" font-size="14">ff</text>
  <text class="fig-mono fig-muted" x="375" y="80" text-anchor="middle" font-size="12">1111 1111</text>
  <rect class="fig-box" x="440" y="40" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="495" y="62" text-anchor="middle" font-size="14">ff</text>
  <text class="fig-mono fig-muted" x="495" y="80" text-anchor="middle" font-size="12">1111 1111</text>
  <rect class="fig-box" x="560" y="40" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="615" y="62" text-anchor="middle" font-size="14">ff</text>
  <text class="fig-mono fig-muted" x="615" y="80" text-anchor="middle" font-size="12">1111 1111</text>
  <rect class="fig-accent" x="200" y="150" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="255" y="172" text-anchor="middle" font-size="14">80</text>
  <text class="fig-mono fig-muted" x="255" y="190" text-anchor="middle" font-size="12">1000 0000</text>
  <rect class="fig-box" x="320" y="150" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="375" y="172" text-anchor="middle" font-size="14">00</text>
  <text class="fig-mono fig-muted" x="375" y="190" text-anchor="middle" font-size="12">0000 0000</text>
  <rect class="fig-box" x="440" y="150" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="495" y="172" text-anchor="middle" font-size="14">00</text>
  <text class="fig-mono fig-muted" x="495" y="190" text-anchor="middle" font-size="12">0000 0000</text>
  <rect class="fig-box" x="560" y="150" width="110" height="50" rx="6"/>
  <text class="fig-mono" x="615" y="172" text-anchor="middle" font-size="14">00</text>
  <text class="fig-mono fig-muted" x="615" y="190" text-anchor="middle" font-size="12">0000 0000</text>
  <text class="fig-muted" x="200" y="30" font-size="12">4 bytes, leftmost byte first</text>
  <text class="fig-accent-text" x="200" y="222" font-size="12">the leftmost bit counts as -2147483648</text>
</svg>
