<svg viewBox="0 0 720 270" role="img" aria-label="Add16 as a chain of full adders adding 0xFFFF and 0x0001: a carry of 1 ripples from bit 0 up to bit 15, every sum bit is 0, and the carry out of bit 15 is dropped">
