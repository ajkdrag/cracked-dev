    <marker id="03-adder-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="360" y="30" text-anchor="middle" font-size="13" font-weight="600">0xFFFF + 0x0001</text>
  <rect class="fig-box" x="80" y="110" width="90" height="60" rx="6"/>
  <text x="125" y="136" text-anchor="middle" font-size="13" font-weight="600">bit 15</text>
  <text class="fig-muted" x="125" y="154" text-anchor="middle" font-size="12">full adder</text>
  <line class="fig-line" x1="108" y1="76" x2="108" y2="108" marker-end="url(#03-adder-chain-arrow)"/>
  <line class="fig-line" x1="142" y1="76" x2="142" y2="108" marker-end="url(#03-adder-chain-arrow)"/>
  <text class="fig-mono" x="108" y="68" text-anchor="middle" font-size="12">a=1</text>
  <text class="fig-mono" x="142" y="68" text-anchor="middle" font-size="12">b=0</text>
  <line class="fig-line" x1="125" y1="170" x2="125" y2="200" marker-end="url(#03-adder-chain-arrow)"/>
  <text class="fig-mono" x="125" y="218" text-anchor="middle" font-size="12">sum 0</text>
  <rect class="fig-box" x="290" y="110" width="90" height="60" rx="6"/>
  <text x="335" y="136" text-anchor="middle" font-size="13" font-weight="600">bit 2</text>
  <text class="fig-muted" x="335" y="154" text-anchor="middle" font-size="12">full adder</text>
  <line class="fig-line" x1="318" y1="76" x2="318" y2="108" marker-end="url(#03-adder-chain-arrow)"/>
  <line class="fig-line" x1="352" y1="76" x2="352" y2="108" marker-end="url(#03-adder-chain-arrow)"/>
  <text class="fig-mono" x="318" y="68" text-anchor="middle" font-size="12">a=1</text>
  <text class="fig-mono" x="352" y="68" text-anchor="middle" font-size="12">b=0</text>
  <line class="fig-line" x1="335" y1="170" x2="335" y2="200" marker-end="url(#03-adder-chain-arrow)"/>
  <text class="fig-mono" x="335" y="218" text-anchor="middle" font-size="12">sum 0</text>
  <rect class="fig-box" x="430" y="110" width="90" height="60" rx="6"/>
  <text x="475" y="136" text-anchor="middle" font-size="13" font-weight="600">bit 1</text>
  <text class="fig-muted" x="475" y="154" text-anchor="middle" font-size="12">full adder</text>
  <line class="fig-line" x1="458" y1="76" x2="458" y2="108" marker-end="url(#03-adder-chain-arrow)"/>
  <line class="fig-line" x1="492" y1="76" x2="492" y2="108" marker-end="url(#03-adder-chain-arrow)"/>
  <text class="fig-mono" x="458" y="68" text-anchor="middle" font-size="12">a=1</text>
