<svg viewBox="0 0 720 350" role="img" aria-label="The three-pass softmax reads the row three times: once for the maximum, once for the sum, once to write the output. The online version keeps a running maximum and a running sum together and rescales the sum whenever the maximum grows, so it reads the row twice. Both write it once.">
  <defs>
    <marker id="21-online-softmax-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="36" font-size="13" font-weight="600">three passes</text>
  <rect class="fig-box" x="180" y="52" width="300" height="30" rx="4"/>
  <line class="fig-line" x1="210.0" y1="52" x2="210.0" y2="82"/>
  <line class="fig-line" x1="240.0" y1="52" x2="240.0" y2="82"/>
  <line class="fig-line" x1="270.0" y1="52" x2="270.0" y2="82"/>
  <line class="fig-line" x1="300.0" y1="52" x2="300.0" y2="82"/>
  <line class="fig-line" x1="330.0" y1="52" x2="330.0" y2="82"/>
  <line class="fig-line" x1="360.0" y1="52" x2="360.0" y2="82"/>
  <line class="fig-line" x1="390.0" y1="52" x2="390.0" y2="82"/>
  <line class="fig-line" x1="420.0" y1="52" x2="420.0" y2="82"/>
  <line class="fig-line" x1="450.0" y1="52" x2="450.0" y2="82"/>
  <text x="20" y="72" font-size="12">pass 1: read</text>
  <line class="fig-line" x1="484" y1="67" x2="520" y2="67" marker-end="url(#21-online-softmax-arrow)"/>
  <text class="fig-mono" x="528" y="72" font-size="12">m = max(x)</text>
  <rect class="fig-box" x="180" y="92" width="300" height="30" rx="4"/>
  <line class="fig-line" x1="210.0" y1="92" x2="210.0" y2="122"/>
  <line class="fig-line" x1="240.0" y1="92" x2="240.0" y2="122"/>
  <line class="fig-line" x1="270.0" y1="92" x2="270.0" y2="122"/>
  <line class="fig-line" x1="300.0" y1="92" x2="300.0" y2="122"/>
  <line class="fig-line" x1="330.0" y1="92" x2="330.0" y2="122"/>
  <line class="fig-line" x1="360.0" y1="92" x2="360.0" y2="122"/>
  <line class="fig-line" x1="390.0" y1="92" x2="390.0" y2="122"/>
  <line class="fig-line" x1="420.0" y1="92" x2="420.0" y2="122"/>
  <line class="fig-line" x1="450.0" y1="92" x2="450.0" y2="122"/>
  <text x="20" y="112" font-size="12">pass 2: read</text>
  <line class="fig-line" x1="484" y1="107" x2="520" y2="107" marker-end="url(#21-online-softmax-arrow)"/>
  <text class="fig-mono" x="528" y="112" font-size="12">d = sum exp(x - m)</text>
  <rect class="fig-box" x="180" y="132" width="300" height="30" rx="4"/>
  <line class="fig-line" x1="210.0" y1="132" x2="210.0" y2="162"/>
  <line class="fig-line" x1="240.0" y1="132" x2="240.0" y2="162"/>
  <line class="fig-line" x1="270.0" y1="132" x2="270.0" y2="162"/>
  <line class="fig-line" x1="300.0" y1="132" x2="300.0" y2="162"/>
  <line class="fig-line" x1="330.0" y1="132" x2="330.0" y2="162"/>
  <line class="fig-line" x1="360.0" y1="132" x2="360.0" y2="162"/>
  <line class="fig-line" x1="390.0" y1="132" x2="390.0" y2="162"/>
  <line class="fig-line" x1="420.0" y1="132" x2="420.0" y2="162"/>
  <line class="fig-line" x1="450.0" y1="132" x2="450.0" y2="162"/>
  <text x="20" y="152" font-size="12">pass 3: read, write</text>
  <line class="fig-line" x1="484" y1="147" x2="520" y2="147" marker-end="url(#21-online-softmax-arrow)"/>
  <text class="fig-mono" x="528" y="152" font-size="12">y = exp(x - m) / d</text>
  <text class="fig-muted" x="480" y="186" text-anchor="end" font-size="12">3 reads + 1 write of the row</text>
  <text x="20" y="220" font-size="13" font-weight="600">online</text>
  <rect class="fig-accent" x="180" y="236" width="300" height="30" rx="4"/>
  <line class="fig-accent-line" x1="210.0" y1="236" x2="210.0" y2="266"/>
  <line class="fig-accent-line" x1="240.0" y1="236" x2="240.0" y2="266"/>
  <line class="fig-accent-line" x1="270.0" y1="236" x2="270.0" y2="266"/>
  <line class="fig-accent-line" x1="300.0" y1="236" x2="300.0" y2="266"/>
  <line class="fig-accent-line" x1="330.0" y1="236" x2="330.0" y2="266"/>
  <line class="fig-accent-line" x1="360.0" y1="236" x2="360.0" y2="266"/>
  <line class="fig-accent-line" x1="390.0" y1="236" x2="390.0" y2="266"/>
  <line class="fig-accent-line" x1="420.0" y1="236" x2="420.0" y2="266"/>
  <line class="fig-accent-line" x1="450.0" y1="236" x2="450.0" y2="266"/>
  <text x="20" y="256" font-size="12">pass 1: read</text>
  <line class="fig-line" x1="484" y1="251" x2="520" y2="251" marker-end="url(#21-online-softmax-arrow)"/>
  <text class="fig-mono" x="528" y="256" font-size="12">(m, d) together</text>
  <text class="fig-muted" x="528" y="274" font-size="11">new max m': d *= exp(m - m')</text>
  <rect class="fig-box" x="180" y="292" width="300" height="30" rx="4"/>
  <line class="fig-line" x1="210.0" y1="292" x2="210.0" y2="322"/>
  <line class="fig-line" x1="240.0" y1="292" x2="240.0" y2="322"/>
  <line class="fig-line" x1="270.0" y1="292" x2="270.0" y2="322"/>
  <line class="fig-line" x1="300.0" y1="292" x2="300.0" y2="322"/>
  <line class="fig-line" x1="330.0" y1="292" x2="330.0" y2="322"/>
  <line class="fig-line" x1="360.0" y1="292" x2="360.0" y2="322"/>
  <line class="fig-line" x1="390.0" y1="292" x2="390.0" y2="322"/>
  <line class="fig-line" x1="420.0" y1="292" x2="420.0" y2="322"/>
  <line class="fig-line" x1="450.0" y1="292" x2="450.0" y2="322"/>
  <text x="20" y="312" font-size="12">pass 2: read, write</text>
  <line class="fig-line" x1="484" y1="307" x2="520" y2="307" marker-end="url(#21-online-softmax-arrow)"/>
  <text class="fig-mono" x="528" y="312" font-size="12">y = exp(x - m) / d</text>
  <text class="fig-muted" x="480" y="340" text-anchor="end" font-size="12">2 reads + 1 write</text>
</svg>
