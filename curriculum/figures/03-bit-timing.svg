<svg viewBox="0 0 720 310" role="img" aria-label="Four cycles of a Bit that starts at 0: in is 1 during cycle 2, but load is 0 then, so nothing is stored. In cycle 3 both are 1, and out shows the 1 only from cycle 4">
  <defs>
    <marker id="03-bit-timing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="205.0" y="30" text-anchor="middle" font-size="12">cycle 1</text>
  <text class="fig-muted" x="335.0" y="30" text-anchor="middle" font-size="12">cycle 2</text>
  <text class="fig-muted" x="465.0" y="30" text-anchor="middle" font-size="12">cycle 3</text>
  <text class="fig-muted" x="595.0" y="30" text-anchor="middle" font-size="12">cycle 4</text>
  <line class="fig-line" x1="140" y1="40" x2="140" y2="266" stroke-dasharray="2 4" opacity="0.4"/>
  <line class="fig-line" x1="270" y1="40" x2="270" y2="266" stroke-dasharray="2 4" opacity="0.4"/>
  <line class="fig-line" x1="400" y1="40" x2="400" y2="266" stroke-dasharray="2 4" opacity="0.4"/>
  <line class="fig-line" x1="530" y1="40" x2="530" y2="266" stroke-dasharray="2 4" opacity="0.4"/>
  <line class="fig-line" x1="660" y1="40" x2="660" y2="266" stroke-dasharray="2 4" opacity="0.4"/>
  <text class="fig-mono" x="20" y="75" font-size="13">clock</text>
  <path class="fig-line" d="M140 80 L140 60 L205.0 60 L205.0 80 L270 80 L270 80 L270 60 L335.0 60 L335.0 80 L400 80 L400 80 L400 60 L465.0 60 L465.0 80 L530 80 L530 80 L530 60 L595.0 60 L595.0 80 L660 80"/>
  <text class="fig-muted" x="172.5" y="54" text-anchor="middle" font-size="11">tick</text>
  <text class="fig-muted" x="237.5" y="54" text-anchor="middle" font-size="11">tock</text>
  <text class="fig-mono" x="20" y="135" font-size="13">in</text>
  <text class="fig-mono fig-muted" x="205.0" y="114" text-anchor="middle" font-size="12">0</text>
  <text class="fig-mono fig-muted" x="335.0" y="114" text-anchor="middle" font-size="12">1</text>
  <text class="fig-mono fig-muted" x="465.0" y="114" text-anchor="middle" font-size="12">1</text>
  <text class="fig-mono fig-muted" x="595.0" y="114" text-anchor="middle" font-size="12">0</text>
  <path class="fig-line" d="M140 140 L270 140 L270 120 L400 120 L400 120 L530 120 L530 140 L660 140"/>
  <text class="fig-mono" x="20" y="191" font-size="13">load</text>
  <text class="fig-mono fig-muted" x="205.0" y="170" text-anchor="middle" font-size="12">1</text>
  <text class="fig-mono fig-muted" x="335.0" y="170" text-anchor="middle" font-size="12">0</text>
  <text class="fig-mono fig-muted" x="465.0" y="170" text-anchor="middle" font-size="12">1</text>
  <text class="fig-mono fig-muted" x="595.0" y="170" text-anchor="middle" font-size="12">0</text>
  <path class="fig-line" d="M140 176 L270 176 L270 196 L400 196 L400 176 L530 176 L530 196 L660 196"/>
  <text class="fig-mono" x="20" y="247" font-size="13">out</text>
  <text class="fig-mono fig-muted" x="205.0" y="226" text-anchor="middle" font-size="12">0</text>
  <text class="fig-mono fig-muted" x="335.0" y="226" text-anchor="middle" font-size="12">0</text>
  <text class="fig-mono fig-muted" x="465.0" y="226" text-anchor="middle" font-size="12">0</text>
  <text class="fig-mono fig-muted" x="595.0" y="226" text-anchor="middle" font-size="12">1</text>
  <path class="fig-accent-line" d="M140 252 L270 252 L270 252 L400 252 L400 252 L530 252 L530 232 L660 232"/>
  <text class="fig-accent-text" x="140" y="292" font-size="12">one cycle = two clicks of the clock button. out changes at the start of the cycle after the load.</text>
</svg>
