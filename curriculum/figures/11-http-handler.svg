<svg viewBox="0 0 720 440" role="img" aria-label="During a handler call the response userdata points at the C connection and its live flag is 1. The server finds the routes table through an integer key in the registry. After the handler returns the flag is 0, so a res kept in a global still exists but every method on it raises an error.">
  <defs>
    <marker id="11-http-handler-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="110" y="36" text-anchor="middle" font-size="13" font-weight="600">C side</text>
  <text class="fig-mono" x="485" y="36" text-anchor="middle" font-size="13" font-weight="600">lua_State</text>
  <rect class="fig-box" x="20" y="50" width="180" height="56" rx="6"/>
  <text x="110" y="74" text-anchor="middle" font-size="13" font-weight="600">connection</text>
  <text class="fig-muted" x="110" y="94" text-anchor="middle" font-size="12">fd, output buffer</text>
  <rect class="fig-box" x="20" y="262" width="180" height="56" rx="6"/>
  <text x="110" y="286" text-anchor="middle" font-size="13" font-weight="600">server</text>
  <text class="fig-mono" x="110" y="306" text-anchor="middle" font-size="12">routes_ref = 3</text>
  <text class="fig-accent-text" x="370" y="62" text-anchor="middle" font-size="12">userdata res</text>
  <rect class="fig-accent" x="270" y="70" width="200" height="40" rx="6"/>
  <text class="fig-mono" x="282" y="95" text-anchor="start" font-size="12">conn</text>
  <rect class="fig-accent" x="270" y="110" width="200" height="40" rx="6"/>
  <text class="fig-mono" x="282" y="135" text-anchor="start" font-size="12">live</text>
  <text class="fig-mono" x="458" y="135" text-anchor="end" font-size="12">1, then 0</text>
  <line class="fig-line" x1="270" y1="90" x2="203" y2="82" marker-end="url(#11-http-handler-arrow)"/>
  <line class="fig-line" x1="370" y1="150" x2="370" y2="187" marker-end="url(#11-http-handler-arrow)"/>
  <text class="fig-muted" x="378" y="174" text-anchor="start" font-size="11">metatable</text>
  <rect class="fig-box" x="270" y="190" width="200" height="56" rx="6"/>
  <text x="370" y="214" text-anchor="middle" font-size="13" font-weight="600">metatable</text>
  <text class="fig-mono" x="370" y="234" text-anchor="middle" font-size="12">status  header  write</text>
  <rect class="fig-box" x="520" y="50" width="180" height="70" rx="6"/>
  <text x="610" y="74" text-anchor="middle" font-size="13" font-weight="600">routes table</text>
  <text class="fig-mono" x="610" y="94" text-anchor="middle" font-size="12">&quot;/count&quot; = fn</text>
  <text class="fig-mono" x="610" y="110" text-anchor="middle" font-size="12">&quot;/hello&quot; = fn</text>
  <rect class="fig-box" x="520" y="190" width="180" height="56" rx="6"/>
  <text x="610" y="214" text-anchor="middle" font-size="13" font-weight="600">registry</text>
  <text class="fig-mono" x="610" y="234" text-anchor="middle" font-size="12">[3] = routes</text>
  <line class="fig-line" x1="610" y1="190" x2="610" y2="123" marker-end="url(#11-http-handler-arrow)"/>
  <path class="fig-line" d="M 200 290 L 610 290 L 610 249" fill="none" marker-end="url(#11-http-handler-arrow)"/>
  <text class="fig-muted" x="405" y="282" text-anchor="middle" font-size="11">key 3</text>
  <line class="fig-line" x1="40" y1="390" x2="680" y2="390"/>
  <line class="fig-line" x1="40" y1="380" x2="40" y2="400"/>
  <text class="fig-muted" x="40" y="420" text-anchor="start" font-size="12">handler called</text>
  <line class="fig-line" x1="360" y1="380" x2="360" y2="400"/>
  <text class="fig-muted" x="360" y="420" text-anchor="middle" font-size="12">handler returns</text>
  <rect class="fig-accent" x="44" y="352" width="312" height="30" rx="6"/>
  <text x="200" y="372" text-anchor="middle" font-size="12">live = 1: res:write fills the buffer</text>
  <rect class="fig-box" x="364" y="352" width="316" height="30" rx="6" stroke-dasharray="4 3"/>
  <text x="522" y="372" text-anchor="middle" font-size="12">live = 0: res:write raises an error</text>
</svg>
