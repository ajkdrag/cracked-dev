<svg viewBox="0 0 720 350" role="img" aria-label="One thread with a 4 by 4 register tile. For each k it loads four values of A's column k and four values of B's row k from shared memory into registers, then does 16 multiply-adds into its 16 accumulators. Every loaded value is used four times.">
