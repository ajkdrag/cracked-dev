    <marker id="21-register-tile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-muted" x="178" y="38" text-anchor="end" font-size="12">Bs, row k</text>
  <rect class="fig-box" x="188" y="20" width="288" height="28" rx="3"/>
  <rect class="fig-accent" x="260" y="20" width="144" height="28" rx="3"/>
  <line class="fig-line" x1="278.0" y1="48" x2="278.0" y2="73" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="262" y="74" width="32" height="28" rx="3"/>
  <text class="fig-mono" x="278.0" y="93" text-anchor="middle" font-size="12">b0</text>
  <line class="fig-line" x1="314.0" y1="48" x2="314.0" y2="73" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="298" y="74" width="32" height="28" rx="3"/>
  <text class="fig-mono" x="314.0" y="93" text-anchor="middle" font-size="12">b1</text>
  <line class="fig-line" x1="350.0" y1="48" x2="350.0" y2="73" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="334" y="74" width="32" height="28" rx="3"/>
  <text class="fig-mono" x="350.0" y="93" text-anchor="middle" font-size="12">b2</text>
  <line class="fig-line" x1="386.0" y1="48" x2="386.0" y2="73" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="370" y="74" width="32" height="28" rx="3"/>
  <text class="fig-mono" x="386.0" y="93" text-anchor="middle" font-size="12">b3</text>
  <text class="fig-mono" x="416" y="93" font-size="12">regB</text>
  <text class="fig-muted" x="134" y="78" text-anchor="middle" font-size="12">As, column k</text>
  <rect class="fig-box" x="120" y="90" width="28" height="224" rx="3"/>
  <rect class="fig-accent" x="120" y="130" width="28" height="144" rx="3"/>
  <line class="fig-line" x1="148" y1="148.0" x2="208" y2="148.0" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="210" y="132" width="34" height="32" rx="3"/>
  <text class="fig-mono" x="227" y="152.0" text-anchor="middle" font-size="12">a0</text>
  <line class="fig-line" x1="148" y1="184.0" x2="208" y2="184.0" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="210" y="168" width="34" height="32" rx="3"/>
  <text class="fig-mono" x="227" y="188.0" text-anchor="middle" font-size="12">a1</text>
  <line class="fig-line" x1="148" y1="220.0" x2="208" y2="220.0" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="210" y="204" width="34" height="32" rx="3"/>
  <text class="fig-mono" x="227" y="224.0" text-anchor="middle" font-size="12">a2</text>
  <line class="fig-line" x1="148" y1="256.0" x2="208" y2="256.0" marker-end="url(#21-register-tile-arrow)"/>
  <rect class="fig-box" x="210" y="240" width="34" height="32" rx="3"/>
  <text class="fig-mono" x="227" y="260.0" text-anchor="middle" font-size="12">a3</text>
  <text class="fig-mono" x="227" y="292" text-anchor="middle" font-size="12">regA</text>
  <rect class="fig-accent" x="262" y="132" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="298" y="132" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="334" y="132" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="370" y="132" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="262" y="168" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="298" y="168" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="334" y="168" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="370" y="168" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="262" y="204" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="298" y="204" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="334" y="204" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="370" y="204" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="262" y="240" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="298" y="240" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="334" y="240" width="32" height="32" rx="3"/>
  <rect class="fig-accent" x="370" y="240" width="32" height="32" rx="3"/>
  <text class="fig-mono" x="332" y="292" text-anchor="middle" font-size="12">acc[4][4]</text>
  <text x="450" y="150" font-size="13" font-weight="600">for each k:</text>
  <text class="fig-mono" x="450" y="172" font-size="12">acc[i][j] += a[i] * b[j]</text>
  <text x="450" y="206" font-size="12" font-weight="600">this 4 x 4 tile:</text>
  <text class="fig-muted" x="450" y="224" font-size="12">8 loads, 16 multiply-adds</text>
  <text x="450" y="250" font-size="12" font-weight="600">an 8 x 8 tile:</text>
  <text class="fig-muted" x="450" y="268" font-size="12">16 loads, 64 multiply-adds</text>
  <text x="450" y="294" font-size="12" font-weight="600">kernel 3, one output:</text>
  <text class="fig-muted" x="450" y="312" font-size="12">2 loads, 1 multiply-add</text>
</svg>
