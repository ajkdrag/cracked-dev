<svg viewBox="0 0 720 300" role="img" aria-label="The input gradient of a 1D convolution with a kernel of width 3. Input x4 was used by outputs o2, o3 and o4, with weights w2, w1 and w0. So its gradient collects g2*w2 + g3*w1 + g4*w0, the weights anchored at j - k instead of j + k.">
  <defs>
    <marker id="22-conv-backward-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="118" y="62" text-anchor="end" font-size="13" font-weight="600">output grad</text>
  <rect class="fig-box" x="130" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="159.0" y="62" text-anchor="middle" font-size="13">g0</text>
  <rect class="fig-box" x="188" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="217.0" y="62" text-anchor="middle" font-size="13">g1</text>
  <rect class="fig-accent" x="246" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="275.0" y="62" text-anchor="middle" font-size="13">g2</text>
  <rect class="fig-accent" x="304" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="333.0" y="62" text-anchor="middle" font-size="13">g3</text>
  <rect class="fig-accent" x="362" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="391.0" y="62" text-anchor="middle" font-size="13">g4</text>
  <rect class="fig-box" x="420" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="449.0" y="62" text-anchor="middle" font-size="13">g5</text>
  <rect class="fig-box" x="478" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="507.0" y="62" text-anchor="middle" font-size="13">g6</text>
  <rect class="fig-box" x="536" y="40" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="565.0" y="62" text-anchor="middle" font-size="13">g7</text>
  <text x="118" y="222" text-anchor="end" font-size="13" font-weight="600">input grad</text>
  <rect class="fig-box" x="130" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="159.0" y="222" text-anchor="middle" font-size="13">dx0</text>
  <rect class="fig-box" x="188" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="217.0" y="222" text-anchor="middle" font-size="13">dx1</text>
  <rect class="fig-box" x="246" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="275.0" y="222" text-anchor="middle" font-size="13">dx2</text>
  <rect class="fig-box" x="304" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="333.0" y="222" text-anchor="middle" font-size="13">dx3</text>
  <rect class="fig-accent" x="362" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="391.0" y="222" text-anchor="middle" font-size="13">dx4</text>
  <rect class="fig-box" x="420" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="449.0" y="222" text-anchor="middle" font-size="13">dx5</text>
  <rect class="fig-box" x="478" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="507.0" y="222" text-anchor="middle" font-size="13">dx6</text>
  <rect class="fig-box" x="536" y="200" width="58" height="34" rx="0"/>
  <text class="fig-mono" x="565.0" y="222" text-anchor="middle" font-size="13">dx7</text>
  <line class="fig-accent-line" x1="275.0" y1="76" x2="391.0" y2="198" marker-end="url(#22-conv-backward-arrow)"/>
  <text class="fig-mono" x="307.62295081967216" y="108" font-size="12">w2</text>
  <line class="fig-accent-line" x1="333.0" y1="76" x2="391.0" y2="198" marker-end="url(#22-conv-backward-arrow)"/>
  <text class="fig-mono" x="352.3114754098361" y="108" font-size="12">w1</text>
  <line class="fig-accent-line" x1="391.0" y1="76" x2="391.0" y2="198" marker-end="url(#22-conv-backward-arrow)"/>
  <text class="fig-mono" x="397.0" y="108" font-size="12">w0</text>
  <text class="fig-muted" x="434" y="140" font-size="12">o_t used x_(t+k) with weight w_k,</text>
  <text class="fig-muted" x="434" y="158" font-size="12">so x_j sends back to o_(j-k)</text>
  <text class="fig-mono" x="360" y="266" text-anchor="middle" font-size="12" xml:space="preserve">dx4 = g2*w2 + g3*w1 + g4*w0      dx_j = sum over k of g_(j-k) * w_k</text>
</svg>
