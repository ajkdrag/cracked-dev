<svg viewBox="0 0 720 300" role="img" aria-label="The platform layer calls SDL3 and owns the window, input, time and memory. Each frame it fills GameInput and calls the game with GameInput, GameMemory and the frame buffer. The game writes pixels into the frame buffer and the platform presents it">
  <defs>
    <marker id="13-platform-game-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="40" width="180" height="220" rx="6"/>
  <text x="110" y="66" text-anchor="middle" font-size="14" font-weight="600">platform layer</text>
  <text class="fig-mono fig-muted" x="110" y="84" text-anchor="middle" font-size="12">platform_sdl.c</text>
  <text x="110" y="116" text-anchor="middle" font-size="13">opens the window</text>
  <text x="110" y="138" text-anchor="middle" font-size="13">reads keys and mouse</text>
  <text x="110" y="160" text-anchor="middle" font-size="13">keeps time</text>
  <text x="110" y="182" text-anchor="middle" font-size="13">maps memory</text>
  <text x="110" y="204" text-anchor="middle" font-size="13">loads the game</text>
  <text x="110" y="226" text-anchor="middle" font-size="13">presents the frame</text>
  <text class="fig-muted" x="110" y="285" text-anchor="middle" font-size="12">calls SDL3</text>
  <rect class="fig-box" x="280" y="60" width="150" height="46" rx="6"/>
  <text class="fig-mono" x="355" y="80" text-anchor="middle" font-size="13">GameInput</text>
  <text class="fig-muted" x="355" y="97" text-anchor="middle" font-size="12">dt, mouse, buttons</text>
  <rect class="fig-box" x="280" y="130" width="150" height="46" rx="6"/>
  <text class="fig-mono" x="355" y="150" text-anchor="middle" font-size="13">GameMemory</text>
  <text class="fig-muted" x="355" y="167" text-anchor="middle" font-size="12">permanent, transient</text>
  <rect class="fig-box" x="280" y="200" width="150" height="46" rx="6"/>
  <text class="fig-mono" x="355" y="220" text-anchor="middle" font-size="13">Framebuffer</text>
  <text class="fig-muted" x="355" y="237" text-anchor="middle" font-size="12">pixels, pitch</text>
  <rect class="fig-accent" x="510" y="40" width="190" height="220" rx="6"/>
  <text x="605" y="66" text-anchor="middle" font-size="14" font-weight="600">game</text>
  <text class="fig-mono fig-muted" x="605" y="84" text-anchor="middle" font-size="12">game.so</text>
  <text class="fig-mono" x="605" y="116" text-anchor="middle" font-size="11">game_update_and_render</text>
  <text x="605" y="148" text-anchor="middle" font-size="13">updates its state</text>
  <text x="605" y="170" text-anchor="middle" font-size="13">draws every pixel</text>
  <text x="605" y="192" text-anchor="middle" font-size="13">never calls the OS</text>
  <line class="fig-line" x1="200" y1="83" x2="278" y2="83" marker-end="url(#13-platform-game-arrow)"/>
  <text class="fig-muted" x="239" y="75" text-anchor="middle" font-size="12">fills</text>
  <line class="fig-line" x1="200" y1="153" x2="278" y2="153" marker-end="url(#13-platform-game-arrow)"/>
  <text class="fig-muted" x="239" y="145" text-anchor="middle" font-size="12">maps</text>
  <line class="fig-line" x1="278" y1="223" x2="202" y2="223" marker-end="url(#13-platform-game-arrow)"/>
  <text class="fig-muted" x="239" y="215" text-anchor="middle" font-size="12">presents</text>
  <line class="fig-line" x1="430" y1="83" x2="508" y2="83" marker-end="url(#13-platform-game-arrow)"/>
  <text class="fig-muted" x="469" y="75" text-anchor="middle" font-size="12">reads</text>
  <line class="fig-line" x1="430" y1="153" x2="508" y2="153" marker-end="url(#13-platform-game-arrow)"/>
  <line class="fig-line" x1="508" y1="153" x2="432" y2="153" marker-end="url(#13-platform-game-arrow)"/>
  <text class="fig-muted" x="469" y="145" text-anchor="middle" font-size="12">keeps state</text>
  <line class="fig-accent-line" x1="508" y1="223" x2="432" y2="223" marker-end="url(#13-platform-game-arrow)"/>
  <text class="fig-accent-text" x="469" y="215" text-anchor="middle" font-size="12">writes</text>
  <text class="fig-muted" x="355" y="30" text-anchor="middle" font-size="12">passed as arguments, once per frame</text>
</svg>
