<svg viewBox="0 0 720 250" role="img" aria-label="Ticks every 1/120 s and frames at uneven times. At each frame the accumulator holds the time since the last tick, and the frame draws the state alpha of the way from the previous tick to the current one.">
  <defs>
    <marker id="14-fixed-step-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="54" font-size="13" font-weight="600">ticks</text>
  <line class="fig-line" x1="80" y1="50" x2="700" y2="50" marker-end="url(#14-fixed-step-arrow)"/>
  <line class="fig-line" x1="100" y1="42" x2="100" y2="58"/>
  <text class="fig-muted" x="100" y="36" text-anchor="middle" font-size="12">t0</text>
  <line class="fig-line" x1="180" y1="42" x2="180" y2="58"/>
  <text class="fig-muted" x="180" y="36" text-anchor="middle" font-size="12">t1</text>
  <line class="fig-line" x1="260" y1="42" x2="260" y2="58"/>
  <text class="fig-muted" x="260" y="36" text-anchor="middle" font-size="12">t2</text>
  <line class="fig-line" x1="340" y1="42" x2="340" y2="58"/>
  <text class="fig-muted" x="340" y="36" text-anchor="middle" font-size="12">t3</text>
  <line class="fig-line" x1="420" y1="42" x2="420" y2="58"/>
  <text class="fig-muted" x="420" y="36" text-anchor="middle" font-size="12">t4</text>
  <line class="fig-line" x1="500" y1="42" x2="500" y2="58"/>
  <text class="fig-muted" x="500" y="36" text-anchor="middle" font-size="12">t5</text>
  <line class="fig-line" x1="580" y1="42" x2="580" y2="58"/>
  <text class="fig-muted" x="580" y="36" text-anchor="middle" font-size="12">t6</text>
  <line class="fig-line" x1="660" y1="42" x2="660" y2="58"/>
  <text class="fig-muted" x="660" y="36" text-anchor="middle" font-size="12">t7</text>
  <text x="20" y="124" font-size="13" font-weight="600">frames</text>
  <line class="fig-line" x1="80" y1="120" x2="700" y2="120" marker-end="url(#14-fixed-step-arrow)"/>
  <circle class="fig-accent-fill" cx="150" cy="120" r="5"/>
  <text x="150" y="142" text-anchor="middle" font-size="12">frame 1</text>
  <circle class="fig-accent-fill" cx="335" cy="120" r="5"/>
  <text x="335" y="142" text-anchor="middle" font-size="12">frame 2</text>
  <circle class="fig-accent-fill" cx="470" cy="120" r="5"/>
  <text x="470" y="142" text-anchor="middle" font-size="12">frame 3</text>
  <circle class="fig-accent-fill" cx="620" cy="120" r="5"/>
  <text x="620" y="142" text-anchor="middle" font-size="12">frame 4</text>
  <line class="fig-line" x1="470" y1="112" x2="470" y2="58" stroke-dasharray="4 4"/>
  <rect class="fig-accent" x="420" y="64" width="50" height="18" rx="3"/>
  <text class="fig-accent-text" x="445" y="96" text-anchor="middle" font-size="12">accumulator</text>
  <text class="fig-muted" x="20" y="186" font-size="12">at frame 3: the last tick is t4, and 5/8 of a tick has passed since then</text>
  <text class="fig-mono" x="20" y="206" font-size="12">alpha = accumulator / tick = 0.625</text>
  <text class="fig-muted" x="20" y="228" font-size="12">draw lerp(prev_position, position, alpha): 0.625 of the way from t3's state to t4's</text>
</svg>
