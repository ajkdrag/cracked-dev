<svg viewBox="0 0 720 280" role="img" aria-label="make turns the source tree and .config into four files. QEMU boots bzImage, gdb reads vmlinux, your module builds read Module.symvers, and gen_init_cpio packs the initramfs.">
  <defs>
    <marker id="16-build-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="112" width="130" height="64" rx="6"/>
  <text class="fig-mono" x="85" y="138" text-anchor="middle" font-size="13">make</text>
  <text class="fig-muted" x="85" y="158" text-anchor="middle" font-size="12">source + .config</text>

  <line class="fig-line" x1="150" y1="144" x2="180" y2="144"/>
  <line class="fig-line" x1="180" y1="52" x2="180" y2="236"/>
  <text class="fig-muted" x="180" y="30" text-anchor="middle" font-size="12">writes</text>
  <line class="fig-line" x1="180" y1="52" x2="208" y2="52" marker-end="url(#16-build-arrow)"/>
  <line class="fig-line" x1="180" y1="112" x2="208" y2="112" marker-end="url(#16-build-arrow)"/>
  <line class="fig-line" x1="180" y1="174" x2="208" y2="174" marker-end="url(#16-build-arrow)"/>
  <line class="fig-line" x1="180" y1="236" x2="208" y2="236" marker-end="url(#16-build-arrow)"/>

  <rect class="fig-box" x="210" y="30" width="190" height="44" rx="6"/>
  <text class="fig-mono" x="305" y="57" text-anchor="middle" font-size="12">arch/x86/boot/bzImage</text>
  <rect class="fig-box" x="210" y="90" width="190" height="44" rx="6"/>
  <text class="fig-mono" x="305" y="117" text-anchor="middle" font-size="12">vmlinux</text>
  <rect class="fig-box" x="210" y="152" width="190" height="44" rx="6"/>
  <text class="fig-mono" x="305" y="179" text-anchor="middle" font-size="12">Module.symvers</text>
  <rect class="fig-box" x="210" y="214" width="190" height="44" rx="6"/>
  <text class="fig-mono" x="305" y="241" text-anchor="middle" font-size="12">usr/gen_init_cpio</text>

  <line class="fig-line" x1="400" y1="52" x2="498" y2="52" marker-end="url(#16-build-arrow)"/>
  <text class="fig-muted" x="449" y="44" text-anchor="middle" font-size="12">boots</text>
  <line class="fig-line" x1="400" y1="112" x2="498" y2="112" marker-end="url(#16-build-arrow)"/>
  <text class="fig-muted" x="449" y="104" text-anchor="middle" font-size="12">reads</text>
  <line class="fig-line" x1="400" y1="174" x2="498" y2="174" marker-end="url(#16-build-arrow)"/>
  <text class="fig-muted" x="449" y="166" text-anchor="middle" font-size="12">reads</text>
  <line class="fig-line" x1="400" y1="236" x2="498" y2="236" marker-end="url(#16-build-arrow)"/>
  <text class="fig-muted" x="449" y="228" text-anchor="middle" font-size="12">packs</text>

  <rect class="fig-box" x="500" y="30" width="200" height="44" rx="6"/>
  <text x="600" y="50" text-anchor="middle" font-size="13" font-weight="600">QEMU</text>
  <text class="fig-muted" x="600" y="66" text-anchor="middle" font-size="12">runs your kernel</text>
  <rect class="fig-box" x="500" y="90" width="200" height="44" rx="6"/>
  <text x="600" y="110" text-anchor="middle" font-size="13" font-weight="600">gdb</text>
  <text class="fig-muted" x="600" y="126" text-anchor="middle" font-size="12">symbols and source lines</text>
  <rect class="fig-box" x="500" y="152" width="200" height="44" rx="6"/>
  <text x="600" y="172" text-anchor="middle" font-size="13" font-weight="600">your module build</text>
  <text class="fig-muted" x="600" y="188" text-anchor="middle" font-size="12">functions it may call</text>
  <rect class="fig-box" x="500" y="214" width="200" height="44" rx="6"/>
  <text x="600" y="234" text-anchor="middle" font-size="13" font-weight="600">initramfs.cpio</text>
  <text class="fig-muted" x="600" y="250" text-anchor="middle" font-size="12">the guest's first files</text>
</svg>
