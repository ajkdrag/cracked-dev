<svg viewBox="0 0 720 256" role="img" aria-label="Two comparisons of a candidate&#x27;s log with a voter&#x27;s. In (a) the candidate&#x27;s last entry has a higher term, so its shorter log is more up-to-date and it gets the vote. In (b) the last terms are equal and the voter&#x27;s log is longer, so the voter refuses.">
  <defs>
    <marker id="19-uptodate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="13" font-weight="600">(a) last terms differ</text>
  <text x="40" y="80" font-size="13">candidate</text>
  <rect class="fig-box" x="130" y="60" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="147" y="79" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-box" x="170" y="60" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="187" y="79" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-accent" x="210" y="60" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="227" y="79" text-anchor="middle" font-size="12">3</text>
  <text x="40" y="126" font-size="13">voter</text>
  <rect class="fig-box" x="130" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="147" y="125" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-box" x="170" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="187" y="125" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-box" x="210" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="227" y="125" text-anchor="middle" font-size="12">2</text>
  <rect class="fig-box" x="250" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="267" y="125" text-anchor="middle" font-size="12">2</text>
  <rect class="fig-accent" x="290" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="307" y="125" text-anchor="middle" font-size="12">2</text>
  <text class="fig-muted" x="40" y="168" font-size="12">last term 3 beats 2:</text>
  <text class="fig-accent-text" x="40" y="186" font-size="12" font-weight="600">vote granted</text>
  <text x="390" y="40" font-size="13" font-weight="600">(b) last terms equal</text>
  <text x="390" y="80" font-size="13">candidate</text>
  <rect class="fig-box" x="480" y="60" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="497" y="79" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-box" x="520" y="60" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="537" y="79" text-anchor="middle" font-size="12">2</text>
  <rect class="fig-accent" x="560" y="60" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="577" y="79" text-anchor="middle" font-size="12">3</text>
  <text x="390" y="126" font-size="13">voter</text>
  <rect class="fig-box" x="480" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="497" y="125" text-anchor="middle" font-size="12">1</text>
  <rect class="fig-box" x="520" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="537" y="125" text-anchor="middle" font-size="12">2</text>
  <rect class="fig-box" x="560" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="577" y="125" text-anchor="middle" font-size="12">3</text>
  <rect class="fig-accent" x="600" y="106" width="34" height="28" rx="3"/>
  <text class="fig-mono" x="617" y="125" text-anchor="middle" font-size="12">3</text>
  <text class="fig-muted" x="390" y="168" font-size="12">same last term, voter longer:</text>
  <text class="fig-accent-text" x="390" y="186" font-size="12" font-weight="600">vote refused</text>
  <text class="fig-muted" x="360" y="240" text-anchor="middle" font-size="12">numbers in boxes: the term of each entry, colored: the last entry</text>
</svg>
