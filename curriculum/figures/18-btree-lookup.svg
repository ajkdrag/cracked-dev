<svg viewBox="0 0 720 230" role="img" aria-label="A lookup of key 55 in a two-level B+ tree: the root holds separators 40 and 80, 55 lies between them, so the lookup follows the middle child to the leaf that holds 40, 50, 55 and 60. The leaves are linked left to right">
