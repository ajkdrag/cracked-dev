<svg viewBox="0 0 720 420" role="img" aria-label="A CUDA call goes from your program through the CUDA runtime and libcuda.so to /dev/dxg, and from there over VMBus to the graphics kernel in Windows, the NVIDIA driver and the GPU. libcuda.so itself is part of the Windows driver, mounted into Ubuntu.">
  <defs>
    <marker id="21-wsl-gpu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="330" height="316" rx="6" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="40" y="44" font-size="13">Ubuntu under WSL2</text>
  <rect class="fig-box" x="450" y="156" width="250" height="244" rx="6" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="470" y="180" font-size="13">Windows</text>
  <rect class="fig-box" x="40" y="56" width="290" height="46" rx="6"/>
  <text x="185.0" y="76.0" text-anchor="middle" font-size="14" font-weight="600">your program</text>
  <text class="fig-muted" x="185.0" y="93.0" text-anchor="middle" font-size="12">calls cudaMalloc, launches kernels</text>
  <rect class="fig-box" x="40" y="126" width="290" height="46" rx="6"/>
  <text x="185.0" y="146.0" text-anchor="middle" font-size="14" font-weight="600">CUDA runtime</text>
  <text class="fig-muted" x="185.0" y="163.0" text-anchor="middle" font-size="12">from the toolkit you install with apt</text>
  <rect class="fig-box" x="40" y="196" width="290" height="46" rx="6"/>
  <text class="fig-mono" x="185.0" y="216.0" text-anchor="middle" font-size="14">libcuda.so</text>
  <text class="fig-muted" x="185.0" y="233.0" text-anchor="middle" font-size="12">in /usr/lib/wsl/lib</text>
  <rect class="fig-accent" x="40" y="266" width="290" height="46" rx="6"/>
  <text class="fig-mono" x="185.0" y="286.0" text-anchor="middle" font-size="14">/dev/dxg</text>
  <text class="fig-muted" x="185.0" y="303.0" text-anchor="middle" font-size="12">dxgkrnl, a stand-in device</text>
  <line class="fig-line" x1="185" y1="102" x2="185" y2="125" marker-end="url(#21-wsl-gpu-arrow)"/>
  <text class="fig-muted" x="197" y="118.0" font-size="12">calls</text>
  <line class="fig-line" x1="185" y1="172" x2="185" y2="195" marker-end="url(#21-wsl-gpu-arrow)"/>
  <text class="fig-muted" x="197" y="188.0" font-size="12">calls</text>
  <line class="fig-line" x1="185" y1="242" x2="185" y2="265" marker-end="url(#21-wsl-gpu-arrow)"/>
  <text class="fig-muted" x="197" y="258.0" font-size="12">ioctl</text>
  <rect class="fig-box" x="465" y="196" width="220" height="46" rx="6"/>
  <text x="575.0" y="216.0" text-anchor="middle" font-size="14" font-weight="600">NVIDIA user files</text>
  <text class="fig-muted" x="575.0" y="233.0" text-anchor="middle" font-size="12">libcuda.so, nvidia-smi</text>
  <rect class="fig-box" x="465" y="266" width="220" height="46" rx="6"/>
  <text x="575.0" y="286.0" text-anchor="middle" font-size="14" font-weight="600">graphics kernel</text>
  <text class="fig-muted" x="575.0" y="303.0" text-anchor="middle" font-size="12">dxgkrnl on Windows</text>
  <rect class="fig-box" x="465" y="340" width="100" height="46" rx="6"/>
  <text x="515.0" y="360.0" text-anchor="middle" font-size="14" font-weight="600">NVIDIA</text>
  <text class="fig-muted" x="515.0" y="377.0" text-anchor="middle" font-size="12">kernel driver</text>
  <rect class="fig-box" x="585" y="340" width="100" height="46" rx="6"/>
  <text x="635.0" y="368.0" text-anchor="middle" font-size="14" font-weight="600">GPU</text>
  <line class="fig-line" x1="465" y1="219" x2="331" y2="219" marker-end="url(#21-wsl-gpu-arrow)" stroke-dasharray="5 4"/>
  <text class="fig-muted" x="400" y="211" text-anchor="middle" font-size="12">mounted</text>
  <line class="fig-accent-line" x1="330" y1="289" x2="464" y2="289" marker-end="url(#21-wsl-gpu-arrow)" stroke-width="1.5"/>
  <text class="fig-accent-text" x="400" y="281" text-anchor="middle" font-size="12">VMBus</text>
  <line class="fig-line" x1="515" y1="312" x2="515" y2="339" marker-end="url(#21-wsl-gpu-arrow)"/>
  <line class="fig-line" x1="565" y1="363" x2="584" y2="363" marker-end="url(#21-wsl-gpu-arrow)"/>
  <text class="fig-muted" x="40" y="362" font-size="12">Nothing NVIDIA runs in</text>
  <text class="fig-muted" x="40" y="380" font-size="12">the Linux kernel.</text>
</svg>
