<svg viewBox="0 0 720 400" role="img" aria-label="Your kernels under MiniTorch. NativeOps answers every call the backend makes. An add or multiply of two packed tensors of equal shape goes through ctypes to your AVX2 library. The fused softmax goes through PyTorch to your chapter 21 kernel on the GPU. Everything else falls back to the Numba code of FastOps.">
  <defs>
    <marker id="22-native-backend-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="210" y="20" width="300" height="48" rx="6"/>
  <text x="360.0" y="39.0" text-anchor="middle" font-size="13" font-weight="600">your network</text>
  <text class="fig-mono" x="360.0" y="58.0" text-anchor="middle" font-size="12">a + b, a * b, fused_softmax(h)</text>
  <line class="fig-line" x1="360" y1="68" x2="360" y2="90" marker-end="url(#22-native-backend-arrow)"/>
  <rect class="fig-box" x="210" y="92" width="300" height="48" rx="6"/>
  <text x="360.0" y="111.0" text-anchor="middle" font-size="13" font-weight="600">TensorBackend(NativeOps)</text>
  <text class="fig-muted" x="360.0" y="130.0" text-anchor="middle" font-size="12">picks a kernel per call</text>
  <line class="fig-line" x1="300" y1="140" x2="110" y2="176" marker-end="url(#22-native-backend-arrow)"/>
  <line class="fig-line" x1="360" y1="140" x2="360" y2="176" marker-end="url(#22-native-backend-arrow)"/>
  <line class="fig-line" x1="420" y1="140" x2="610" y2="176" marker-end="url(#22-native-backend-arrow)"/>
  <text class="fig-muted" x="96" y="148" text-anchor="middle" font-size="12">add, mul, both packed,</text>
  <text class="fig-muted" x="96" y="164" text-anchor="middle" font-size="12">same shape</text>
  <text class="fig-muted" x="392" y="166" font-size="12">anything else</text>
  <text class="fig-mono" x="560" y="150" text-anchor="middle" font-size="12">fused_softmax</text>
  <rect class="fig-box" x="20" y="178" width="180" height="48" rx="6"/>
  <text x="110.0" y="197.0" text-anchor="middle" font-size="13" font-weight="600">ctypes</text>
  <text class="fig-muted" x="110.0" y="216.0" text-anchor="middle" font-size="12">pointers and a length</text>
  <line class="fig-line" x1="110" y1="226" x2="110" y2="250" marker-end="url(#22-native-backend-arrow)"/>
  <rect class="fig-accent" x="20" y="252" width="180" height="64" rx="6"/>
  <text x="110.0" y="270.0" text-anchor="middle" font-size="13" font-weight="600">libmtk.so</text>
  <text class="fig-muted" x="110.0" y="289.0" text-anchor="middle" font-size="12">mt_add_f64: AVX2</text>
  <text class="fig-muted" x="110.0" y="306.0" text-anchor="middle" font-size="12">your chapter 07 code</text>
  <rect class="fig-box" x="270" y="178" width="180" height="64" rx="6"/>
  <text x="360.0" y="196.0" text-anchor="middle" font-size="13" font-weight="600">FastOps</text>
  <text class="fig-muted" x="360.0" y="215.0" text-anchor="middle" font-size="12">Numba, prange</text>
  <text class="fig-muted" x="360.0" y="232.0" text-anchor="middle" font-size="12">step 5</text>
  <rect class="fig-box" x="520" y="178" width="180" height="48" rx="6"/>
  <text x="610.0" y="197.0" text-anchor="middle" font-size="13" font-weight="600">float64 to float32</text>
  <text class="fig-muted" x="610.0" y="216.0" text-anchor="middle" font-size="12">copy to the GPU</text>
  <line class="fig-line" x1="610" y1="226" x2="610" y2="250" marker-end="url(#22-native-backend-arrow)"/>
  <rect class="fig-accent" x="520" y="252" width="180" height="64" rx="6"/>
  <text x="610.0" y="270.0" text-anchor="middle" font-size="13" font-weight="600">softmax kernel</text>
  <text class="fig-muted" x="610.0" y="289.0" text-anchor="middle" font-size="12">load_inline module</text>
  <text class="fig-muted" x="610.0" y="306.0" text-anchor="middle" font-size="12">your chapter 21 code</text>
  <line class="fig-line" x1="610" y1="316" x2="610" y2="340" marker-end="url(#22-native-backend-arrow)"/>
  <rect class="fig-box" x="520" y="342" width="180" height="48" rx="6"/>
  <text x="610.0" y="361.0" text-anchor="middle" font-size="13" font-weight="600">copy back</text>
  <text class="fig-muted" x="610.0" y="380.0" text-anchor="middle" font-size="12">float32 to float64</text>
  <text class="fig-muted" x="110" y="344" text-anchor="middle" font-size="12">same storage, no copy</text>
  <text class="fig-muted" x="360" y="272" text-anchor="middle" font-size="12">broadcast, strided,</text>
  <text class="fig-muted" x="360" y="288" text-anchor="middle" font-size="12">map, reduce, matmul</text>
</svg>
