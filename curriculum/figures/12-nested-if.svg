<svg viewBox="0 0 720 440" role="img" aria-label="The control flow graph of an if whose then-expression is another if. Generating the then-expression creates the blocks then4, else and ifcont, so the outer merge block ifcont6 is reached from ifcont, not from then, and its phi names ifcont.">
  <defs>
    <marker id="12-nested-if-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="200" y="20" width="320" height="48" rx="6"/>
  <text class="fig-mono" x="212" y="39" font-size="12" font-weight="600">entry:</text>
  <text class="fig-mono" x="228" y="58" font-size="11">br i1 %ifcond, label %then, label %else5</text>

  <rect class="fig-line" x="24" y="92" width="380" height="234" rx="6" stroke-dasharray="4 4"/>
  <text class="fig-muted" x="24" y="84" font-size="12">emitted for the then-expression</text>

  <rect class="fig-box" x="60" y="104" width="310" height="48" rx="6"/>
  <text class="fig-mono" x="72" y="123" font-size="12" font-weight="600">then:</text>
  <text class="fig-mono" x="88" y="142" font-size="11">br i1 %ifcond3, label %then4, label %else</text>

  <rect class="fig-box" x="40" y="180" width="160" height="48" rx="6"/>
  <text class="fig-mono" x="52" y="199" font-size="12" font-weight="600">then4:</text>
  <text class="fig-mono" x="68" y="218" font-size="11">br label %ifcont</text>

  <rect class="fig-box" x="230" y="180" width="160" height="48" rx="6"/>
  <text class="fig-mono" x="242" y="199" font-size="12" font-weight="600">else:</text>
  <text class="fig-mono" x="258" y="218" font-size="11">br label %ifcont</text>

  <rect class="fig-accent" x="40" y="252" width="350" height="62" rx="6"/>
  <text class="fig-mono" x="52" y="271" font-size="12" font-weight="600">ifcont:</text>
  <text class="fig-mono" x="68" y="288" font-size="11">%iftmp = phi double ...</text>
  <text class="fig-mono" x="68" y="305" font-size="11">br label %ifcont6</text>

  <rect class="fig-box" x="500" y="180" width="180" height="48" rx="6"/>
  <text class="fig-mono" x="512" y="199" font-size="12" font-weight="600">else5:</text>
  <text class="fig-mono" x="528" y="218" font-size="11">br label %ifcont6</text>

  <rect class="fig-box" x="130" y="360" width="500" height="64" rx="6"/>
  <text class="fig-mono" x="142" y="380" font-size="12" font-weight="600">ifcont6:</text>
  <text class="fig-mono" x="150" y="400" font-size="11">%iftmp7 = phi double <tspan class="fig-accent-fill">[ %iftmp, %ifcont ]</tspan>, [ 3.000000e+00, %else5 ]</text>
  <text class="fig-mono" x="150" y="417" font-size="11">ret double %iftmp7</text>

  <line class="fig-line" x1="300" y1="68" x2="240" y2="102" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-line" x1="460" y1="68" x2="580" y2="178" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-line" x1="160" y1="152" x2="120" y2="178" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-line" x1="270" y1="152" x2="310" y2="178" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-line" x1="120" y1="228" x2="120" y2="250" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-line" x1="310" y1="228" x2="310" y2="250" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-accent-line" x1="215" y1="314" x2="300" y2="358" marker-end="url(#12-nested-if-arrow)"/>
  <line class="fig-line" x1="590" y1="228" x2="520" y2="358" marker-end="url(#12-nested-if-arrow)"/>
  <text class="fig-accent-text" x="440" y="290" font-size="12">GetInsertBlock() is ifcont,</text>
  <text class="fig-accent-text" x="440" y="308" font-size="12">not then</text>
</svg>
