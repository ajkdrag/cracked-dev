<svg viewBox="0 0 720 260" role="img" aria-label="The lit frame has three render passes. The shadow pass writes the shadow map, the main pass samples it and writes the offscreen scene color, and the present pass samples the scene color and writes the letterboxed picture into the swapchain.">
  <defs>
    <marker id="14-three-passes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="40" width="180" height="56" rx="6"/>
  <text x="110.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600">1 shadow pass</text>
  <text class="fig-muted" x="110.0" y="82.0" text-anchor="middle" font-size="12">from the light</text>
  <rect class="fig-box" x="270" y="40" width="180" height="56" rx="6"/>
  <text x="360.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600">2 main pass</text>
  <text class="fig-muted" x="360.0" y="82.0" text-anchor="middle" font-size="12">from the camera</text>
  <rect class="fig-box" x="520" y="40" width="180" height="56" rx="6"/>
  <text x="610.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600">3 present pass</text>
  <text class="fig-muted" x="610.0" y="82.0" text-anchor="middle" font-size="12">letterbox</text>
  <rect class="fig-accent" x="20" y="170" width="180" height="56" rx="6"/>
  <text x="110.0" y="194.0" text-anchor="middle" font-size="13" font-weight="600">shadow map</text>
  <text class="fig-muted" x="110.0" y="212.0" text-anchor="middle" font-size="12">2048 x 2048 D32_FLOAT</text>
  <rect class="fig-box" x="270" y="170" width="180" height="56" rx="6"/>
  <text x="360.0" y="194.0" text-anchor="middle" font-size="13" font-weight="600">scene color</text>
  <text class="fig-muted" x="360.0" y="212.0" text-anchor="middle" font-size="12">960 x 540, offscreen</text>
  <rect class="fig-box" x="520" y="170" width="180" height="56" rx="6"/>
  <text x="610.0" y="194.0" text-anchor="middle" font-size="13" font-weight="600">swapchain</text>
  <text class="fig-muted" x="610.0" y="212.0" text-anchor="middle" font-size="12">the window</text>
  <line class="fig-line" x1="110" y1="96" x2="110" y2="168" marker-end="url(#14-three-passes-arrow)"/>
  <text class="fig-muted" x="118" y="136" font-size="12">writes depth</text>
  <line class="fig-line" x1="200" y1="180" x2="290" y2="98" marker-end="url(#14-three-passes-arrow)"/>
  <text class="fig-muted" x="250" y="154" font-size="12">sampled by</text>
  <line class="fig-line" x1="360" y1="96" x2="360" y2="168" marker-end="url(#14-three-passes-arrow)"/>
  <text class="fig-muted" x="368" y="136" font-size="12">writes</text>
  <line class="fig-line" x1="450" y1="180" x2="540" y2="98" marker-end="url(#14-three-passes-arrow)"/>
  <text class="fig-muted" x="500" y="154" font-size="12">sampled by</text>
  <line class="fig-line" x1="610" y1="96" x2="610" y2="168" marker-end="url(#14-three-passes-arrow)"/>
  <text class="fig-muted" x="618" y="136" font-size="12">writes</text>
</svg>
