<svg viewBox="0 0 720 250" role="img" aria-label="The mixer: three voices, each with a position in its sound, a volume and a pan, are scaled and added sample by sample into the output buffer, clamped to [-1, 1], and put into SDL's audio stream, which feeds the device.">
  <defs>
    <marker id="14-mixer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="30" width="140" height="52" rx="6"/>
  <text x="90.0" y="52.0" text-anchor="middle" font-size="13" font-weight="600">voice: jump</text>
  <text class="fig-muted" x="90.0" y="70.0" text-anchor="middle" font-size="12">vol 0.8, pan 0</text>
  <line class="fig-line" x1="160" y1="56" x2="228" y2="106" marker-end="url(#14-mixer-arrow)"/>
  <rect class="fig-box" x="20" y="96" width="140" height="52" rx="6"/>
  <text x="90.0" y="118.0" text-anchor="middle" font-size="13" font-weight="600">voice: shot</text>
  <text class="fig-muted" x="90.0" y="136.0" text-anchor="middle" font-size="12">vol 1.0, pan -0.3</text>
  <line class="fig-line" x1="160" y1="122" x2="228" y2="122" marker-end="url(#14-mixer-arrow)"/>
  <rect class="fig-box" x="20" y="162" width="140" height="52" rx="6"/>
  <text x="90.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600">voice: music</text>
  <text class="fig-muted" x="90.0" y="202.0" text-anchor="middle" font-size="12">vol 0.4, loops</text>
  <line class="fig-line" x1="160" y1="188" x2="228" y2="138" marker-end="url(#14-mixer-arrow)"/>
  <rect class="fig-accent" x="230" y="90" width="120" height="64" rx="6"/>
  <text x="290.0" y="118.0" text-anchor="middle" font-size="13" font-weight="600">mix</text>
  <text class="fig-muted" x="290.0" y="136.0" text-anchor="middle" font-size="12">scale and add</text>
  <rect class="fig-box" x="380" y="90" width="120" height="64" rx="6"/>
  <text x="440.0" y="118.0" text-anchor="middle" font-size="13" font-weight="600">out buffer</text>
  <text class="fig-muted" x="440.0" y="136.0" text-anchor="middle" font-size="12">L R L R ... floats</text>
  <line class="fig-line" x1="350" y1="122" x2="378" y2="122" marker-end="url(#14-mixer-arrow)"/>
  <rect class="fig-box" x="530" y="30" width="170" height="52" rx="6"/>
  <text x="615.0" y="52.0" text-anchor="middle" font-size="13" font-weight="600">clamp</text>
  <text class="fig-muted" x="615.0" y="70.0" text-anchor="middle" font-size="12">to [-1, 1]</text>
  <path class="fig-line" d="M500 110 L515 110 L515 56 L528 56" marker-end="url(#14-mixer-arrow)"/>
  <rect class="fig-box" x="530" y="110" width="170" height="52" rx="6"/>
  <text x="615.0" y="132.0" text-anchor="middle" font-size="13" font-weight="600">SDL audio stream</text>
  <text class="fig-muted" x="615.0" y="150.0" text-anchor="middle" font-size="12">about 1.5 frames queued</text>
  <line class="fig-line" x1="615" y1="82" x2="615" y2="108" marker-end="url(#14-mixer-arrow)"/>
  <rect class="fig-box" x="530" y="186" width="170" height="44" rx="6"/>
  <text x="615.0" y="213.0" text-anchor="middle" font-size="13" font-weight="600">audio device</text>
  <line class="fig-line" x1="615" y1="162" x2="615" y2="184" marker-end="url(#14-mixer-arrow)"/>
  <text class="fig-mono" x="255" y="214" text-anchor="middle" font-size="12">game_get_sound_samples</text>
  <text class="fig-muted" x="255" y="232" text-anchor="middle" font-size="12">the platform calls it every frame</text>
</svg>
