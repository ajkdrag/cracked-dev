<svg viewBox="0 0 720 300" role="img" aria-label="Any number of shared borrows may read text at once. One mutable borrow may write it while no other borrow is live. A shared borrow still in use when a mutable borrow starts is rejected by the borrow checker.">
  <defs>
    <marker id="10-borrows-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- panel 1: shared -->
  <text x="130" y="34" text-anchor="middle" font-size="14" font-weight="600">many shared borrows</text>
  <text x="40" y="58" font-size="12" class="fig-mono">let r1 = &amp;text;</text>
  <text x="40" y="74" font-size="12" class="fig-mono">let r2 = &amp;text;</text>
  <rect class="fig-box" x="50" y="110" width="70" height="34" rx="6"/>
  <text x="85" y="132" text-anchor="middle" font-size="13" class="fig-mono">r1</text>
  <rect class="fig-box" x="140" y="110" width="70" height="34" rx="6"/>
  <text x="175" y="132" text-anchor="middle" font-size="13" class="fig-mono">r2</text>
  <line class="fig-line" x1="85" y1="144" x2="115" y2="200" marker-end="url(#10-borrows-arrow)"/>
  <line class="fig-line" x1="175" y1="144" x2="145" y2="200" marker-end="url(#10-borrows-arrow)"/>
  <text x="76" y="180" text-anchor="end" font-size="12" class="fig-muted">reads</text>
  <text x="184" y="180" font-size="12" class="fig-muted">reads</text>
  <rect class="fig-box" x="85" y="202" width="90" height="36" rx="6"/>
  <text x="130" y="225" text-anchor="middle" font-size="13" class="fig-mono">text</text>
  <text x="130" y="272" text-anchor="middle" font-size="13" class="fig-accent-text">accepted</text>

  <line class="fig-line" x1="250" y1="24" x2="250" y2="280" stroke-dasharray="4 4"/>

  <!-- panel 2: one mutable -->
  <text x="360" y="34" text-anchor="middle" font-size="14" font-weight="600">one mutable borrow</text>
  <text x="270" y="58" font-size="12" class="fig-mono">let w = &amp;mut text;</text>
  <text x="270" y="74" font-size="12" class="fig-mono">w.push('!');</text>
  <rect class="fig-accent" x="325" y="110" width="70" height="34" rx="6"/>
  <text x="360" y="132" text-anchor="middle" font-size="13" class="fig-mono">w</text>
  <line class="fig-accent-line" x1="360" y1="144" x2="360" y2="200" marker-end="url(#10-borrows-arrow)"/>
  <text x="370" y="180" font-size="12" class="fig-muted">writes</text>
  <rect class="fig-box" x="315" y="202" width="90" height="36" rx="6"/>
  <text x="360" y="225" text-anchor="middle" font-size="13" class="fig-mono">text</text>
  <text x="360" y="272" text-anchor="middle" font-size="13" class="fig-accent-text">accepted</text>

  <line class="fig-line" x1="470" y1="24" x2="470" y2="280" stroke-dasharray="4 4"/>

  <!-- panel 3: both -->
  <text x="590" y="34" text-anchor="middle" font-size="14" font-weight="600">both at once</text>
  <text x="490" y="58" font-size="12" class="fig-mono">let r = &amp;text;</text>
  <text x="490" y="74" font-size="12" class="fig-mono">let w = &amp;mut text;</text>
  <text x="490" y="90" font-size="12" class="fig-mono">println!("{r}");</text>
  <rect class="fig-box" x="510" y="110" width="70" height="34" rx="6"/>
  <text x="545" y="132" text-anchor="middle" font-size="13" class="fig-mono">r</text>
  <rect class="fig-accent" x="600" y="110" width="70" height="34" rx="6"/>
  <text x="635" y="132" text-anchor="middle" font-size="13" class="fig-mono">w</text>
  <line class="fig-line" x1="545" y1="144" x2="575" y2="200" marker-end="url(#10-borrows-arrow)"/>
  <line class="fig-accent-line" x1="635" y1="144" x2="605" y2="200" marker-end="url(#10-borrows-arrow)"/>
  <text x="536" y="180" text-anchor="end" font-size="12" class="fig-muted">reads</text>
  <text x="644" y="180" font-size="12" class="fig-muted">writes</text>
  <rect class="fig-box" x="545" y="202" width="90" height="36" rx="6"/>
  <text x="590" y="225" text-anchor="middle" font-size="13" class="fig-mono">text</text>
  <text x="590" y="272" text-anchor="middle" font-size="13" font-weight="600">rejected: E0502</text>
</svg>
