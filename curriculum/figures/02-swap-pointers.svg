<svg viewBox="0 0 720 250" role="img" aria-label="swap_ints receives the addresses of main's x and y, so its writes through a and b change main's variables: x goes from 1 to 2 and y from 2 to 1">
  <defs>
    <marker id="02-swap-pointers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="280" height="210" rx="6"/>
  <text x="40" y="48" font-size="14" font-weight="600">main</text>
  <text class="fig-muted" x="170" y="62" text-anchor="middle" font-size="12">before</text>
  <text class="fig-accent-text" x="225" y="62" text-anchor="middle" font-size="12">after</text>
  <rect class="fig-accent" x="40" y="70" width="220" height="50" rx="6"/>
  <text class="fig-mono" x="60" y="100" font-size="14">int x</text>
  <text class="fig-mono fig-muted" x="170" y="100" text-anchor="middle" font-size="14">1</text>
  <text class="fig-mono fig-accent-text" x="225" y="100" text-anchor="middle" font-size="14">2</text>
  <rect class="fig-accent" x="40" y="150" width="220" height="50" rx="6"/>
  <text class="fig-mono" x="60" y="180" font-size="14">int y</text>
  <text class="fig-mono fig-muted" x="170" y="180" text-anchor="middle" font-size="14">2</text>
  <text class="fig-mono fig-accent-text" x="225" y="180" text-anchor="middle" font-size="14">1</text>
  <rect class="fig-box" x="420" y="20" width="280" height="210" rx="6"/>
  <text x="440" y="48" font-size="14" font-weight="600">swap_ints</text>
  <rect class="fig-box" x="480" y="70" width="200" height="50" rx="6"/>
  <text class="fig-mono" x="500" y="100" font-size="14">int *a</text>
  <text class="fig-mono" x="660" y="100" text-anchor="end" font-size="14">&amp;x</text>
  <rect class="fig-box" x="480" y="150" width="200" height="50" rx="6"/>
  <text class="fig-mono" x="500" y="180" font-size="14">int *b</text>
  <text class="fig-mono" x="660" y="180" text-anchor="end" font-size="14">&amp;y</text>
  <line class="fig-line" x1="480" y1="95" x2="262" y2="95" marker-end="url(#02-swap-pointers-arrow)"/>
  <text class="fig-muted" x="370" y="85" text-anchor="middle" font-size="12">points at</text>
  <line class="fig-line" x1="480" y1="175" x2="262" y2="175" marker-end="url(#02-swap-pointers-arrow)"/>
  <text class="fig-muted" x="370" y="165" text-anchor="middle" font-size="12">points at</text>
</svg>
