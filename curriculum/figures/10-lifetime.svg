<svg viewBox="0 0 720 290" role="img" aria-label="source lives from line 1 until it is dropped on line 4. The borrow inside tok must end before that. A last use on line 3 is inside the span and accepted. A last use on line 5 reaches past the drop and is rejected.">
  <text x="24" y="96" font-size="12" class="fig-muted">1</text>
  <text x="44" y="96" font-size="12" class="fig-mono">let source = String::from("@LOOP 0;JMP");</text>
  <text x="24" y="130" font-size="12" class="fig-muted">2</text>
  <text x="44" y="130" font-size="12" class="fig-mono">let tok = Token { text: &amp;source[1..5] };</text>
  <text x="24" y="164" font-size="12" class="fig-muted">3</text>
  <text x="44" y="164" font-size="12" class="fig-mono">println!("{}", tok.text);</text>
  <text x="24" y="198" font-size="12" class="fig-muted">4</text>
  <text x="44" y="198" font-size="12" class="fig-mono">drop(source);</text>
  <text x="24" y="232" font-size="12" class="fig-muted">5</text>
  <text x="44" y="232" font-size="12" class="fig-mono">println!("{}", tok.text);</text>
  <rect class="fig-box" x="461" y="80" width="18" height="126" rx="6"/>
  <text x="470" y="40" text-anchor="middle" font-size="13" font-weight="600" class="fig-mono">source</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" class="fig-muted">lives</text>
  <rect class="fig-accent" x="551" y="114" width="18" height="58" rx="6"/>
  <text x="560" y="40" text-anchor="middle" font-size="13" font-weight="600" class="fig-mono">'a</text>
  <text x="560" y="58" text-anchor="middle" font-size="12" class="fig-muted">borrow ends</text>
  <rect class="fig-accent" x="641" y="114" width="18" height="126" rx="6"/>
  <text x="650" y="40" text-anchor="middle" font-size="13" font-weight="600" class="fig-mono">'a</text>
  <text x="650" y="58" text-anchor="middle" font-size="12" class="fig-muted">borrow ends</text>
  <text x="560" y="74" text-anchor="middle" font-size="12" class="fig-muted">at line 3</text>
  <text x="650" y="74" text-anchor="middle" font-size="12" class="fig-muted">at line 5</text>
  <line class="fig-line" x1="440" y1="206" x2="680" y2="206" stroke-dasharray="4 3"/>
  <text x="560" y="270" text-anchor="middle" font-size="13" class="fig-accent-text">accepted</text>
  <text x="650" y="270" text-anchor="middle" font-size="13" font-weight="600">E0505</text>
</svg>
