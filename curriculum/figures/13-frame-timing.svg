<svg viewBox="0 0 720 250" role="img" aria-label="One pass of the frame loop on a time line. Work runs from t0 to t1. Present runs from t1 to t2 and waits for the display, which under WSLg also goes through the compositor and RDP. The frame interval runs from one t0 to the next">
  <defs>
    <marker id="13-frame-timing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="40" y="90" width="230" height="44" rx="6"/>
  <text x="155" y="109" text-anchor="middle" font-size="13" font-weight="600">work</text>
  <text class="fig-muted" x="155" y="125" text-anchor="middle" font-size="12">input, game, texture</text>
  <rect class="fig-box" x="270" y="90" width="300" height="44" rx="6"/>
  <text x="420" y="109" text-anchor="middle" font-size="13" font-weight="600">present</text>
  <text class="fig-muted" x="420" y="125" text-anchor="middle" font-size="12">waits for the display</text>
  <rect class="fig-accent" x="570" y="90" width="110" height="44" rx="6"/>
  <text x="625" y="109" text-anchor="middle" font-size="13" font-weight="600">work</text>
  <text class="fig-muted" x="625" y="125" text-anchor="middle" font-size="12">next frame</text>
  <line class="fig-line" x1="40" y1="76" x2="40" y2="148"/>
  <text class="fig-mono" x="40" y="68" text-anchor="start" font-size="12">t0</text>
  <line class="fig-line" x1="270" y1="76" x2="270" y2="148"/>
  <text class="fig-mono" x="270" y="68" text-anchor="start" font-size="12">t1</text>
  <line class="fig-line" x1="570" y1="76" x2="570" y2="148"/>
  <text class="fig-mono" x="570" y="68" text-anchor="middle" font-size="12">t2 = next t0</text>
  <line class="fig-line" x1="40" y1="160" x2="270" y2="160"/>
  <line class="fig-line" x1="40" y1="155" x2="40" y2="165"/>
  <line class="fig-line" x1="270" y1="155" x2="270" y2="165"/>
  <text class="fig-accent-text" x="155" y="178" text-anchor="middle" font-size="12">work time = t1 - t0</text>
  <line class="fig-line" x1="270" y1="160" x2="570" y2="160"/>
  <line class="fig-line" x1="270" y1="155" x2="270" y2="165"/>
  <line class="fig-line" x1="570" y1="155" x2="570" y2="165"/>
  <text class="fig-muted" x="420" y="178" text-anchor="middle" font-size="12">present time = t2 - t1</text>
  <line class="fig-line" x1="40" y1="205" x2="570" y2="205"/>
  <line class="fig-line" x1="40" y1="200" x2="40" y2="210"/>
  <line class="fig-line" x1="570" y1="200" x2="570" y2="210"/>
  <text class="fig-muted" x="305" y="223" text-anchor="middle" font-size="12">frame interval: 16.7 ms at 60 Hz with vsync, rougher under WSLg</text>
</svg>
