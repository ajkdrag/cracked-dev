<svg viewBox="0 0 720 300" role="img" aria-label="The user task loads from the kernel heap. The page walk finds the page present but without the U bit, so the CPU raises a page fault with error code 0x5 and CR2 set to the address. The handler sees USER_MODE in the error code, marks the task dead and waits for the timer, and schedule never picks the task again.">
  <defs>
    <marker id="15-user-fault-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="40" width="210" height="60" rx="6"/>
  <text x="125.0" y="65.5" text-anchor="middle" font-size="13" font-weight="600">user task, ring 3</text>
  <text class="fig-muted" x="125.0" y="83.5" text-anchor="middle" font-size="12">mov rax, [0x4444_4444_0000]</text>
  <rect class="fig-box" x="270" y="40" width="190" height="60" rx="6"/>
  <text x="365.0" y="65.5" text-anchor="middle" font-size="13" font-weight="600">page walk</text>
  <text class="fig-muted" x="365.0" y="83.5" text-anchor="middle" font-size="12">L1 entry: present, no U bit</text>
  <rect class="fig-box" x="500" y="40" width="200" height="60" rx="6"/>
  <text x="600.0" y="65.5" text-anchor="middle" font-size="13" font-weight="600">page fault, vector 14</text>
  <text class="fig-muted" x="600.0" y="83.5" text-anchor="middle" font-size="12">error 0x5, CR2 = address</text>
  <line class="fig-line" x1="230" y1="70" x2="268" y2="70" marker-end="url(#15-user-fault-arrow)"/>
  <line class="fig-line" x1="460" y1="70" x2="498" y2="70" marker-end="url(#15-user-fault-arrow)"/>
  <rect class="fig-box" x="390" y="140" width="310" height="50" rx="6"/>
  <text class="fig-mono" x="545.0" y="160.5" text-anchor="middle" font-size="12">page_fault_handler</text>
  <text class="fig-muted" x="545.0" y="178.5" text-anchor="middle" font-size="12">error code contains USER_MODE?</text>
  <line class="fig-line" x1="600" y1="100" x2="600" y2="138" marker-end="url(#15-user-fault-arrow)"/>
  <rect class="fig-accent" x="390" y="230" width="150" height="54" rx="6"/>
  <text x="465.0" y="252.5" text-anchor="middle" font-size="13" font-weight="600">yes</text>
  <text class="fig-muted" x="465.0" y="270.5" text-anchor="middle" font-size="12">mark dead, hlt</text>
  <rect class="fig-box" x="560" y="230" width="140" height="54" rx="6"/>
  <text x="630.0" y="252.5" text-anchor="middle" font-size="13" font-weight="600">no</text>
  <text class="fig-muted" x="630.0" y="270.5" text-anchor="middle" font-size="12">kernel bug: stop</text>
  <line class="fig-line" x1="465" y1="190" x2="465" y2="228" marker-end="url(#15-user-fault-arrow)"/>
  <line class="fig-line" x1="630" y1="190" x2="630" y2="228" marker-end="url(#15-user-fault-arrow)"/>
  <rect class="fig-box" x="20" y="230" width="300" height="54" rx="6"/>
  <text x="170.0" y="252.5" text-anchor="middle" font-size="13" font-weight="600">next timer interrupt</text>
  <text class="fig-muted" x="170.0" y="270.5" text-anchor="middle" font-size="12">schedule skips the dead task</text>
  <line class="fig-line" x1="388" y1="257" x2="322" y2="257" marker-end="url(#15-user-fault-arrow)"/>
</svg>
