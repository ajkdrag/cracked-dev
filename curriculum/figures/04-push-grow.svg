<svg viewBox="0 0 720 334" role="img" aria-label="Three pushes into an empty int32s: the first push allocates a block of 2, the third allocates a block of 4 and copies 1 and 2 into it. The block of 2 stays behind in the arena, followed by 8 bytes of padding because grow starts every block on a multiple of 16.">
  <defs>
    <marker id="04-push-grow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="fig-mono" x="20" y="36" font-size="13">*push(&amp;v, &amp;a) = 1;</text>
  <text class="fig-muted" x="220" y="36" font-size="12">full (cap 0): new block of 2</text>
  <text class="fig-mono" x="20" y="60" font-size="13">*push(&amp;v, &amp;a) = 2;</text>
  <text class="fig-muted" x="220" y="60" font-size="12">fits</text>
  <text class="fig-mono" x="20" y="84" font-size="13">*push(&amp;v, &amp;a) = 3;</text>
  <text class="fig-muted" x="220" y="84" font-size="12">full (cap 2): new block of 4, copy 1 and 2</text>
  <text class="fig-muted" x="20" y="166" font-size="12">the arena</text>
  <rect class="fig-box" x="110" y="140" width="40" height="40" stroke-dasharray="4 3"/>
  <text class="fig-mono fig-muted" x="130" y="166" text-anchor="middle" font-size="14">1</text>
  <rect class="fig-box" x="150" y="140" width="40" height="40" stroke-dasharray="4 3"/>
  <text class="fig-mono fig-muted" x="170" y="166" text-anchor="middle" font-size="14">2</text>
  <rect class="fig-box" x="190" y="140" width="80" height="40" stroke-dasharray="4 3"/>
  <text class="fig-muted" x="230" y="166" text-anchor="middle" font-size="12">pad</text>
  <rect class="fig-accent" x="270" y="140" width="40" height="40"/>
  <text class="fig-mono" x="290" y="166" text-anchor="middle" font-size="14">1</text>
  <rect class="fig-accent" x="310" y="140" width="40" height="40"/>
  <text class="fig-mono" x="330" y="166" text-anchor="middle" font-size="14">2</text>
  <rect class="fig-accent" x="350" y="140" width="40" height="40"/>
  <text class="fig-mono" x="370" y="166" text-anchor="middle" font-size="14">3</text>
  <rect class="fig-accent" x="390" y="140" width="40" height="40"/>
  <text class="fig-mono" x="410" y="166" text-anchor="middle" font-size="14"></text>
  <rect class="fig-box" x="430" y="140" width="250" height="40"/>
  <text class="fig-muted" x="555" y="166" text-anchor="middle" font-size="12">free</text>
  <text class="fig-muted" x="150" y="200" text-anchor="middle" font-size="12">old block of 2</text>
  <text x="350" y="130" text-anchor="middle" font-size="12">new block of 4</text>
  <rect class="fig-box" x="20" y="230" width="170" height="84" rx="6"/>
  <text class="fig-mono" x="34" y="250" font-size="13" font-weight="600">int32s v</text>
  <text class="fig-mono" x="34" y="268" font-size="13">data</text>
  <circle class="fig-accent-fill" cx="170" cy="264" r="4"/>
  <text class="fig-mono" x="34" y="286" font-size="13">len</text>
  <text class="fig-mono" x="110" y="286" font-size="13">3</text>
  <text class="fig-mono" x="34" y="304" font-size="13">cap</text>
  <text class="fig-mono" x="110" y="304" font-size="13">4</text>
  <line class="fig-accent-line" x1="170" y1="264" x2="290" y2="184" marker-end="url(#04-push-grow-arrow)"/>
</svg>
