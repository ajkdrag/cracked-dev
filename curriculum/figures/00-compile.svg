<svg viewBox="0 0 720 150" role="img" aria-label="clang reads hello.c and writes a.out, a file of machine code, and running ./a.out prints hello, world">
  <defs>
    <marker id="00-compile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="45" width="110" height="60" rx="6"/>
  <text x="75" y="71" text-anchor="middle" font-size="14" font-weight="600">hello.c</text>
  <text class="fig-muted" x="75" y="90" text-anchor="middle" font-size="12">C you write</text>
  <rect class="fig-accent" x="200" y="45" width="110" height="60" rx="6"/>
  <text x="255" y="71" text-anchor="middle" font-size="14" font-weight="600">clang</text>
  <text class="fig-muted" x="255" y="90" text-anchor="middle" font-size="12">the compiler</text>
  <rect class="fig-box" x="380" y="45" width="110" height="60" rx="6"/>
  <text x="435" y="71" text-anchor="middle" font-size="14" font-weight="600">a.out</text>
  <text class="fig-muted" x="435" y="90" text-anchor="middle" font-size="12">machine code</text>
  <rect class="fig-box" x="560" y="45" width="140" height="60" rx="6"/>
  <text x="630" y="70" text-anchor="middle" font-size="14" font-weight="600">terminal</text>
  <text class="fig-mono" x="630" y="91" text-anchor="middle" font-size="12">hello, world</text>
  <line class="fig-line" x1="130" y1="75" x2="198" y2="75" marker-end="url(#00-compile-arrow)"/>
  <text class="fig-muted" x="164" y="65" text-anchor="middle" font-size="12">reads</text>
  <line class="fig-line" x1="310" y1="75" x2="378" y2="75" marker-end="url(#00-compile-arrow)"/>
  <text class="fig-muted" x="344" y="65" text-anchor="middle" font-size="12">writes</text>
  <line class="fig-line" x1="490" y1="75" x2="558" y2="75" marker-end="url(#00-compile-arrow)"/>
  <text class="fig-mono fig-muted" x="524" y="50" text-anchor="middle" font-size="12">./a.out</text>
  <text class="fig-muted" x="524" y="65" text-anchor="middle" font-size="12">prints</text>
</svg>
