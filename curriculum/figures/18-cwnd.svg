<svg viewBox="0 0 720 300" role="img" aria-label="The congestion window over time: slow start doubles it each round trip up to ssthresh, congestion avoidance then grows it by one segment per round trip, three duplicate ACKs halve it, and a timeout drops it to one segment and starts slow start again toward the new, lower ssthresh">
  <defs>
    <marker id="18-cwnd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <line class="fig-line" x1="80" y1="250" x2="690" y2="250" marker-end="url(#18-cwnd-arrow)"/>
  <line class="fig-line" x1="80" y1="250" x2="80" y2="30" marker-end="url(#18-cwnd-arrow)"/>
  <text class="fig-muted" x="690" y="272" text-anchor="end" font-size="12">time, in round trips</text>
  <text class="fig-muted" x="88" y="36" font-size="12">cwnd</text>
  <line class="fig-line" x1="80" y1="114.0" x2="340" y2="114.0" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="340" y1="156.5" x2="496" y2="156.5" stroke-dasharray="4 4"/>
  <line class="fig-line" x1="496" y1="182.0" x2="652" y2="182.0" stroke-dasharray="4 4"/>
  <text class="fig-muted" x="84" y="108.0" font-size="12">ssthresh</text>
  <path class="fig-accent-line" d="M80 242 L106 233 L132 216 L158 182 L184 114 L210 106 L236 97 L262 88 L288 80 L314 72 L340 63 L340 156 L366 148 L392 140 L418 131 L444 122 L470 114 L496 106 L496 242 L522 233 L548 216 L574 182 L600 174 L626 165 L652 156" fill="none"/>
  <circle class="fig-accent-fill" cx="340" cy="63" r="4"/>
  <circle class="fig-accent-fill" cx="496" cy="106" r="4"/>
  <text x="172" y="216.0" font-size="12">slow start</text>
  <text x="262" y="51.0" text-anchor="middle" font-size="12">congestion avoidance</text>
  <text class="fig-accent-text" x="346" y="176.5" font-size="12">3 dup ACKs: halve</text>
  <text class="fig-accent-text" x="488" y="239.5" text-anchor="end" font-size="12">timeout: back to 1</text>
</svg>
