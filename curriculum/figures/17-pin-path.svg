<svg viewBox="0 0 720 280" role="img" aria-label="SIO drives GP25 only after three settings line up: the function select in IO_BANK0 picks input 5, SIO, out of the functions a pin can carry, the pad in PADS_BANK0 has ISO cleared so the signal reaches the pin, and SIO's output enable bit for pin 25 is set. Then SIO's output bit lights the LED.">
  <defs>
    <marker id="17-pin-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-accent" x="20" y="110" width="170" height="90" rx="6"/>
  <text x="105" y="132" text-anchor="middle" font-size="14" font-weight="600">SIO</text>
  <text class="fig-mono" x="105" y="156" text-anchor="middle" font-size="12">GPIO_OE bit 25</text>
  <text class="fig-mono" x="105" y="178" text-anchor="middle" font-size="12">GPIO_OUT bit 25</text>

  <text x="310" y="40" text-anchor="middle" font-size="13" font-weight="600">IO_BANK0</text>
  <text class="fig-mono" x="310" y="58" text-anchor="middle" font-size="12">GPIO25_CTRL.FUNCSEL</text>
  <polygon class="fig-box" points="280,70 340,96 340,214 280,240"/>
  <text x="310" y="160" text-anchor="middle" font-size="12">mux</text>
  <line class="fig-line" x1="230" y1="86" x2="280" y2="86"/>
  <text class="fig-muted" x="224" y="90" text-anchor="end" font-size="12">1 to 4: SPI, UART, I2C, PWM</text>
  <line class="fig-accent-line" x1="190" y1="170" x2="278" y2="170" marker-end="url(#17-pin-path-arrow)"/>
  <text class="fig-accent-text" x="234" y="162" text-anchor="middle" font-size="12">5: SIO</text>
  <line class="fig-line" x1="230" y1="210" x2="280" y2="210"/>
  <text class="fig-muted" x="224" y="214" text-anchor="end" font-size="12">6 and up: PIO</text>

  <line class="fig-accent-line" x1="340" y1="155" x2="398" y2="155" marker-end="url(#17-pin-path-arrow)"/>

  <rect class="fig-accent" x="400" y="100" width="150" height="110" rx="6"/>
  <text x="475" y="122" text-anchor="middle" font-size="13" font-weight="600">PADS_BANK0</text>
  <text class="fig-mono" x="475" y="140" text-anchor="middle" font-size="12">GPIO25</text>
  <text class="fig-mono" x="475" y="164" text-anchor="middle" font-size="12">ISO = 0</text>
  <text class="fig-muted" x="475" y="182" text-anchor="middle" font-size="12">connects the pin</text>
  <text class="fig-muted" x="475" y="200" text-anchor="middle" font-size="12">drive strength, pulls</text>

  <line class="fig-accent-line" x1="550" y1="155" x2="586" y2="155" marker-end="url(#17-pin-path-arrow)"/>
  <circle class="fig-box" cx="606" cy="155" r="18"/>
  <text x="606" y="159" text-anchor="middle" font-size="12">pin</text>
  <text class="fig-mono" x="606" y="194" text-anchor="middle" font-size="12">GP25</text>
  <line class="fig-line" x1="624" y1="155" x2="654" y2="155" marker-end="url(#17-pin-path-arrow)"/>
  <rect class="fig-box" x="656" y="137" width="44" height="36" rx="6"/>
  <text x="678" y="160" text-anchor="middle" font-size="12">LED</text>

  <text class="fig-muted" x="360" y="262" text-anchor="middle" font-size="12">IO_BANK0 and PADS_BANK0 work only after RESETS has released them.</text>
</svg>
