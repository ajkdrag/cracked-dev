<svg viewBox="0 0 720 300" role="img" aria-label="One process seen from two PID namespaces: on the host, mysh is pid 982, a child of unshare. Inside the new namespace the same process is pid 1, and ps there lists only mysh and its own children">
<defs><marker id="08-namespaces-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<rect class="fig-box" x="20" y="20" width="270" height="260" rx="6"/>
<text x="155" y="44" text-anchor="middle" font-size="13" font-weight="600">host PID namespace</text>
<rect class="fig-box" x="430" y="20" width="270" height="260" rx="6"/>
<text x="565" y="44" text-anchor="middle" font-size="13" font-weight="600">new PID namespace</text>
<rect class="fig-box" x="40" y="70" width="230" height="28" rx="6"/>
<text class="fig-mono" x="60" y="89" font-size="13">1</text>
<text class="fig-mono" x="130" y="89" font-size="13">init</text>
<rect class="fig-box" x="40" y="104" width="230" height="28" rx="6"/>
<text class="fig-mono" x="60" y="123" font-size="13">412</text>
<text class="fig-mono" x="130" y="123" font-size="13">bash</text>
<rect class="fig-box" x="40" y="138" width="230" height="28" rx="6"/>
<text class="fig-mono" x="60" y="157" font-size="13">980</text>
<text class="fig-mono" x="130" y="157" font-size="13">sudo</text>
<rect class="fig-box" x="40" y="172" width="230" height="28" rx="6"/>
<text class="fig-mono" x="60" y="191" font-size="13">981</text>
<text class="fig-mono" x="130" y="191" font-size="13">unshare</text>
<rect class="fig-accent" x="40" y="206" width="230" height="28" rx="6"/>
<text class="fig-mono" x="60" y="225" font-size="13">982</text>
<text class="fig-mono" x="130" y="225" font-size="13">mysh</text>
<rect class="fig-box" x="40" y="240" width="230" height="28" rx="6"/>
<text class="fig-mono" x="60" y="259" font-size="13">990</text>
<text class="fig-mono" x="130" y="259" font-size="13">ps</text>
<rect class="fig-accent" x="450" y="206" width="230" height="28" rx="6"/>
<text class="fig-mono" x="470" y="225" font-size="13">1</text>
<text class="fig-mono" x="540" y="225" font-size="13">mysh</text>
<rect class="fig-box" x="450" y="240" width="230" height="28" rx="6"/>
<text class="fig-mono" x="470" y="259" font-size="13">2</text>
<text class="fig-mono" x="540" y="259" font-size="13">ps</text>
<line class="fig-line" x1="272" y1="220" x2="448" y2="220" stroke-dasharray="4 3"/>
<line class="fig-line" x1="272" y1="254" x2="448" y2="254" stroke-dasharray="4 3"/>
<text class="fig-muted" x="360" y="200" text-anchor="middle" font-size="12">same process</text>
<text class="fig-muted" x="565" y="118" text-anchor="middle" font-size="12">init, bash, sudo and unshare</text>
<text class="fig-muted" x="565" y="134" text-anchor="middle" font-size="12">are not visible here</text>
</svg>
