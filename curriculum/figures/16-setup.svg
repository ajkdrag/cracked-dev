<svg viewBox="0 0 720 300" role="img" aria-label="QEMU runs inside WSL2's Ubuntu and boots your kernel with the initramfs and the edu device. The arrows show what QEMU loads, the directory it shares at /mnt and the port gdb connects to.">
  <defs>
    <marker id="16-setup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="fig-box" x="20" y="20" width="680" height="260" rx="6"/>
  <text x="40" y="46" font-size="14" font-weight="600">WSL2: Ubuntu 24.04 on Microsoft's kernel</text>
  <rect class="fig-box" x="316" y="60" width="368" height="208" rx="6"/>
  <text x="500" y="82" text-anchor="middle" font-size="13" font-weight="600">qemu-system-x86_64, an ordinary process</text>

  <rect class="fig-box" x="40" y="96" width="190" height="48" rx="6"/>
  <text class="fig-mono" x="135" y="116" text-anchor="middle" font-size="13">~/code/drivers</text>
  <text class="fig-muted" x="135" y="134" text-anchor="middle" font-size="12">modules, tests, initramfs</text>

  <rect class="fig-box" x="40" y="152" width="190" height="48" rx="6"/>
  <text class="fig-mono" x="135" y="172" text-anchor="middle" font-size="13">~/code/linux-6.18.64</text>
  <text class="fig-muted" x="135" y="190" text-anchor="middle" font-size="12">bzImage, vmlinux</text>

  <rect class="fig-box" x="40" y="208" width="190" height="48" rx="6"/>
  <text class="fig-mono" x="135" y="228" text-anchor="middle" font-size="13">gdb vmlinux</text>
  <text class="fig-muted" x="135" y="246" text-anchor="middle" font-size="12">stops and inspects the guest</text>

  <rect class="fig-box" x="332" y="96" width="336" height="48" rx="6"/>
  <text x="500" y="116" text-anchor="middle" font-size="13" font-weight="600">/init, busybox sh, your tests</text>
  <text class="fig-muted" x="500" y="134" text-anchor="middle" font-size="12">from the initramfs and from /mnt</text>

  <rect class="fig-accent" x="332" y="152" width="208" height="48" rx="6"/>
  <text x="436" y="172" text-anchor="middle" font-size="13" font-weight="600">your kernel 6.18.64</text>
  <text class="fig-muted" x="436" y="190" text-anchor="middle" font-size="12">unpacks the initramfs</text>
  <rect class="fig-accent" x="548" y="152" width="120" height="48" rx="6"/>
  <text class="fig-mono" x="608" y="172" text-anchor="middle" font-size="13">edu.ko</text>
  <text class="fig-muted" x="608" y="190" text-anchor="middle" font-size="12">your module</text>

  <rect class="fig-box" x="332" y="208" width="208" height="48" rx="6"/>
  <text x="436" y="228" text-anchor="middle" font-size="13" font-weight="600">emulated PC</text>
  <text class="fig-muted" x="436" y="246" text-anchor="middle" font-size="12">CPU, RAM, serial port ttyS0</text>
  <rect class="fig-box" x="548" y="208" width="120" height="48" rx="6"/>
  <text x="608" y="228" text-anchor="middle" font-size="13" font-weight="600">edu device</text>
  <text class="fig-muted" x="608" y="246" text-anchor="middle" font-size="12">PCI 1234:11e8</text>

  <line class="fig-line" x1="230" y1="126" x2="330" y2="126" marker-end="url(#16-setup-arrow)"/>
  <text class="fig-muted" x="273" y="118" text-anchor="middle" font-size="12">-initrd</text>
  <text class="fig-muted" x="273" y="142" text-anchor="middle" font-size="12">9p, /mnt</text>
  <line class="fig-line" x1="230" y1="182" x2="330" y2="182" marker-end="url(#16-setup-arrow)"/>
  <text class="fig-muted" x="273" y="174" text-anchor="middle" font-size="12">-kernel</text>
  <line class="fig-line" x1="230" y1="238" x2="330" y2="238" marker-end="url(#16-setup-arrow)"/>
  <text class="fig-muted" x="273" y="230" text-anchor="middle" font-size="12">port 1234</text>
</svg>
